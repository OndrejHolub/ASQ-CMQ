<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASQ CMQ/OE — Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════
   TOKENS
════════════════════════════════════════ */
:root {
  --black:    #07090C;
  --s0:       #0B0E12;
  --s1:       #111520;
  --s2:       #16192A; /* Slightly purple-dark — richer */
  --s3:       #1C2030;
  --border:   rgba(255,255,255,.07);
  --border2:  rgba(255,255,255,.12);

  --text:     #C8C2B4;   /* warm parchment */
  --text-dim: #5E6270;
  --text-hi:  #EDE8DC;   /* near-white warm */

  --gold:     #C09A52;   /* Tesla amber/gold */
  --gold-hi:  #D4B06A;
  --gold-dim: rgba(192,154,82,.12);
  --gold-glow:rgba(192,154,82,.25);
  --blue:     #5B8FDB;
  --green:    #4BAE82;

  --sidebar:  260px;
  --serif:    'Cormorant Garamond', 'Georgia', serif;
  --sans:     'DM Sans', 'Helvetica Neue', sans-serif;
  --mono:     'JetBrains Mono', 'Courier New', monospace;

  --ease:     cubic-bezier(.22,.68,0,1.2);
  --ease2:    cubic-bezier(.16,.84,.44,1);
}

/* ════════════════════════════════════════
   RESET & BASE
════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 15px; }
body {
  font-family: var(--sans);
  background: var(--black);
  color: var(--text);
  line-height: 1.72;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  pointer-events: none;
  z-index: 0;
  opacity: .4;
}
#app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

/* ════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════ */
#sidebar {
  width: var(--sidebar);
  min-width: var(--sidebar);
  background: var(--s1);
  border-right: 1px solid var(--border);
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: var(--s3) transparent;
}
#sidebar::-webkit-scrollbar { width: 3px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--s3); }

.sidebar-brand {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--s1);
  z-index: 10;
  cursor: pointer;
}
.brand-label {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 5px;
}
.brand-title {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  color: var(--text-hi);
  letter-spacing: .01em;
  line-height: 1.25;
}

/* Search */
.search-wrap {
  padding: 14px 16px 0;
  position: relative;
}
.search-input {
  width: 100%;
  background: var(--s0);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-family: var(--sans);
  font-size: 12.5px;
  padding: 8px 10px 8px 30px;
  outline: none;
  transition: border-color .2s, background .2s;
}
.search-input:focus { border-color: var(--gold); background: var(--s1); }
.search-input::placeholder { color: var(--text-dim); }
.search-icon {
  position: absolute;
  left: 27px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 12px;
  pointer-events: none;
}
.search-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 16px; right: 16px;
  background: var(--s2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  max-height: 280px;
  overflow-y: auto;
  z-index: 300;
  box-shadow: 0 12px 40px rgba(0,0,0,.7);
  display: none;
}
.sr-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
}
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: var(--s3); }
.sr-ch { font-size: 12.5px; color: var(--text-hi); font-weight: 500; margin-bottom: 2px; }
.sr-ctx { font-size: 11.5px; color: var(--text-dim); line-height: 1.4; }
.sr-hi { color: var(--gold); font-weight: 600; }

/* Nav */
.nav-scroll { padding: 10px 0 20px; }

.part-head {
  padding: 18px 20px 5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.part-num {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.part-icon { font-size: 11px; color: var(--text-dim); }

.nav-ch {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: border-color .2s var(--ease2), background .15s;
  text-decoration: none;
  position: relative;
}
.nav-ch:hover { background: rgba(255,255,255,.028); }
.nav-ch.active {
  border-left-color: var(--gold);
  background: var(--gold-dim);
}
.nav-ch-inner {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 18px 6px 16px;
  width: 100%;
}
.nav-ch-icon { font-size: 13px; min-width: 16px; }
.nav-ch-text {
  font-size: 12.5px;
  color: var(--text-dim);
  line-height: 1.35;
  transition: color .15s;
  flex: 1;
}
.nav-ch:hover .nav-ch-text { color: var(--text); }
.nav-ch.active .nav-ch-text { color: var(--gold-hi); }
.nav-done {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; color: #000; font-weight: 800;
  opacity: 0;
  transition: opacity .25s;
  flex-shrink: 0;
}
.nav-ch.done .nav-done { opacity: 1; }

/* Progress */
.progress-block {
  margin-top: auto;
  padding: 14px 20px 18px;
  border-top: 1px solid var(--border);
}
.progress-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: .04em;
}
.progress-label { text-transform: uppercase; letter-spacing: .1em; }
.progress-track {
  height: 2px;
  background: var(--s3);
  border-radius: 1px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold-hi));
  border-radius: 1px;
  transition: width .5s var(--ease2);
}

/* ════════════════════════════════════════
   MAIN
════════════════════════════════════════ */
#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: rgba(7,9,12,.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
#menu-toggle {
  display: none;
  background: none;
  border: 1px solid var(--border2);
  border-radius: 3px;
  color: var(--text);
  padding: 5px 9px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}
.breadcrumb {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: .03em;
}
.breadcrumb em { color: var(--text); font-style: normal; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.btn {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: 7px 16px;
  border-radius: 2px;
  border: 1px solid;
  cursor: pointer;
  transition: all .18s var(--ease2);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.btn-ghost {
  background: transparent;
  border-color: var(--border2);
  color: var(--text-dim);
}
.btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
.btn-gold {
  background: var(--gold-dim);
  border-color: rgba(192,154,82,.35);
  color: var(--gold-hi);
}
.btn-gold:hover { background: rgba(192,154,82,.2); border-color: var(--gold); }
.btn-done {
  background: rgba(75,174,130,.15);
  border-color: rgba(75,174,130,.4);
  color: var(--green);
}

/* Content area */
#content {
  flex: 1;
  padding: 52px 56px 100px;
  max-width: 860px;
  animation: fadeIn .25s var(--ease2);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ════════════════════════════════════════
   CHAPTER HEADER
════════════════════════════════════════ */
.ch-head { margin-bottom: 48px; }
.ch-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.tag {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 2px;
}
.tag-part { background: rgba(91,143,219,.1); color: var(--blue); border: 1px solid rgba(91,143,219,.2); }
.tag-bok  { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(192,154,82,.2); }
.ch-icon-large { font-size: 32px; margin-bottom: 14px; }
.ch-title {
  font-family: var(--serif);
  font-size: 38px;
  font-weight: 500;
  color: var(--text-hi);
  line-height: 1.15;
  letter-spacing: -.01em;
  margin-bottom: 0;
}
.ch-title-num {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 400;
  color: var(--text-dim);
  font-style: italic;
  margin-bottom: 6px;
  display: block;
}
.ch-divider {
  margin: 20px 0 0;
  height: 1px;
  background: linear-gradient(90deg, var(--border2) 0%, transparent 60%);
  border: none;
}

/* ════════════════════════════════════════
   TYPOGRAPHY
════════════════════════════════════════ */
h2 {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  color: var(--text-hi);
  letter-spacing: -.01em;
  margin: 44px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
h3 {
  font-family: var(--sans);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-hi);
  letter-spacing: .03em;
  margin: 28px 0 10px;
  text-transform: uppercase;
}
h4 {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--gold);
  margin: 18px 0 8px;
}
p { margin-bottom: 13px; font-size: 14.5px; }
ul, ol {
  padding-left: 20px;
  margin-bottom: 14px;
}
li { margin-bottom: 5px; font-size: 14.5px; line-height: 1.65; }
li::marker { color: var(--gold-dim); }
strong { color: var(--text-hi); font-weight: 500; }
em { color: var(--text-dim); font-style: italic; }

/* ════════════════════════════════════════
   CALLOUTS
════════════════════════════════════════ */
.exam-tip {
  position: relative;
  background: linear-gradient(135deg, rgba(192,154,82,.07) 0%, rgba(192,154,82,.04) 100%);
  border: 1px solid rgba(192,154,82,.2);
  border-left: 2px solid var(--gold);
  border-radius: 3px;
  padding: 15px 18px 14px;
  margin: 20px 0;
  font-size: 13.5px;
  line-height: 1.65;
}
.exam-tip::before {
  content: 'EXAM TIP';
  display: block;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .2em;
  color: var(--gold);
  margin-bottom: 7px;
  opacity: .9;
}

.formula {
  background: var(--s2);
  border: 1px solid var(--border2);
  border-left: 2px solid var(--blue);
  border-radius: 3px;
  padding: 11px 16px;
  margin: 12px 0;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--blue);
  line-height: 1.7;
}

.model-box {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 16px 20px;
  margin: 16px 0;
}
.model-box h4 { margin-top: 0; }

/* ════════════════════════════════════════
   TABLES
════════════════════════════════════════ */
.kt-table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 13px;
}
.kt-table thead tr {
  background: var(--s2);
  border-bottom: 1px solid var(--border2);
}
.kt-table th {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  padding: 9px 14px;
  text-align: left;
  border: 1px solid var(--border);
}
.kt-table td {
  padding: 9px 14px;
  border: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.6;
  font-size: 13.5px;
}
.kt-table tbody tr:nth-child(even) td { background: rgba(255,255,255,.017); }
.kt-table tbody tr:hover td { background: rgba(255,255,255,.03); }
.kt-table td:first-child {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-hi);
  white-space: nowrap;
}

/* ════════════════════════════════════════
   HOME PAGE
════════════════════════════════════════ */
.home {
  padding: 60px 56px 80px;
  max-width: 860px;
  animation: fadeIn .3s var(--ease2);
}
.home-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.home-eyebrow::before {
  content: '';
  display: block;
  width: 32px;
  height: 1px;
  background: var(--gold);
  opacity: .5;
}
.home-title {
  font-family: var(--serif);
  font-size: 52px;
  font-weight: 500;
  color: var(--text-hi);
  line-height: 1.1;
  letter-spacing: -.02em;
  margin-bottom: 8px;
}
.home-title span { font-style: italic; color: var(--gold); }
.home-sub {
  font-size: 16px;
  color: var(--text-dim);
  margin-bottom: 48px;
  max-width: 520px;
  line-height: 1.7;
}
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 56px;
}
.stat-cell {
  background: var(--s1);
  padding: 24px 24px 20px;
}
.stat-num {
  font-family: var(--serif);
  font-size: 42px;
  font-weight: 500;
  color: var(--text-hi);
  line-height: 1;
  margin-bottom: 6px;
  letter-spacing: -.02em;
}
.stat-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* Blueprint section */
.blueprint {
  margin-bottom: 48px;
}
.section-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.domain-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .12s;
  margin: 0 -12px;
  padding: 12px 12px;
  border-radius: 2px;
}
.domain-item:hover { background: var(--gold-dim); }
.domain-id {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  width: 22px;
  flex-shrink: 0;
}
.domain-name {
  font-size: 14px;
  color: var(--text);
  flex: 1;
}
.domain-qs {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
  width: 36px;
  text-align: right;
}
.domain-pct {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-hi);
  width: 42px;
  text-align: right;
  flex-shrink: 0;
}
.domain-bar-w {
  width: 120px;
  flex-shrink: 0;
}
.domain-bar-t {
  height: 3px;
  background: var(--s3);
  border-radius: 2px;
  overflow: hidden;
}
.domain-bar-f {
  height: 100%;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-hi) 100%);
  border-radius: 2px;
}

.priority-box {
  background: var(--s1);
  border: 1px solid var(--border);
  border-left: 2px solid var(--gold);
  border-radius: 3px;
  padding: 18px 22px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text-dim);
}
.priority-box strong { color: var(--text-hi); }

/* ════════════════════════════════════════
   CHAPTER NAVIGATION
════════════════════════════════════════ */
.ch-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  gap: 12px;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px 18px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  transition: all .18s var(--ease2);
  font-family: var(--sans);
  max-width: 320px;
}
.nav-btn:hover { border-color: var(--border2); background: var(--s2); }
.nav-btn.disabled { opacity: .3; cursor: default; pointer-events: none; }
.nav-btn-dir {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.nav-btn-title {
  font-size: 13.5px;
  color: var(--text);
  line-height: 1.3;
}
.nav-btn.next { text-align: right; margin-left: auto; }

/* ════════════════════════════════════════
   OVERLAY / MOBILE
════════════════════════════════════════ */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 90;
  backdrop-filter: blur(4px);
}
.overlay.open { display: block; }

@media (max-width: 800px) {
  #sidebar {
    position: fixed;
    left: -100%;
    transition: left .28s var(--ease2);
    z-index: 100;
  }
  #sidebar.open { left: 0; }
  #menu-toggle { display: flex; }
  #content, .home { padding: 32px 24px 80px; }
  .topbar { padding: 0 20px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .home-title { font-size: 36px; }
  .domain-bar-w { display: none; }
  .ch-title { font-size: 28px; }
}
</style>
</head>
<body>
<div id="app">

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-brand" onclick="loadHome()">
    <div class="brand-label">ASQ CMQ/OE</div>
    <div class="brand-title">Complete Study Guide</div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" id="search-input" type="text" placeholder="Search all chapters…" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>

  <div class="nav-scroll" id="nav-area"></div>

1:{icon:'🏢',title:'Organizational Structures',bok:'I.A',part:'I',content:`
<h2>Evolution of Quality</h2>
<p><strong>Timeline:</strong> 1920s SPC (Shewhart at Bell Labs) → Post-WWII Deming brings SPC to Japan → 1980s TQM (Deming/Juran/Crosby/Feigenbaum) → BPR → Six Sigma → Lean-Six Sigma → BPM</p>
<div class="exam-tip">Know the chronological evolution: SPC → TQM → BPR → Six Sigma → BPM. Know key quality gurus and contributions for each era.</div>

<h2>Organizational Design — 3 Core Factors</h2>
<ul>
<li><strong>Complexity</strong> — number of distinct entities (job titles, departments, locations, reporting levels)</li>
<li><strong>Formalization</strong> — degree to which standard guidelines and procedures direct behavior</li>
<li><strong>Centralization</strong> — whether decision-making authority sits at the top or is delegated downward</li>
</ul>
<h3>Vertical Design: Unity of Command</h3>
<p>Each subordinate reports to only one superior. <strong>Span of control</strong> = how many subordinates a manager can effectively supervise. Flat orgs = wider spans, fewer layers = faster decisions.</p>
<div class="exam-tip">Span of control factors are frequently tested: task complexity, subordinate experience, physical proximity, standardization of procedures, management information systems.</div>

<h2>Organizational Structure Types</h2>
<table class="kt-table"><thead><tr><th>Structure</th><th>Key Feature</th><th>Best For</th></tr></thead><tbody>
<tr><td>Functional</td><td>Grouped by specialty (engineering, finance, HR)</td><td>Most common; clear authority lines</td></tr>
<tr><td>Product</td><td>Dedicated executive per product line</td><td>Diverse product portfolios</td></tr>
<tr><td>Customer</td><td>Organized by customer segments</td><td>Distinct customer groups with unique needs</td></tr>
<tr><td>Geographic</td><td>Organized by territory/region</td><td>Geographically dispersed customers</td></tr>
<tr><td>Process</td><td>Organized around production flow</td><td>Sequential manufacturing workflows</td></tr>
<tr><td>Matrix</td><td>Dual reporting: functional + project manager</td><td>Complex aerospace/R&D orgs; SpaceX model</td></tr>
<tr><td>Cellular</td><td>Self-contained unit for all operations on a product</td><td>Lean manufacturing cells</td></tr>
<tr><td>Boundaryless/Network</td><td>Breaks down hierarchy and geographic barriers</td><td>Virtual orgs; startups</td></tr>
</tbody></table>
<div class="exam-tip">Matrix organizations are the most heavily tested structure. Pros: rapid response to change, efficient specialist use. Cons: dual reporting conflict, power struggles. Developed in 1960s U.S. aerospace industry.</div>

<h2>Management Hierarchy Levels</h2>
<ul>
<li><strong>Top Management:</strong> Sets vision, mission, strategic objectives; allocates resources; monitors results</li>
<li><strong>Middle Management:</strong> Translates strategy to operational plans; day-to-day communication; bridges top and front-line</li>
<li><strong>First-Level Supervision:</strong> Oversees production directly; schedules; assigns work; communicates problems upward</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Unity of Command</td><td>Each subordinate reports to only one superior</td></tr>
<tr><td>Span of Control</td><td>Number of subordinates a manager can effectively supervise</td></tr>
<tr><td>Centralization</td><td>Decision authority concentrated at top levels</td></tr>
<tr><td>Decentralization</td><td>Decision authority delegated to lower levels</td></tr>
<tr><td>Matrix Organization</td><td>Dual reporting — functional + product/project managers</td></tr>
<tr><td>Division of Labor</td><td>Breaking work into specialized steps performed by different individuals</td></tr>
<tr><td>Boundaryless Org</td><td>Network structure eliminating traditional hierarchical barriers</td></tr>
<tr><td>BPM</td><td>Business Process Management — documenting, understanding, managing key processes</td></tr>
</tbody></table>`},

2:{icon:'🎯',title:'Leadership Challenges',bok:'I.B',part:'I',content:`
<h2>Leader vs. Manager</h2>
<table class="kt-table"><thead><tr><th>Aspect</th><th>Leader</th><th>Manager</th></tr></thead><tbody>
<tr><td>Focus</td><td>Doing the RIGHT things</td><td>Doing things RIGHT</td></tr>
<tr><td>Authority</td><td>Earned through followers</td><td>Granted by position/title</td></tr>
<tr><td>Orientation</td><td>Vision, change, inspiration</td><td>Planning, organizing, controlling</td></tr>
<tr><td>Output</td><td>Produces CHANGE</td><td>Produces ORDER and results</td></tr>
</tbody></table>

<h2>Leadership Styles</h2>
<ul>
<li><strong>Transactional:</strong> Exchange-based — clear tasks, clear rewards. Contractual relationship. "Gets work done by providing resources."</li>
<li><strong>Transformational:</strong> Articulates vision; elevates subordinate goals; enhances self-confidence. Example: Bob Galvin transforming Motorola via Six Sigma.</li>
<li><strong>Charismatic:</strong> Gathers followers through personal motivation and persuasion power. Can work behind scenes or very visibly.</li>
</ul>
<div class="exam-tip">Transactional (exchange/contract/rewards) vs. Transformational (vision/values/change) is heavily tested. Transformational leadership = vision + values + change. Transactional = clear tasks + rewards.</div>

<h2>Goleman's 5 Dimensions of Emotional Intelligence</h2>
<table class="kt-table"><thead><tr><th>Dimension</th><th>Key Elements</th></tr></thead><tbody>
<tr><td>Self-awareness</td><td>Emotional self-assessment, accurate self-assessment, self-confidence</td></tr>
<tr><td>Self-regulation</td><td>Trustworthiness, conscientiousness, adaptability, innovation</td></tr>
<tr><td>Motivation</td><td>Achievement drive, commitment, initiative, optimism</td></tr>
<tr><td>Empathy</td><td>Understanding others, developing others, service orientation, diversity leverage</td></tr>
<tr><td>Social Skills</td><td>Influence, communication, conflict management, collaboration, team capabilities</td></tr>
</tbody></table>
<div class="exam-tip">All 5 Goleman EI dimensions are tested. Memorize the order and examples. The exam may ask which dimension encompasses a given behavior.</div>

<h2>Kotter's 8-Step Change Model</h2>
<ol>
<li>Create urgency — make the case for change compellingly</li>
<li>Build a guiding coalition with sufficient authority</li>
<li>Define vision and strategies</li>
<li>Communicate vision — demonstrate personal commitment</li>
<li>Remove obstacles to acting on the vision</li>
<li>Secure early, visible wins</li>
<li>Build on success; reward supporters; expand participation</li>
<li>Anchor new methods in systems, culture, and structures</li>
</ol>
<div class="exam-tip">Know all 8 steps AND the 6 common errors: insufficient urgency, weak coalition, no clear vision, under-communicating, obstacles left standing, premature victory declaration.</div>

<h2>Motivation Theories</h2>
<div class="model-box">
<h4>Maslow's Hierarchy (bottom to top)</h4>
<p>1. Physiological → 2. Safety → 3. Belonging → 4. Esteem → 5. Self-actualization</p>
<p><em>People must satisfy lower-level needs before higher-level needs become motivating.</em></p>
</div>
<div class="model-box">
<h4>Herzberg's Two-Factor Theory</h4>
<p><strong>Satisfiers (Motivators):</strong> Achievement, recognition, work itself, responsibility, advancement → create satisfaction</p>
<p><strong>Dissatisfiers (Hygiene Factors):</strong> Company policy, supervision, salary, work conditions → prevent dissatisfaction but don't create satisfaction</p>
</div>
<p><strong>Additional:</strong> McClelland (achievement/affiliation/power), Vroom's Expectancy Theory, Reinforcement Theory, McGregor Theory X/Y</p>

<h2>Hersey & Blanchard Situational Leadership</h2>
<table class="kt-table"><thead><tr><th>Style</th><th>Task</th><th>Relationship</th><th>Follower Maturity</th></tr></thead><tbody>
<tr><td>Telling (S1)</td><td>High</td><td>Low</td><td>New, inexperienced — needs specific instructions</td></tr>
<tr><td>Selling (S2)</td><td>High</td><td>High</td><td>Some experience — decisions still explained</td></tr>
<tr><td>Participating (S3)</td><td>Low</td><td>High</td><td>Experienced — leader facilitates decisions</td></tr>
<tr><td>Delegating (S4)</td><td>Low</td><td>Low</td><td>Highly experienced, autonomous — minimal supervision</td></tr>
</tbody></table>

<h2>Conflict-Handling Modes (Thomas-Kilmann)</h2>
<table class="kt-table"><thead><tr><th>Mode</th><th>Assert.</th><th>Coop.</th><th>Outcome</th></tr></thead><tbody>
<tr><td>Competing</td><td>High</td><td>Low</td><td>Win-lose</td></tr>
<tr><td>Collaborating</td><td>High</td><td>High</td><td>Win-win — PREFERRED for complex issues</td></tr>
<tr><td>Compromising</td><td>Med</td><td>Med</td><td>Partial win-win</td></tr>
<tr><td>Avoiding</td><td>Low</td><td>Low</td><td>No resolution — temporary only</td></tr>
<tr><td>Accommodating</td><td>Low</td><td>High</td><td>Other party wins</td></tr>
</tbody></table>

<h2>Empowerment Terms</h2>
<ul>
<li><strong>Job enlargement:</strong> More tasks at same level — horizontal scope expansion</li>
<li><strong>Job enrichment:</strong> More decision-making authority — vertical depth expansion</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Transformational Leadership</td><td>Articulates vision; elevates subordinates' goals; enhances self-confidence</td></tr>
<tr><td>Transactional Leadership</td><td>Contractual — clear tasks exchange for clear rewards</td></tr>
<tr><td>Change Agent</td><td>Individual who facilitates planning and implementation of change</td></tr>
<tr><td>Kotter's 8 Steps</td><td>Urgency → Coalition → Vision → Communicate → Empower → Short wins → Build → Anchor</td></tr>
<tr><td>Job Enlargement</td><td>Expanding scope horizontally (more tasks, same level)</td></tr>
<tr><td>Job Enrichment</td><td>Expanding depth vertically (more decision authority)</td></tr>
<tr><td>TRIZ</td><td>Inventive problem-solving methodology using 40 inventive principles</td></tr>
<tr><td>Socratic Method</td><td>Using guided questions to develop critical thinking</td></tr>
</tbody></table>`},

3:{icon:'🧑‍🤝‍🧑',title:'Teams and Team Processes',bok:'I.C',part:'I',content:`
<h2>Team Types</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Key Characteristics</th><th>Best Context</th></tr></thead><tbody>
<tr><td>Self-Managed</td><td>Authorized to make day-to-day operational decisions (scheduling, quality, maintenance)</td><td>Greenfield sites — difficult to implement in existing culture</td></tr>
<tr><td>Process Improvement</td><td>Cross-functional, project-based, defined start/end; management sponsor required</td><td>Targeted process optimization</td></tr>
<tr><td>Ad Hoc / Temporary</td><td>Formed for specific emergency/problem; less formal structure</td><td>Immediate response to specific incident</td></tr>
<tr><td>Work Group (Natural)</td><td>Responsible for specific process or product line</td><td>Ongoing operational area</td></tr>
<tr><td>Cellular</td><td>U-shaped layout; operators cross-trained across all steps</td><td>Lean manufacturing; tight takt time</td></tr>
<tr><td>Special Project</td><td>Long-term dedicated team — reengineering, mergers, system replacement</td><td>Strategic transformation initiatives</td></tr>
<tr><td>Virtual</td><td>Geographically dispersed; communicate via technology</td><td>Global organizations; distributed workforce</td></tr>
</tbody></table>
<div class="exam-tip">Self-managed teams work BEST at greenfield sites. Cultural change is too dramatic in existing organizations. Virtual and self-managed teams are most frequently tested.</div>

<h2>Tuckman's 5 Stages</h2>
<table class="kt-table"><thead><tr><th>Stage</th><th>What Happens</th><th>Leader Style</th></tr></thead><tbody>
<tr><td>Forming</td><td>Orientation; polite; roles established; testing boundaries</td><td>Directive</td></tr>
<tr><td>Storming</td><td>Conflict; challenge authority; most critical stage</td><td>Coaching</td></tr>
<tr><td>Norming</td><td>Cohesion; conflict resolved; norms established; cooperation</td><td>Supportive</td></tr>
<tr><td>Performing</td><td>High productivity; autonomous; focused on goals</td><td>Delegating</td></tr>
<tr><td>Adjourning</td><td>Disbands after mission; recognition and closure</td><td>Celebrating</td></tr>
</tbody></table>

<h2>Key Team Roles</h2>
<table class="kt-table"><thead><tr><th>Role</th><th>Core Responsibility</th><th>Key Distinction</th></tr></thead><tbody>
<tr><td>Team Leader</td><td>Coordinates meetings; guides team; reports progress</td><td>Involved in CONTENT; has vested interest in outcome</td></tr>
<tr><td>Facilitator</td><td>Guides process; ensures participation; keeps on track</td><td>NEUTRAL; does NOT get involved in content decisions</td></tr>
<tr><td>Process Owner</td><td>Accountable for outcomes; authority over the process</td><td>Can override team decisions on process scope</td></tr>
<tr><td>Champion/Sponsor</td><td>Provides authority, resources; removes barriers</td><td>High enough to address cross-functional issues</td></tr>
<tr><td>Scribe</td><td>Documents all decisions and action items</td><td>Can participate while recording</td></tr>
</tbody></table>
<div class="exam-tip">The key distinction: Team Leader is involved in CONTENT and has a stake in the outcome. Facilitator focuses on PROCESS, is impartial, and does not get involved in content decisions.</div>

<h2>Groupthink</h2>
<p>Occurs when the team prioritizes harmony over honest evaluation. Members coalesce around a decision without full exploration — often a sign the team is in "Norming" stage but hasn't built real psychological safety.</p>
<p><strong>Prevention:</strong> Assign devil's advocate; brainstorm alternatives before selecting; encourage members to express concerns; allow adequate time for all ideas; use structured decision-making (NGT).</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Groupthink</td><td>Team consensus overrides critical evaluation; harmony over honesty</td></tr>
<tr><td>Consensus</td><td>Decision acceptable enough that ALL members will actively support it</td></tr>
<tr><td>Charter</td><td>Formal document defining team's authority, scope, sponsor, methodology</td></tr>
<tr><td>KESAM</td><td>Knowledge, Experience, Skills, Attitude, Additional comments — team selection criteria</td></tr>
</tbody></table>`},

4:{icon:'⚖️',title:'ASQ Code of Ethics',bok:'I.D',part:'I',content:`
<h2>Three Pillars of the ASQ Code</h2>
<h3>A — Integrity and Honesty</h3>
<ul>
<li>Uphold the honor and dignity of the quality profession</li>
<li>Be truthful and transparent in all professional interactions</li>
<li>Accurately represent qualifications, competence, and experience</li>
<li>Only offer services and undertake assignments within your areas of competence</li>
</ul>
<h3>B — Responsibility</h3>
<ul>
<li><strong>Hold paramount</strong> the safety, health, and welfare of individuals, the public, and the environment</li>
<li>Avoid conduct that causes harm through words or deeds</li>
<li>Treat others fairly, courteously, with dignity; without prejudice or discrimination</li>
<li>Act professionally and socially responsibly</li>
</ul>
<h3>C — Safeguard Information / Avoid Conflicts of Interest</h3>
<ul>
<li>Ensure protection and integrity of confidential information</li>
<li><strong>Never</strong> use confidential information for personal gain — regardless of circumstances</li>
<li>Fully disclose any real or perceived conflicts of interest <em>proactively</em></li>
<li>Give credit where due; never plagiarize</li>
</ul>
<div class="exam-tip">Public safety ALWAYS takes priority over employer loyalty, personal interests, or client preferences. Expect 2–3 scenario-based ethics questions. When uncertain: choose the answer prioritizing public safety and honest disclosure. Cross-border ethics: local unethical behavior is never acceptable simply because it is local practice.</div>

<h2>Practical Application Rules</h2>
<ul>
<li><strong>Confidential information:</strong> Never use for personal gain under any circumstances</li>
<li><strong>Conflicts of interest:</strong> Disclose both real AND perceived conflicts proactively</li>
<li><strong>Cross-border ethics:</strong> Do not accept local unethical practices as acceptable</li>
<li><strong>Competence:</strong> Only accept assignments within your qualified areas</li>
</ul>

<h2>ISO 26000</h2>
<p>International guidance standard on <strong>social responsibility</strong>. Not directly referenced in ASQ code but its ethical intent permeates all aspects of ethical quality practice.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Paramount Safety</td><td>Holding safety, health, welfare above all other professional considerations</td></tr>
<tr><td>Conflict of Interest</td><td>Any situation where personal interests could impair objectivity</td></tr>
<tr><td>ISO 26000</td><td>International guidance standard on social responsibility</td></tr>
<tr><td>Professional Competence</td><td>Only undertaking work within your qualified areas</td></tr>
</tbody></table>`},

5:{icon:'🎯',title:'Strategic Planning Models',bok:'II.A',part:'II',content:`
<h2>Three Levels of Planning</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Focus</th><th>Time Horizon</th></tr></thead><tbody>
<tr><td>Strategic</td><td>High-level direction; what org strives to become</td><td>3–5+ years</td></tr>
<tr><td>Tactical</td><td>How to implement strategic plan; specific task bundles</td><td>1–3 years</td></tr>
<tr><td>Operational</td><td>Action plans; who, what, when, how; day-to-day execution</td><td>Months to 1 year</td></tr>
</tbody></table>
<div class="exam-tip">Know time horizons for all 3 levels. The exam tests the distinction between strategic (3-5 yr direction), tactical (1-3 yr implementation), and operational (day-to-day execution).</div>

<h2>Mission / Vision / Values</h2>
<ul>
<li><strong>Vision:</strong> What the org wants to BECOME in the future. Brief, inspiring, describes desired future state.</li>
<li><strong>Mission:</strong> WHY the org exists. Answers: what, who, and how.</li>
<li><strong>Guiding Principles / Values:</strong> HOW business is conducted. Bases for ethical decision-making.</li>
</ul>

<h2>Hoshin Kanri (Policy Deployment)</h2>
<p>A tightly integrated planning and implementation system connecting MBO with organizational direction. Involves <strong>every member at every level</strong>.</p>
<div class="model-box">
<h4>Key Characteristics</h4>
<ul>
<li>Uses <strong>PDCA loop</strong> to ensure strategic plans are consistently met over time</li>
<li><strong>Catchball:</strong> Plans passed back and forth between organizational levels for iterative consensus-building</li>
<li>Team-based problem-solving; fact-based system; constant tracking and review</li>
<li>Literally means "walk the talk" in Japanese</li>
</ul>
</div>
<p><strong>Disadvantages:</strong> Heavy emphasis on total org involvement is challenging in American organizations; consensus at every level; may take 3+ years to mature; requires significant top-management support; major culture change.</p>
<div class="exam-tip">Hoshin Kanri is a COMPLETE SYSTEM — not just MBO. It involves EVERY level, uses PDCA, and requires catchball (iterative consensus). Know both advantages AND disadvantages.</div>

<h2>Scenario Planning</h2>
<p>Disciplined method for imagining possible futures. Three macro scenarios: <strong>good future, bad future, wild card</strong>. Helps organizations overcome overconfidence and tunnel vision.</p>

<h2>S.M.A.R.T.W.A.Y. Objectives</h2>
<table class="kt-table"><thead><tr><th>Letter</th><th>Meaning</th></tr></thead><tbody>
<tr><td>S</td><td>Focus on Specific needs and opportunities</td></tr>
<tr><td>M</td><td>Establish a Measurement for each objective</td></tr>
<tr><td>A</td><td>Achievable as well as challenging</td></tr>
<tr><td>R</td><td>Realistic stretch objectives</td></tr>
<tr><td>T</td><td>Time-framed for each objective</td></tr>
<tr><td>W</td><td>Worthwhile — ensure desired return</td></tr>
<tr><td>A</td><td>Assigned responsibility for each objective</td></tr>
<tr><td>Y</td><td>Yielding — worth doing</td></tr>
</tbody></table>

<h2>10 Barriers to Strategic Planning</h2>
<p>Top barriers tested: #1 Delegating planning to a planner instead of ownership at top; #3 No suitable goals as basis for planning; #10 Intuitive decisions consistently conflicting with formal plans.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Hoshin Kanri</td><td>Japanese policy deployment; involves every level; uses PDCA; catchball consensus</td></tr>
<tr><td>Catchball</td><td>Passing plans back and forth between org levels for consensus</td></tr>
<tr><td>Vision Statement</td><td>What org wants to become in the future</td></tr>
<tr><td>Mission Statement</td><td>Why the org exists; fundamental purpose</td></tr>
<tr><td>Means Matrix</td><td>Tool linking objectives to means with responsibility and measurement</td></tr>
<tr><td>Scenario Planning</td><td>Imagining multiple possible futures (good/bad/wild card)</td></tr>
</tbody></table>`},

6:{icon:'🔍',title:'Business Environment Analysis',bok:'II.B',part:'II',content:`
<h2>SWOT Analysis</h2>
<ul>
<li><strong>Strengths + Weaknesses = INTERNAL</strong> (org structure, brand, capabilities, financial strength)</li>
<li><strong>Opportunities + Threats = EXTERNAL</strong> (market changes, competition, regulation, technology)</li>
</ul>
<div class="exam-tip">SWOT categorization is tested: always distinguish internal (S/W) vs. external (O/T). Exam presents scenarios and asks you to categorize correctly.</div>

<h2>FMEA in Strategic Risk Analysis</h2>
<div class="formula">RPN = Severity (1–10) × Occurrence (1–10) × Detection (1–10)  [max 1000]</div>
<p>Detection scale: 10 = complete inability to detect. Higher RPN = higher priority for mitigation action.</p>

<h2>Porter's Five Forces</h2>
<table class="kt-table"><thead><tr><th>Force</th><th>Key Questions</th></tr></thead><tbody>
<tr><td>Competitive rivalry</td><td>How many competitors? How aggressive are they? Barriers to exit?</td></tr>
<tr><td>Threat of new entrants</td><td>How easy is market entry? Capital requirements? Economies of scale?</td></tr>
<tr><td>Threat of substitutes</td><td>How easily can customers switch to alternatives? Switching costs?</td></tr>
<tr><td>Buyer power</td><td>Can customers easily compare prices? Concentration of buyers?</td></tr>
<tr><td>Supplier power</td><td>Are there sole-source suppliers? Volume purchased? Switching costs?</td></tr>
</tbody></table>

<h2>Stakeholder Categories</h2>
<p><strong>Internal:</strong> Employees, shareholders, board of directors, management, unions</p>
<p><strong>External:</strong> Customers, suppliers, community, government/regulators, media, professional associations, accrediting bodies</p>

<h2>Quality 4.0 Technologies</h2>
<table class="kt-table"><thead><tr><th>Technology</th><th>Quality Application</th></tr></thead><tbody>
<tr><td>AI / Machine Learning</td><td>Predictive quality, pattern detection, automated SPC, defect classification</td></tr>
<tr><td>IoT / Edge Devices</td><td>Real-time monitoring from connected equipment; in-process data collection</td></tr>
<tr><td>Cloud Computing</td><td>Storing and accessing quality data at enterprise scale</td></tr>
<tr><td>Big Data Analytics</td><td>Analyzing massive datasets for quality trends and early warning signals</td></tr>
<tr><td>Blockchain</td><td>Immutable supply chain traceability; certificate of conformance integrity</td></tr>
</tbody></table>
<div class="exam-tip">Quality 4.0 is increasingly tested. Know the 4th Industrial Revolution (cyber-physical systems) and how each technology applies to quality management.</div>

<h2>Generational Workforce Differences</h2>
<table class="kt-table"><thead><tr><th>Generation</th><th>Key Characteristics</th></tr></thead><tbody>
<tr><td>Traditionalists</td><td>Paper-based; loyal; respect for authority; stability-seeking</td></tr>
<tr><td>Baby Boomers</td><td>Electronic but basic; loyal but realistic; values recognition</td></tr>
<tr><td>Generation X</td><td>Web-based; independent/self-reliant; unimpressed by authority; work-life balance</td></tr>
<tr><td>Millennials</td><td>On-demand; team-oriented; not brand-based; purpose-driven</td></tr>
<tr><td>Generation Z</td><td>Electronic-only; digest on-demand content; authority varies; digital native</td></tr>
</tbody></table>

<h2>Legal vs. Regulatory Factors</h2>
<ul>
<li><strong>Legal factors:</strong> Laws enforceable by punishment. Employment, product liability, IP, Sarbanes-Oxley, antitrust, trade protectionism.</li>
<li><strong>Regulatory factors:</strong> Rules from agencies and self-regulating bodies. Often voluntary but with force of law.</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>FMEA</td><td>Failure Mode and Effects Analysis — systematic risk identification tool</td></tr>
<tr><td>RPN</td><td>Risk Priority Number = Severity × Occurrence × Detection</td></tr>
<tr><td>Porter's Five Forces</td><td>Competitive rivalry, new entrants, substitutes, buyer power, supplier power</td></tr>
<tr><td>Core Competencies</td><td>Primary capabilities that distinguish org from competitors</td></tr>
<tr><td>Sarbanes-Oxley</td><td>U.S. legislation on corporate governance and financial disclosure accountability</td></tr>
</tbody></table>`},

7:{icon:'🚀',title:'Strategic Plan Deployment',bok:'II.C',part:'II',content:`
<h2>Action Plan Components</h2>
<p>A complete action plan includes: project definition, date needed, link to strategic objective, objectives, scope (in/out), deliverables, success criteria, assumptions, approach, resources required, benefits vs. costs, Gantt timeline.</p>
<div class="exam-tip">Know all components of an action plan. The exam presents a scenario and asks which element is missing.</div>

<h2>Cascading Strategy</h2>
<p>Enterprise objectives → Enterprise strategies → Divisional strategies → Divisional objectives → Departmental directives → Departmental action plans → Results</p>
<p><strong>Walkabout technique:</strong> Each person posts their required resources on flip chart; others walk the room identifying conflicts via sticky notes; iterative process until all conflicts resolved.</p>
<div class="exam-tip">The cascading concept is heavily tested. Objectives flow from enterprise level down through the organization, with customer requirements integrated at each level.</div>

<h2>Balanced Scorecard</h2>
<p>4 perspectives for measuring organizational performance:</p>
<ul>
<li><strong>Financial:</strong> Revenue, profitability, ROI, cost reduction</li>
<li><strong>Customer:</strong> Satisfaction, retention, market share, NPS</li>
<li><strong>Internal Process:</strong> Cycle time, quality yield, efficiency, capacity</li>
<li><strong>Learning & Growth:</strong> Employee capability, innovation, knowledge management</li>
</ul>

<h2>Open-Loop vs. Closed-Loop Operations</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th><th>Preferred?</th></tr></thead><tbody>
<tr><td>Open-Loop</td><td>No continuous feedback; relies on intuition for adjustments; reactive</td><td>No</td></tr>
<tr><td>Closed-Loop</td><td>Continuous monitoring with ability for immediate corrective action</td><td>YES — always</td></tr>
</tbody></table>

<h2>Quality Policy vs. Objectives vs. Principles</h2>
<ul>
<li><strong>Quality Principles:</strong> Guiding beliefs for organizational decision-making (broadest; cultural)</li>
<li><strong>Quality Policy:</strong> Formalized document communicating org's overall quality intentions (strategic)</li>
<li><strong>Quality Objectives:</strong> Specific, measurable, time-bound quality actions — SMART (operational)</li>
</ul>

<h2>Critical Success Factors (CSFs)</h2>
<p>8–12 key indicators targeting the full span of strategic goals. Must be custom-fitted to the specific organization — not generic industry metrics.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Action Plan</td><td>Detailed mini-project generated from a specific strategic objective</td></tr>
<tr><td>Cascading</td><td>Flowing objectives from enterprise level down to departmental action plans</td></tr>
<tr><td>Walkabout</td><td>Technique for identifying resource conflicts by posting and reviewing plans</td></tr>
<tr><td>Catchball</td><td>Iterative consensus process; passing plans up and down for agreement</td></tr>
<tr><td>Balanced Scorecard</td><td>4-perspective measurement: Financial, Customer, Internal Process, Learning</td></tr>
<tr><td>CSF</td><td>Critical Success Factors — 8–12 key indicators measuring strategic outcomes</td></tr>
<tr><td>Closed-Loop</td><td>Preferred approach with continuous monitoring and immediate adjustment</td></tr>
<tr><td>Quality Policy</td><td>Formalized document communicating organization's quality intentions</td></tr>
</tbody></table>`},

8:{icon:'💼',title:'Management Skills and Abilities',bok:'III.A',part:'III',content:`
<h2>POSDC Management Functions</h2>
<table class="kt-table"><thead><tr><th>Function</th><th>Description</th></tr></thead><tbody>
<tr><td>Planning</td><td>Vision, mission, strategies; monitoring for desired outputs</td></tr>
<tr><td>Organizing</td><td>Structure; work division; authority allocation</td></tr>
<tr><td>Staffing</td><td>Acquire right people; right jobs; develop competencies</td></tr>
<tr><td>Directing</td><td>Guide work; communicate vision; day-to-day delegation</td></tr>
<tr><td>Controlling</td><td>Monitor activities/results; initiate corrective action</td></tr>
</tbody></table>

<h2>Management Theories</h2>
<table class="kt-table"><thead><tr><th>Theory / Author</th><th>Core Contribution</th></tr></thead><tbody>
<tr><td>Scientific Management (Taylor)</td><td>"One best way" to perform tasks; time & motion studies; separate thinking from doing</td></tr>
<tr><td>Hawthorne Effect (Mayo)</td><td>Productivity changes due to ATTENTION, not physical conditions — human factors matter</td></tr>
<tr><td>Theory X / Y (McGregor)</td><td>X = employees need control; Y = employees are self-motivated and seek responsibility</td></tr>
<tr><td>Kolb's Learning Cycle</td><td>Experience → Reflect → Theorize → Apply (continuous cycle)</td></tr>
<tr><td>Senge's 5 Disciplines</td><td>Personal mastery, Mental models, Shared vision, Team learning, Systems thinking</td></tr>
</tbody></table>

<h2>Blake-Mouton Managerial Grid</h2>
<p>Two axes: Concern for Production (1–9) vs. Concern for People (1–9)</p>
<table class="kt-table"><thead><tr><th>Position</th><th>Name</th><th>Characteristics</th></tr></thead><tbody>
<tr><td>(1,1)</td><td>Impoverished</td><td>Low concern for both — abdication</td></tr>
<tr><td>(9,1)</td><td>Task/Authority</td><td>High production, low people — dictatorial</td></tr>
<tr><td>(1,9)</td><td>Country Club</td><td>High people, low production — comfortable but underperforming</td></tr>
<tr><td>(5,5)</td><td>Middle of Road</td><td>Moderate both — adequate but mediocre</td></tr>
<tr><td>(9,9)</td><td>Team Management</td><td>High both — IDEAL; committed people; interdependence</td></tr>
</tbody></table>
<div class="exam-tip">Know all 5 grid positions by coordinates. (9,9) Team Management is always the ideal target. Blake-Mouton is frequently tested.</div>

<h2>Financial Management</h2>
<h3>Three Financial Statements (GAAP Required)</h3>
<ul>
<li><strong>Balance Sheet:</strong> Assets = Liabilities + Shareholders' Equity (point in time snapshot)</li>
<li><strong>Income Statement:</strong> Revenue − Expenses = Net Income (period performance)</li>
<li><strong>Cash Flow Statement:</strong> Operating + Investing + Financing cash flows</li>
</ul>
<h3>Key Financial Ratios</h3>
<div class="formula">Current Ratio = Current Assets ÷ Current Liabilities  [should be ≥ 2.0]</div>
<div class="formula">ROI = Net Dollar Benefit ÷ Investment</div>
<div class="formula">ROA = Net Income ÷ Total Assets</div>
<div class="formula">Inventory Turnover = COGS ÷ Average Inventory  [higher = better]</div>
<div class="formula">Gross Profit Margin = Gross Profit ÷ Net Sales</div>

<h2>Risk Management (ISO 31000)</h2>
<p>Risk = "effect of uncertainty on objectives." Two assessment lenses:</p>
<ul>
<li><strong>Impact/Severity:</strong> How bad if this happened?</li>
<li><strong>Likelihood/Probability:</strong> How likely is it to happen?</li>
</ul>
<p><strong>Risk Assessment Techniques:</strong> FMEA, HACCP (food/critical control points), SWIFT (structured what-if), Bow Tie Analysis (cause → barriers → event → consequences), HRA (human reliability), Cause-and-Effect diagrams</p>

<h2>Knowledge Management</h2>
<div class="formula">Data → Information → Knowledge → Wisdom</div>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th><th>Risk</th></tr></thead><tbody>
<tr><td>Tacit knowledge</td><td>Unrecorded beliefs, intuition, know-how, skills in people's heads</td><td>Lost permanently when employee leaves</td></tr>
<tr><td>Explicit knowledge</td><td>Codified in procedures, standards, documents, databases</td><td>Can become outdated; must be maintained</td></tr>
</tbody></table>
<div class="exam-tip">ISO 9001:2015 Clause 7.1.6 specifically requires management of organizational knowledge. Tacit vs. explicit knowledge distinction is tested.</div>

<h2>ISO 9001 Seven Quality Management Principles</h2>
<p>Customer focus, Leadership, Engagement of people, Process approach, Improvement, Evidence-based decision making, Relationship management</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>POSDC</td><td>Planning, Organizing, Staffing, Directing, Controlling</td></tr>
<tr><td>Hawthorne Effect</td><td>Productivity changes due to attention, not physical conditions</td></tr>
<tr><td>Theory X / Y</td><td>McGregor: X = need control; Y = seek responsibility</td></tr>
<tr><td>Suboptimization</td><td>Optimizing one part of a system at the expense of the whole</td></tr>
<tr><td>Concurrent Engineering</td><td>All functions working simultaneously on product development (vs. sequential)</td></tr>
<tr><td>Tacit Knowledge</td><td>Unrecorded know-how — lost when employee leaves</td></tr>
<tr><td>Poka-Yoke</td><td>Error-proofing; required by ISO 9001:2015 clause 8.5.1g</td></tr>
<tr><td>HACCP</td><td>Hazard Analysis & Critical Control Points — systematic risk management for food/processes</td></tr>
<tr><td>Current Ratio</td><td>Current assets ÷ Current liabilities; ≥ 2.0 indicates adequate liquidity</td></tr>
<tr><td>SOX</td><td>Sarbanes-Oxley Act (2002) — financial accountability after corporate scandals</td></tr>
<tr><td>HFE</td><td>Human Factors Engineering — designing systems FOR the user, not forcing user to conform</td></tr>
</tbody></table>`},

9:{icon:'📡',title:'Communication Skills and Abilities',bok:'III.B',part:'III',content:`
<h2>Communication Model</h2>
<div class="formula">Sender → Filters → Message → Filters → Receiver → Action / Opinion / Interpretation</div>
<p>Filters include cultural beliefs, previous communications, confidence, biases, and perceived meaning. Feedback loop clarifies and confirms understanding.</p>

<h2>Directions of Organizational Communication</h2>
<ul>
<li><strong>Vertical Top-Down:</strong> Management to subordinates — policy, goals, direction</li>
<li><strong>Vertical Bottom-Up:</strong> Subordinates to management — status, feedback, problems, suggestions</li>
<li><strong>Horizontal/Lateral:</strong> Across departments at similar levels — coordination, information sharing, cross-functional teams</li>
</ul>
<p><strong>Telephone game effect:</strong> Bottom-up vertical communication is most prone to distortion through multiple retransmissions — each retelling drifts from the original.</p>

<h2>Formal vs. Informal Communication</h2>
<ul>
<li><strong>Formal:</strong> Mandated by SOPs — letters, reports, procedures, performance appraisals, meeting minutes</li>
<li><strong>Informal:</strong> Not mandated — hallway conversations, text messages, email, organizational gossip</li>
</ul>

<h2>Active Listening Framework</h2>
<ul>
<li>Paraphrase (restate in your own words) to confirm understanding</li>
<li>Ask clarifying questions: "Can you tell me more about that?"</li>
<li>Use open-ended questions (cannot be answered yes/no)</li>
<li>Take mental note of learning and how it benefits you</li>
<li>Monitor your talking-to-listening ratio — you should listen more</li>
</ul>

<h2>Feedback Types</h2>
<ul>
<li><strong>Informative:</strong> Passing information from one person/group to another (no behavioral change expected)</li>
<li><strong>Corrective (Constructive):</strong> Intended to cause behavioral change or corrective action</li>
</ul>

<h2>Interpersonal Skills</h2>
<p>Empathy, tactfulness, open-mindedness, sensitivity, trustworthiness, ethics, authenticity, fairness, friendliness — all contribute to effective communication effectiveness and trust-building.</p>

<h2>Global Communication Challenges</h2>
<table class="kt-table"><thead><tr><th>Obstacle</th><th>Mitigation</th></tr></thead><tbody>
<tr><td>Cultural differences (customs, religion, politics)</td><td>Cultural awareness training; set learning early; cross-train key personnel</td></tr>
<tr><td>Language barriers (dialects, idioms)</td><td>Business language glossaries; provide common business term dictionaries</td></tr>
<tr><td>Time zone differentials</td><td>Establish/publish business hours and communication protocols for offshore locations</td></tr>
<tr><td>Incompatible org structures</td><td>Organizational diagnosis; assess training needs; establish help desks</td></tr>
<tr><td>Electronic interface incompatibility</td><td>Form preventive action teams; standardize EDI protocols</td></tr>
</tbody></table>

<h2>Information System Levels</h2>
<p>Operations level (record transactions) → Day-to-day decision making (monitor trends, manage inventory) → Strategic analysis (pricing strategies, market mix decisions)</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Noise</td><td>Any disturbance that distorts or blocks communication</td></tr>
<tr><td>Active Listening</td><td>Paraphrasing, clarifying, asking meaningful questions to confirm understanding</td></tr>
<tr><td>Informative Feedback</td><td>Passing information — no behavioral change expected</td></tr>
<tr><td>Corrective Feedback</td><td>Intended to cause behavioral change or action</td></tr>
<tr><td>Open-Ended Questions</td><td>Cannot be answered with simple yes/no; elicit detailed responses</td></tr>
</tbody></table>`},

10:{icon:'📊',title:'Project Management',bok:'III.C',part:'III',content:`
<h2>5 Project Life Cycle Stages</h2>
<ol>
<li><strong>Initiating</strong> — Define purpose, objectives, scope, stakeholders, benefits</li>
<li><strong>Planning</strong> — Activities, who, when, schedule, budget, risk</li>
<li><strong>Executing</strong> — Implement the plan</li>
<li><strong>Monitoring and Controlling</strong> — Track progress; compare actual vs. plan; corrective action</li>
<li><strong>Evaluating and Closing</strong> — Post-project audit, lessons learned, celebrate, archive</li>
</ol>
<div class="exam-tip">The post-project audit is one of the most commonly OMITTED steps in the project lifecycle. Know all 5 stages.</div>

<h2>Project Methodologies Comparison</h2>
<table class="kt-table"><thead><tr><th>Methodology</th><th>Characteristics</th><th>Best For</th></tr></thead><tbody>
<tr><td>Waterfall (Linear)</td><td>Sequential phases; requirements defined upfront; low flexibility</td><td>Well-defined scope; stable requirements; manufacturing projects</td></tr>
<tr><td>Evolutionary/Incremental</td><td>Successive deliveries; requirements can evolve</td><td>Unclear initial requirements; technology-dependent</td></tr>
<tr><td>Agile/Iterative</td><td>Customer collaboration; respond to change; working deliverables over documentation</td><td>Complex, rapidly changing requirements; software/product dev</td></tr>
</tbody></table>

<h2>Agile Manifesto — 4 Principles</h2>
<ul>
<li><strong>Customer collaboration</strong> over contract negotiation</li>
<li><strong>Responding to change</strong> over following a plan</li>
<li><strong>Working software/deliverables</strong> over comprehensive documentation</li>
<li><strong>Individuals and interactions</strong> over processes and tools</li>
</ul>

<h2>Scrum Framework</h2>
<table class="kt-table"><thead><tr><th>Element</th><th>Description</th></tr></thead><tbody>
<tr><td>Product Backlog</td><td>Prioritized wish list of all features/functionality</td></tr>
<tr><td>Sprint</td><td>1–4 week iteration cycle with defined deliverables</td></tr>
<tr><td>Daily Scrum</td><td>Daily stand-up to assess progress and self-correct</td></tr>
<tr><td>Burndown Chart</td><td>Graphs remaining work (y-axis) vs. time (x-axis)</td></tr>
<tr><td>Scrum Master</td><td>Removes barriers; facilitates team; manages sprint rhythm</td></tr>
<tr><td>Product Owner</td><td>Owns and prioritizes product backlog</td></tr>
</tbody></table>

<h2>Project Planning Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Purpose</th><th>Critical Notes</th></tr></thead><tbody>
<tr><td>WBS</td><td>Hierarchical breakdown of all project work</td><td>Foundation for all cost/schedule estimates</td></tr>
<tr><td>Gantt Chart</td><td>Time-phased bar chart of tasks</td><td>Easy to read; does NOT show task dependencies</td></tr>
<tr><td>CPM</td><td>Critical path = longest path through network</td><td>Zero slack on critical path; any delay delays entire project</td></tr>
<tr><td>PERT</td><td>Three time estimates per activity</td><td>(Optimistic + 4×Most Likely + Pessimistic) ÷ 6</td></tr>
<tr><td>RRM</td><td>Resource requirements matrix</td><td>What/when/how many resources are needed</td></tr>
<tr><td>LRM</td><td>Linear responsibility matrix</td><td>Who is responsible for what task at what level</td></tr>
</tbody></table>

<h2>Financial Project Selection Methods</h2>
<table class="kt-table"><thead><tr><th>Method</th><th>Key Points</th><th>Time Value?</th></tr></thead><tbody>
<tr><td>Payback Period</td><td>Years to recover investment from cash flows; simple</td><td>NO — does not consider time value of money</td></tr>
<tr><td>NPV</td><td>Positive = accept; higher = better</td><td>YES</td></tr>
<tr><td>IRR</td><td>Rate where NPV = 0; if IRR > required rate → accept</td><td>YES</td></tr>
<tr><td>ROI</td><td>Net dollar benefit ÷ Investment</td><td>NO</td></tr>
</tbody></table>

<h2>Earned Value Analysis</h2>
<div class="formula">CPI = EV ÷ AC  [Cost Performance Index — >1.0 means under budget]</div>
<div class="formula">SPI = EV ÷ PV  [Schedule Performance Index — >1.0 means ahead of schedule]</div>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Critical Path</td><td>Longest path through network = minimum project duration; zero float on all activities</td></tr>
<tr><td>Burndown Chart</td><td>Remaining work vs. time — tracks sprint velocity</td></tr>
<tr><td>Stage/Gate Review</td><td>Go/no-go decision points between project phases</td></tr>
<tr><td>Post-Project Audit</td><td>Compares actual results to predicted — most commonly omitted step</td></tr>
<tr><td>NPV</td><td>Net Present Value; positive = accept project; accounts for time value of money</td></tr>
<tr><td>IRR</td><td>Internal Rate of Return; discount rate where NPV = 0</td></tr>
</tbody></table>`},

11:{icon:'✅',title:'Quality System',bok:'III.D',part:'III',content:`
<h2>Definitions of Quality</h2>
<ul>
<li>Fitness for use (Juran)</li>
<li>Conformance to requirements (Crosby)</li>
<li>Meeting customer expectations</li>
<li>Exceeding customer expectations / Delighting the customer</li>
<li>Whatever the customer says it is</li>
</ul>

<h2>Little q vs. Big Q</h2>
<table class="kt-table"><thead><tr><th>Concept</th><th>Scope</th><th>Focus</th></tr></thead><tbody>
<tr><td>Little q</td><td>Quality department only</td><td>QC/inspection activities</td></tr>
<tr><td>Big Q</td><td>Entire organization</td><td>Quality as a management responsibility at all levels — PREFERRED</td></tr>
</tbody></table>

<h2>Types of Quality Audits</h2>
<h3>By Party</h3>
<table class="kt-table"><thead><tr><th>Type</th><th>Who Conducts</th><th>Example</th></tr></thead><tbody>
<tr><td>First-Party (Internal)</td><td>Organization's own auditors (no vested interest in area)</td><td>ISO 9001 internal audit per Clause 9.2</td></tr>
<tr><td>Second-Party</td><td>Customer auditing a supplier</td><td>Automotive OEM auditing a tier-1 supplier</td></tr>
<tr><td>Third-Party</td><td>Independent registrar</td><td>ISO 9001 certification audit by registrar</td></tr>
</tbody></table>

<h3>By Scope</h3>
<ul>
<li><strong>System Audit:</strong> Verifies overall QMS is appropriate, documented, and effectively implemented</li>
<li><strong>Process Audit:</strong> Examines a single process or activity (welding, incoming inspection, shipping)</li>
<li><strong>Product Audit:</strong> In-depth examination of a specific product against requirements</li>
</ul>

<h2>3-Stage Audit Process</h2>
<ol>
<li><strong>Preparation:</strong> Define scope; select audit team; develop checklists; obtain previous audit results; schedule activities</li>
<li><strong>Performance:</strong> Opening meeting; collect data; verify documentation; analyze findings; closing meeting with findings</li>
<li><strong>Reporting/Follow-up:</strong> Formal written report; request corrective actions; evaluate responses; verify closure</li>
</ol>

<h2>Balanced Scorecard for Quality Performance</h2>
<p>4 perspectives: Customer, Employee/People, Stakeholder/Financial, Process</p>
<ul>
<li><strong>Leading indicators:</strong> Predict future performance (easier to collect; used for proactive management)</li>
<li><strong>Lagging indicators:</strong> Report past performance (easier to measure; used for retrospective analysis)</li>
</ul>

<h2>ISO 9001 Management Review Inputs (Clause 9.3)</h2>
<p>Customer satisfaction results, process performance, nonconformities and corrective actions, audit results, risks and opportunities, resource adequacy, status of action items from previous reviews, strategic direction changes.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Fitness for Use</td><td>Quality = what product/service does and is supposed to do (Juran)</td></tr>
<tr><td>Little q</td><td>Quality focused on QC/inspection at department level</td></tr>
<tr><td>Big Q</td><td>Quality as responsibility across the entire organization</td></tr>
<tr><td>First-Party Audit</td><td>Internal — organization's own auditors</td></tr>
<tr><td>Second-Party Audit</td><td>Customer auditing a supplier</td></tr>
<tr><td>Third-Party Audit</td><td>Independent registrar — enables certification</td></tr>
<tr><td>Gemba Walk</td><td>Senior management walk-through of operations; observes directly</td></tr>
<tr><td>Leading Indicator</td><td>Metric that predicts future performance</td></tr>
<tr><td>ROQI</td><td>Return on Quality Investment</td></tr>
<tr><td>DFSS</td><td>Design for Six Sigma — building quality in from the start</td></tr>
</tbody></table>`},

12:{icon:'🏆',title:'Quality Models and Theories',bok:'III.E',part:'III',content:`
<h2>ISO 9001:2015 Key Sections</h2>
<table class="kt-table"><thead><tr><th>Section</th><th>Focus Area</th></tr></thead><tbody>
<tr><td>4 — Context</td><td>Org context; interested parties; scope determination; risk-based thinking</td></tr>
<tr><td>5 — Leadership</td><td>Top management commitment; customer focus; quality policy</td></tr>
<tr><td>6 — Planning</td><td>Risks/opportunities; SMART quality objectives; change planning</td></tr>
<tr><td>7 — Support</td><td>Resources; competence; awareness; communication; documented information</td></tr>
<tr><td>8 — Operations</td><td>Operational planning; customer requirements; design controls; supplier controls</td></tr>
<tr><td>9 — Performance Evaluation</td><td>Customer satisfaction monitoring; internal audits; management review</td></tr>
<tr><td>10 — Improvement</td><td>Nonconformity; corrective action; continual improvement</td></tr>
</tbody></table>

<h2>Baldrige Excellence Framework (MBNQA)</h2>
<table class="kt-table"><thead><tr><th>Category</th><th>Points</th><th>% Weight</th></tr></thead><tbody>
<tr><td>1. Leadership</td><td>120</td><td>12%</td></tr>
<tr><td>2. Strategy</td><td>85</td><td>8.5%</td></tr>
<tr><td>3. Customers</td><td>85</td><td>8.5%</td></tr>
<tr><td>4. Measurement, Analysis & KM</td><td>90</td><td>9%</td></tr>
<tr><td>5. Workforce</td><td>85</td><td>8.5%</td></tr>
<tr><td>6. Operations</td><td>85</td><td>8.5%</td></tr>
<tr><td>7. Results</td><td>450</td><td><strong>45% — HIGHEST</strong></td></tr>
</tbody></table>
<div class="exam-tip">Results = 450 pts = 45% of total. The Baldrige criteria are NONPRESCRIPTIVE — orgs choose their own approach to satisfy them. This differentiates Baldrige from ISO (prescriptive requirements).</div>

<h2>Quality Gurus — Essential Reference</h2>
<table class="kt-table"><thead><tr><th>Guru</th><th>Key Contributions</th></tr></thead><tbody>
<tr><td>Shewhart</td><td>Father of SPC; invented control charts (1931); PDCA cycle; common vs. assignable cause variation</td></tr>
<tr><td>Deming</td><td>14 Points for transformation; 7 Deadly Diseases; System of Profound Knowledge; PDSA; drove Japanese quality revolution</td></tr>
<tr><td>Juran</td><td>Quality Trilogy (Planning/Control/Improvement); Pareto principle (vital few); universal sequence of improvement</td></tr>
<tr><td>Crosby</td><td>Zero defects; "Quality is Free"; 5 Absolutes; 14 Steps; quality = conformance to requirements; COQ measurement</td></tr>
<tr><td>Feigenbaum</td><td>Total Quality Control; quality as strategic business tool requiring org-wide commitment; "hidden plant" concept</td></tr>
<tr><td>Ishikawa</td><td>Cause-and-effect (fishbone) diagram; quality circles; 4 audit types; company-wide quality control</td></tr>
<tr><td>Taguchi</td><td>Loss function L(y) = k(y−m)²; robust design via DOE; parameter design / tolerance design</td></tr>
</tbody></table>

<h2>Deming's 14 Points (Key Items)</h2>
<p>Create constancy of purpose → Adopt new philosophy → Cease dependence on inspection → End price-alone purchasing → Improve constantly forever → Institute training → Adopt leadership → Drive out fear → Break down barriers between departments → Eliminate numerical quotas → Remove barriers to pride of workmanship → Institute education and self-improvement → Put everyone to work on transformation</p>

<h2>Deming's 7 Deadly Diseases</h2>
<ol>
<li>Lack of constancy of purpose</li>
<li>Emphasis on short-term profits</li>
<li>Evaluation by performance, merit rating, or annual review</li>
<li>Mobility of management</li>
<li>Running company on visible figures alone</li>
<li>Excessive medical costs for employee healthcare</li>
<li>Excessive costs of warranty / liability</li>
</ol>

<h2>Crosby's 5 Absolutes</h2>
<ol>
<li>Quality = conformance to requirements, not elegance</li>
<li>The quality system is prevention, not appraisal</li>
<li>The performance standard is zero defects</li>
<li>The measurement of quality is the cost of quality</li>
<li>There is no such thing as a quality problem</li>
</ol>

<h2>4 Types of Benchmarking</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th></tr></thead><tbody>
<tr><td>Internal</td><td>Same process compared across functions or locations within one org</td></tr>
<tr><td>Competitive</td><td>Direct comparison with competitors — most relevant but hardest to collect data</td></tr>
<tr><td>Functional</td><td>Compare with non-competing orgs in different industries (best practice focus)</td></tr>
<tr><td>Generic</td><td>Best practices from any industry regardless of product/service type</td></tr>
</tbody></table>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>MBNQA</td><td>Malcolm Baldrige National Quality Award; 7 categories; Results = 450 pts (45%)</td></tr>
<tr><td>Nonprescriptive</td><td>Baldrige criteria specify WHAT to achieve; org chooses HOW</td></tr>
<tr><td>TQM 8 Elements</td><td>Customer focus, Employee involvement, Process centered, Integrated system, Strategic approach, Continual improvement, Fact-based decisions, Communications</td></tr>
<tr><td>Kaizen</td><td>Japanese for nonstop incremental continuous improvement</td></tr>
<tr><td>Taguchi Loss Function</td><td>L(y) = k(y−m)² — any deviation from target creates loss; closer to target is always better</td></tr>
</tbody></table>`},

13:{icon:'🛠️',title:'Problem-Solving Tools',bok:'IV.A',part:'IV',content:`
<h2>7 Classic Quality Tools</h2>
<table class="kt-table"><thead><tr><th>#</th><th>Tool</th><th>Purpose</th><th>Key Notes</th></tr></thead><tbody>
<tr><td>1</td><td>Flowchart</td><td>Map sequence of steps and decisions in a process</td><td>Starting point for any improvement effort</td></tr>
<tr><td>2</td><td>Check Sheet</td><td>Gather data on frequency of occurrence</td><td>Facts over opinions; tally format; simple but powerful</td></tr>
<tr><td>3</td><td>Cause-and-Effect (Fishbone)</td><td>Organize potential causes of a specific problem</td><td>4Ms (manufacturing) or 4Ps (service)</td></tr>
<tr><td>4</td><td>Pareto Chart</td><td>Identify vital few causes using 80/20 rule</td><td>Bar chart ranked high→low + cumulative % line</td></tr>
<tr><td>5</td><td>Control Chart</td><td>Monitor process stability and detect special causes over time</td><td>UCL/CL/LCL; distinguishes common vs. special cause</td></tr>
<tr><td>6</td><td>Histogram</td><td>Show frequency distribution shape of data</td><td>Reveals normal/skewed/bimodal distribution</td></tr>
<tr><td>7</td><td>Scatter Diagram</td><td>Show relationship between two variables</td><td>r = correlation coefficient: ±1 = strong, 0 = none</td></tr>
</tbody></table>
<p><strong>4Ms (manufacturing C-E):</strong> Manpower, Machinery, Methods, Materials<br>
<strong>4Ps (service C-E):</strong> People, Policies, Procedures, Plant</p>

<h2>7 Management and Planning Tools</h2>
<table class="kt-table"><thead><tr><th>#</th><th>Tool</th><th>Purpose</th></tr></thead><tbody>
<tr><td>1</td><td>Activity Network Diagram</td><td>Schedule project activities; shows critical path dependencies</td></tr>
<tr><td>2</td><td>Affinity Diagram</td><td>Organize large group of brainstormed ideas into natural categories (KJ Method)</td></tr>
<tr><td>3</td><td>Interrelationship Digraph</td><td>Show cause-and-effect among complex issues; count arrows in (effect) vs. out (driver)</td></tr>
<tr><td>4</td><td>Matrix Diagram</td><td>Show relationships and strength of correlation between groups of items</td></tr>
<tr><td>5</td><td>Prioritization Matrix</td><td>Weight alternatives against multiple criteria; rank by weighted score</td></tr>
<tr><td>6</td><td>PDPC</td><td>Process Decision Program Chart — anticipate problems and plan countermeasures</td></tr>
<tr><td>7</td><td>Tree Diagram</td><td>Break broad goals into increasingly detailed tasks (like WBS for planning)</td></tr>
</tbody></table>

<h2>7-Step Problem-Solving Model</h2>
<ol>
<li><strong>Identify</strong> the problem and the process</li>
<li><strong>List</strong> possible root causes (brainstorming, C-E diagram)</li>
<li><strong>Search out</strong> the most likely root cause (data collection and analysis)</li>
<li><strong>Identify</strong> potential solutions</li>
<li><strong>Select and implement</strong> a solution (plan → pilot → implement)</li>
<li><strong>Follow up</strong> to evaluate effect (control chart confirmation)</li>
<li><strong>Standardize</strong> the process (poka-yoke, procedures, training, update work instructions)</li>
</ol>

<h2>PDCA / PDSA Cycle</h2>
<div class="formula">Plan → Do → Check/Study → Act → (Repeat)</div>
<p>Developed by Shewhart; associated with Deming. "Study" variant (PDSA) is Deming's preferred terminology.</p>

<h2>DMAIC Framework</h2>
<table class="kt-table"><thead><tr><th>Phase</th><th>Key Activities</th><th>Core Tools</th></tr></thead><tbody>
<tr><td>Define</td><td>Project charter; VOC; identify CTQs</td><td>SIPOC, stakeholder analysis, process map</td></tr>
<tr><td>Measure</td><td>Baseline current state; MSA</td><td>MSA, data collection plan, FMEA, baseline Cpk</td></tr>
<tr><td>Analyze</td><td>Validate root causes</td><td>5 Whys, fishbone, ANOVA, regression, Pareto</td></tr>
<tr><td>Improve</td><td>Design future state; implement</td><td>QFD, DOE, poka-yoke, FMEA, cost-benefit analysis</td></tr>
<tr><td>Control</td><td>Sustain improvements</td><td>SPC charts, control plans, standardized work, procedures</td></tr>
</tbody></table>

<h2>Six Sigma Levels</h2>
<table class="kt-table"><thead><tr><th>Sigma Level</th><th>DPMO</th></tr></thead><tbody>
<tr><td>6σ</td><td>3.4</td></tr>
<tr><td>5σ</td><td>230</td></tr>
<tr><td>4σ</td><td>6,210</td></tr>
<tr><td>3σ</td><td>66,800</td></tr>
<tr><td>2σ</td><td>308,000</td></tr>
</tbody></table>

<h2>FMEA Process</h2>
<div class="formula">RPN = Severity (1–10) × Occurrence (1–10) × Detection (1–10)  [max 1000]</div>
<p>Higher RPN = higher priority for action. <strong>DFMEA</strong> = design; <strong>PFMEA</strong> = process. 14-step methodology per AIAG standard.</p>

<h2>Kepner-Tregoe (4 Steps)</h2>
<ol>
<li><strong>Problem analysis</strong> — describe problem; identify, test, and confirm causes</li>
<li><strong>Decision analysis</strong> — clarify purpose; identify alternatives; perform risk analysis; decide</li>
<li><strong>Situation appraisal</strong> — identify concerns; outline priorities for action</li>
<li><strong>Potential problem analysis</strong> — identify future risks; establish preventive/contingency actions</li>
</ol>

<h2>Cost of Quality (COQ)</h2>
<div class="formula">Total COQ = Prevention + Appraisal + Internal Failure + External Failure</div>
<table class="kt-table"><thead><tr><th>Category</th><th>Examples</th><th>Also Called</th></tr></thead><tbody>
<tr><td>Prevention</td><td>Training, planning, design reviews, process capability evaluations</td><td>Process improvement investments</td></tr>
<tr><td>Appraisal</td><td>Incoming/in-process/final inspection, calibration, testing, audits</td><td>Measurement and verification costs</td></tr>
<tr><td>Internal Failure</td><td>Scrap, rework, reprocessing — occurs BEFORE delivery</td><td>Process waste</td></tr>
<tr><td>External Failure</td><td>Warranty, returns, complaints, product liability — occurs AFTER delivery</td><td>Customer dissatisfaction costs</td></tr>
</tbody></table>
<div class="exam-tip">Goal: INCREASE prevention costs → DECREASE total COQ. Typical COQ = 15–25% of revenue. Best-in-class &lt; 10%.</div>

<h2>Creativity Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Description</th></tr></thead><tbody>
<tr><td>SCAMPER</td><td>Substitute, Combine, Adapt, Modify, Put to other use, Eliminate, Reverse</td></tr>
<tr><td>Six Thinking Hats (de Bono)</td><td>White=facts, Red=emotions, Black=critical, Yellow=optimistic, Green=creative, Blue=process</td></tr>
<tr><td>TRIZ</td><td>Theory of Inventive Problem-Solving; 40 inventive principles; resolves engineering contradictions</td></tr>
<tr><td>Five Whys</td><td>Repeatedly ask "Why?" (typically 5 times) to reach root cause from symptom</td></tr>
<tr><td>NGT</td><td>Nominal Group Technique; structured voting to narrow large idea lists</td></tr>
<tr><td>Mind Mapping</td><td>Central topic with radiating branches for all related ideas</td></tr>
</tbody></table>`},

14:{icon:'⚙️',title:'Process Management',bok:'IV.B',part:'IV',content:`
<h2>SIPOC Model</h2>
<div class="formula">Suppliers → Inputs → Process → Outputs → Customers</div>
<p>The fundamental framework for understanding any process. Always the starting point for process improvement initiatives.</p>

<h2>The 7 Wastes (TIMWOOD)</h2>
<table class="kt-table"><thead><tr><th>Waste</th><th>Description</th><th>Tesla/Mfg Example</th></tr></thead><tbody>
<tr><td>Transportation</td><td>Unnecessary movement of materials between operations</td><td>Moving battery cells across factory floor multiple times</td></tr>
<tr><td>Inventory</td><td>Excess raw materials, WIP, or finished goods beyond immediate need</td><td>Buffer stock from batch production runs</td></tr>
<tr><td>Motion</td><td>Unnecessary operator movements (reaching, searching, bending)</td><td>Operator walking to retrieve tools from distant location</td></tr>
<tr><td>Waiting</td><td>Idle time waiting for materials, information, approvals, or equipment</td><td>Line stopped waiting for part delivery from supplier</td></tr>
<tr><td>Overproduction</td><td>Producing more than the customer needs at that time</td><td>Building inventory ahead of demand "just in case"</td></tr>
<tr><td>Overprocessing</td><td>More work or effort than customer requires</td><td>Applying fine tolerances to non-critical features</td></tr>

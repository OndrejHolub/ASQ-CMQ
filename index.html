          <div style={{ display: "flex", flexDirection: "column", gap: "20px" }}>
            {domain.infographic.items.map((item, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: "20px" }}>
                <div style={{ width: "120px", flexShrink: 0 }}>

                <polygon key={ring} points={domain.infographic.items.map((_,i) => {
                  const angle = (Math.PI*2*i)/domain.infographic.items.length - Math.PI/2;
                  const r = (ring/5)*120;
                  return `${150+r*Math.cos(angle)},${150+r*Math.sin(angle)}`;

              ))}
              <polygon points={domain.infographic.items.map((item,i) => {
                const angle = (Math.PI*2*i)/domain.infographic.items.length - Math.PI/2;

                return `${150+r*Math.cos(angle)},${150+r*Math.sin(angle)}`;
              }).join(" ")} fill={domain.color+"20"} stroke={domain.color} strokeWidth="2" style={{ transition: "all 1s ease", opacity: animated ? 1 : 0 }} />

    const QuizView = ({ domain }) => {
      const [current, setCurrent] = React.useState(0);
      const [selected, setSelected] = React.useState(null);
      const [showExp, setShowExp] = React.useState(false);
      const [score, setScore] = React.useState(0);
      const [finished, setFinished] = React.useState(false);
      const q = domain.quiz[current];

      const handleSelect = (idx) => {
        if (selected !== null) return;
        setSelected(idx); setShowExp(true);
        if (idx === q.correct) setScore(s => s + 1);
      };
      const handleNext = () => {
        if (current < domain.quiz.length - 1) { setCurrent(c => c+1); setSelected(null); setShowExp(false); }
        else setFinished(true);
      };
      const restart = () => { setCurrent(0); setSelected(null); setShowExp(false); setScore(0); setFinished(false); };

      if (finished) return (
        <div style={{ textAlign: "center", padding: "40px 0" }}>
          <div style={{ fontSize: "80px", fontWeight: 800, color: domain.color }}>{score}/{domain.quiz.length}</div>
          <p style={{ fontSize: "22px", color: "#fff", margin: "16px 0 8px", fontWeight: 600 }}>

          <p style={{ fontSize: "15px", color: "#888", marginBottom: "32px" }}>

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "24px" }}>
            <span style={{ fontSize: "13px", color: "#888", letterSpacing: "1px" }}>QUESTION {current+1} OF {domain.quiz.length}</span>

          <div style={{ height: "3px", background: "rgba(255,255,255,0.05)", borderRadius: "2px", marginBottom: "32px" }}>
            <div style={{ height: "100%", width: `${((current+(selected!==null?1:0))/domain.quiz.length)*100}%`, background: domain.color, borderRadius: "2px", transition: "width 0.5s" }} />
          </div>
          <h3 style={{ fontSize: "clamp(18px,2.5vw,22px)", color: "#fff", fontWeight: 600, lineHeight: 1.5, margin: "0 0 28px" }}>{q.q}</h3>

            {q.options.map((opt, i) => {
              let bg = "rgba(255,255,255,0.04)", border = "rgba(255,255,255,0.08)", txt = "#ccc";
              if (selected !== null) {
                if (i === q.correct) { bg="rgba(0,200,83,0.12)"; border="rgba(0,200,83,0.4)"; txt="#69F0AE"; }
                else if (i === selected) { bg="rgba(255,77,77,0.12)"; border="rgba(255,77,77,0.4)"; txt="#FF8A80"; }
              }
              return (
                <button key={i} onClick={() => handleSelect(i)} style={{
                  padding: "16px 20px", background: bg, border: `1px solid ${border}`, borderRadius: "14px",
                  color: txt, fontSize: "15px", fontWeight: 500, textAlign: "left",
                  cursor: selected === null ? "pointer" : "default", transition: "all 0.3s",
                  display: "flex", alignItems: "center", gap: "12px"
                }}>
                  <span style={{
                    width: "28px", height: "28px", borderRadius: "8px", flexShrink: 0,
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: "13px", fontWeight: 700,
                    background: selected!==null && i===q.correct ? "rgba(0,200,83,0.2)" : selected===i ? "rgba(255,77,77,0.2)" : "rgba(255,255,255,0.06)",
                    color: selected!==null && i===q.correct ? "#69F0AE" : selected===i ? "#FF8A80" : "#888"

              <button onClick={handleNext} style={{ marginTop: "16px", padding: "12px 28px", background: domain.color, color: "#fff", border: "none", borderRadius: "980px", fontSize: "14px", fontWeight: 600, cursor: "pointer" }}>
                {current < domain.quiz.length-1 ? "Next Question →" : "View Results"}
              </button>
            </div>
          )}

      );

    const FlashcardView = ({ domain }) => {

        <div>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "24px" }}>
            <span style={{ fontSize: "13px", color: "#888" }}>Card {current+1} of {domain.flashcards.length}</span>

            <button onClick={() => { const s = new Set(mastered); if(s.has(current)) s.delete(current); else s.add(current); setMastered(s); }}

              style={{ padding: "12px 24px", background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: "980px", color: current===domain.flashcards.length-1?"#444":"#ccc", fontSize: "14px", fontWeight: 600, cursor: current===domain.flashcards.length-1?"default":"pointer" }}>Next →</button>
          </div>
        </div>
      );
    };

              {activeTab === "Infographic" && <InfographicView domain={domain} />}
              {activeTab === "Quiz" && <QuizView domain={domain} />}
              {activeTab === "Flashcards" && <FlashcardView domain={domain} />}
            </div>
          </div>
        </div>
      );
    };

    const ExamWeightChart = () => {
      const [animated, setAnimated] = React.useState(false);
      React.useEffect(() => { setTimeout(() => setAnimated(true), 300); }, []);
      const total = DOMAINS.reduce((s,d) => s+d.questions, 0);
      return (
        <div style={{ padding: "100px 20px", background: "#000", borderTop: "1px solid rgba(255,255,255,0.04)" }}>
          <div style={{ maxWidth: "900px", margin: "0 auto", textAlign: "center" }}>
            <div style={{ fontSize: "13px", color: "#888", letterSpacing: "4px", textTransform: "uppercase", marginBottom: "16px" }}>Exam Blueprint</div>
            <h2 style={{ fontSize: "clamp(30px,5vw,48px)", fontWeight: 800, color: "#fff", margin: "0 0 48px" }}>Know Where to Focus</h2>
            <div style={{ display: "flex", borderRadius: "12px", overflow: "hidden", height: "48px", marginBottom: "32px" }}>
              {DOMAINS.map((d,i) => (
                <div key={i} style={{
                  width: animated ? `${(d.questions/total)*100}%` : "0%",
                  background: d.color, transition: `width 1s cubic-bezier(0.16,1,0.3,1) ${i*0.1}s`,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: "12px", fontWeight: 700, color: "#fff", overflow: "hidden", whiteSpace: "nowrap"
                }}>{d.questions > 15 ? `${Math.round((d.questions/total)*100)}%` : ""}</div>
              ))}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "16px", justifyContent: "center" }}>
              {DOMAINS.map((d,i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <div style={{ width: "12px", height: "12px", borderRadius: "3px", background: d.color }} />
                  <span style={{ fontSize: "13px", color: "#999" }}>{d.title.split(" ").slice(0,2).join(" ")} ({d.questions})</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // ─── MAIN APP ───────────────────────────────────────────────────────────
    function App() {
      const [view, setView] = React.useState("home");
      const [selectedDomain, setSelectedDomain] = React.useState(null);
      const domainRef = React.useRef(null);

      const handleExplore = () => { domainRef.current?.scrollIntoView({ behavior: "smooth" }); };
      const handleDomainClick = (d) => { setSelectedDomain(d); setView("detail"); window.scrollTo({top:0,behavior:"smooth"}); };
      const handleBack = () => { setView("home"); setSelectedDomain(null); setTimeout(() => domainRef.current?.scrollIntoView({behavior:"smooth"}), 100); };

      if (view === "detail" && selectedDomain) return <DomainDetail domain={selectedDomain} onBack={handleBack} />;

      return (
        <div style={{ minHeight: "100vh", background: "#000", color: "#fff" }}>
          <nav style={{
            position: "fixed", top: 0, left: 0, right: 0, zIndex: 100,
            background: "rgba(0,0,0,0.72)", backdropFilter: "blur(24px)",
            borderBottom: "1px solid rgba(255,255,255,0.06)",
            padding: "0 24px", height: "52px", display: "flex", alignItems: "center", justifyContent: "space-between"
          }}>
            <div style={{ fontSize: "15px", fontWeight: 700, letterSpacing: "0.5px" }}>
              <span style={{ color: "#fff" }}>CQM</span><span style={{ color: "#FF4D4D" }}>Pro</span>
            </div>
            <div style={{ display: "flex", gap: "24px" }}>
              {["Domains","Blueprint"].map(item => (
                <button key={item} onClick={handleExplore} style={{
                  background: "none", border: "none", color: "#999", fontSize: "13px",
                  cursor: "pointer", fontWeight: 500, transition: "color 0.2s"
                }}
                onMouseEnter={e => e.target.style.color="#fff"}
                onMouseLeave={e => e.target.style.color="#999"}
                >{item}</button>
              ))}
            </div>
          </nav>

          <HeroSection onExplore={handleExplore} />

          <div ref={domainRef} style={{ padding: "100px 20px", borderTop: "1px solid rgba(255,255,255,0.04)" }}>
            <div style={{ maxWidth: "1100px", margin: "0 auto" }}>
              <div style={{ textAlign: "center", marginBottom: "64px" }}>
                <div style={{ fontSize: "13px", color: "#888", letterSpacing: "4px", textTransform: "uppercase", marginBottom: "16px" }}>Body of Knowledge</div>
                <h2 style={{
                  fontSize: "clamp(30px,5vw,48px)", fontWeight: 800,
                  background: "linear-gradient(135deg, #FFFFFF 0%, #888888 100%)",
                  WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent"
                }}>7 Domains. One Certification.</h2>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: "16px" }}>
                {DOMAINS.map((d,i) => <DomainCard key={d.id} domain={d} onClick={handleDomainClick} index={i} />)}
              </div>
            </div>
          </div>

          <ExamWeightChart />

          <footer style={{ padding: "48px 20px", borderTop: "1px solid rgba(255,255,255,0.04)", textAlign: "center" }}>
            <p style={{ fontSize: "13px", color: "#555" }}>Built for Quality Engineers preparing for the ASQ CMQ/OE Certification Exam</p>
            <p style={{ fontSize: "12px", color: "#333", marginTop: "8px" }}>Based on the ASQ CMQ/OE Body of Knowledge · Not affiliated with ASQ</p>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>

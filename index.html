<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASQ CMQ/OE Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f12;
  --bg2: #13161b;
  --bg3: #1a1f27;
  --border: #252b35;
  --text: #c9d1d9;
  --text-muted: #6e7681;
  --text-bright: #e6edf3;
  --accent: #f0c040;
  --accent2: #3d9cf0;
  --accent3: #56d364;
  --accent4: #f0886f;
  --sidebar-w: 280px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.7;
  overflow-x: hidden;
}

/* ── LAYOUT ── */
#app { display: flex; min-height: 100vh; }

/* ── SIDEBAR ── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  z-index: 100;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg2);
  z-index: 10;
}
.sidebar-logo {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.3;
}

#search-box {
  margin: 12px 12px 0;
  position: relative;
}
#search-input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  padding: 7px 10px 7px 32px;
  outline: none;
  transition: border-color .2s;
}
#search-input:focus { border-color: var(--accent2); }
#search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  left: 9px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
}

.nav-area { padding: 8px 0 24px; }

.part-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 16px 16px 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.part-label:hover { color: var(--text); }
.part-label .part-icon { font-size: 12px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all .15s;
  text-decoration: none;
}
.nav-item:hover { color: var(--text); background: var(--bg3); }
.nav-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(240,192,64,.06);
}
.nav-item .ch-icon { font-size: 14px; min-width: 18px; }
.nav-item .ch-title { flex: 1; line-height: 1.3; }
.nav-item .done-badge {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--accent3);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #000; font-weight: 700;
  opacity: 0; transition: opacity .2s;
}
.nav-item.done .done-badge { opacity: 1; }

.progress-bar-wrap {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  margin-top: auto;
}
.progress-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.progress-track {
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent3));
  border-radius: 2px;
  transition: width .4s ease;
}

/* ── MAIN ── */
#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-breadcrumb {
  font-size: 13px;
  color: var(--text-muted);
}
.topbar-breadcrumb span { color: var(--text); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 14px;
  border-radius: 5px;
  border: 1px solid;
  cursor: pointer;
  letter-spacing: .05em;
  transition: all .15s;
}
.btn-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text-muted);
}
.btn-outline:hover { border-color: var(--text-muted); color: var(--text); }
.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
}
.btn-accent:hover { background: #ffd060; }

#content {
  flex: 1;
  padding: 40px 48px 80px;
  max-width: 900px;
}

/* ── CHAPTER CONTENT ── */
.ch-header { margin-bottom: 36px; }
.ch-header-icon { font-size: 36px; margin-bottom: 12px; }
.ch-header-part {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent2);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.ch-header-title {
  font-size: 28px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.25;
  margin-bottom: 4px;
}
.ch-header-bok {
  font-size: 13px;
  color: var(--text-muted);
}

h2 {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-bright);
  margin: 32px 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-bright);
  margin: 24px 0 8px;
}
h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent2);
  margin: 16px 0 6px;
}
p { margin-bottom: 12px; }
ul, ol {
  padding-left: 20px;
  margin-bottom: 12px;
}
li { margin-bottom: 4px; }
strong { color: var(--text-bright); font-weight: 600; }
em { color: var(--text-muted); font-style: italic; }
code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
  color: var(--accent2);
}

/* Exam tip callout */
.exam-tip {
  background: rgba(240,192,64,.07);
  border: 1px solid rgba(240,192,64,.25);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 12px 16px;
  margin: 16px 0;
  font-size: 14px;
}
.exam-tip::before {
  content: '🎯 EXAM TIP';
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--accent);
  margin-bottom: 6px;
}

/* Key terms table */
.kt-table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 13px;
}
.kt-table th {
  background: var(--bg3);
  color: var(--accent2);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 8px 12px;
  text-align: left;
  border: 1px solid var(--border);
}
.kt-table td {
  padding: 8px 12px;
  border: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}
.kt-table tr:nth-child(even) td { background: rgba(255,255,255,.02); }
.kt-table td:first-child {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-bright);
  white-space: nowrap;
}

/* Formula callout */
.formula {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent2);
  border-radius: 6px;
  padding: 12px 16px;
  margin: 12px 0;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--accent2);
}

/* Model box */
.model-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  margin: 16px 0;
}
.model-box h4 { margin-top: 0; }

/* Tag badge */
.tag {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: .06em;
}
.tag-domain { background: rgba(61,156,240,.15); color: var(--accent2); }
.tag-level { background: rgba(86,211,100,.15); color: var(--accent3); }

/* ── SEARCH RESULTS ── */
#search-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 12px; right: 12px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  max-height: 300px;
  overflow-y: auto;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.search-result-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--bg3); }
.sr-ch { font-size: 13px; color: var(--text-bright); font-weight: 600; }
.sr-ctx { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.sr-hi { color: var(--accent); font-weight: 600; }

/* ── HOME ── */
.home-hero {
  padding: 48px 48px 0;
  max-width: 900px;
}
.home-tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.home-title {
  font-size: 36px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1.2;
  margin-bottom: 12px;
}
.home-sub {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 32px;
  max-width: 600px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 40px;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
}
.stat-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 26px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 4px;
}
.stat-label {
  font-size: 12px;
  color: var(--text-muted);
}
.exam-blueprint {
  padding: 0 48px 48px;
  max-width: 900px;
}
.exam-blueprint h2 {
  font-size: 18px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
  margin-bottom: 16px;
}
.domain-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.domain-num {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent2);
  min-width: 24px;
}
.domain-name { flex: 1; color: var(--text); }
.domain-qs {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text-muted);
  min-width: 50px;
  text-align: right;
}
.domain-pct {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  min-width: 44px;
  text-align: right;
}
.domain-bar-wrap { min-width: 100px; }
.domain-bar {
  height: 6px;
  background: var(--bg3);
  border-radius: 3px;
  overflow: hidden;
}
.domain-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 3px;
}

/* ── CHAPTER NAV BUTTONS ── */
.ch-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.ch-nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  transition: all .15s;
}
.ch-nav-btn:hover { color: var(--text); border-color: var(--text-muted); }
.ch-nav-btn.disabled { opacity: .3; cursor: default; pointer-events: none; }

/* ── MOBILE HAMBURGER ── */
#menu-toggle {
  display: none;
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  padding: 6px 10px;
  cursor: pointer;
  font-size: 16px;
}
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 90;
}

@media (max-width: 768px) {
  #sidebar {
    position: fixed;
    left: -100%;
    transition: left .25s ease;
    z-index: 100;
  }
  #sidebar.open { left: 0; }
  .overlay.open { display: block; }
  #menu-toggle { display: block; }
  #content { padding: 24px 20px 60px; }
  .home-hero { padding: 24px 20px 0; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .exam-blueprint { padding: 0 20px 40px; }
  .topbar { padding: 12px 16px; }
  .home-title { font-size: 26px; }
}
</style>
</head>

const CHAPTERS = {
1: { icon:'🏢', title:'Organizational Structures', bok:'I.A', part:'I',
content:`
<h2>Evolution of Quality</h2>
<p><strong>Timeline:</strong> 1920s SPC (Shewhart at Bell Labs) → 1930s Deming brings SPC to Japan → 1980s TQM (Deming/Juran/Crosby/Feigenbaum) → BPR → Six Sigma → Lean-Six Sigma → BPM</p>
<div class="exam-tip">Know the chronological evolution: SPC → TQM → BPR → Six Sigma → BPM. Know key quality gurus and their contributions.</div>

<h2>Organizational Design Factors</h2>
<p><strong>3 major factors:</strong></p>
<ul>
<li><strong>Complexity</strong> — number of different entities (job titles, departments, locations)</li>
<li><strong>Formalization</strong> — how much standard guidelines direct behavior</li>
<li><strong>Centralization</strong> — whether decisions are at top or delegated downward</li>
</ul>
<h3>Vertical Design: Unity of Command</h3>
<p>Each subordinate reports to only one superior. <strong>Span of control</strong> = how many subordinates a manager can effectively supervise. Flat orgs = wider spans, fewer layers = more efficient.</p>
<div class="exam-tip">Know the factors affecting span of control — this is frequently tested.</div>

<h2>Types of Organizational Structures</h2>
<table class="kt-table"><thead><tr><th>Structure</th><th>Key Feature</th><th>Best For</th></tr></thead><tbody>
<tr><td>Functional</td><td>Grouped by specialty (engineering, finance, HR)</td><td>Most common; clear authority</td></tr>
<tr><td>Product</td><td>Each major product line under dedicated executive</td><td>Diverse product portfolios</td></tr>
<tr><td>Customer</td><td>Organized by customer segments</td><td>Distinct customer groups</td></tr>
<tr><td>Geographic</td><td>Organized by territory</td><td>Geographically dispersed customers</td></tr>
<tr><td>Process</td><td>Organized around production flow</td><td>Manufacturing workflows</td></tr>
<tr><td>Matrix</td><td>Dual reporting: functional + project manager</td><td>Complex aerospace, R&D orgs</td></tr>
<tr><td>Team</td><td>Cross-functional specialist teams</td><td>Project-based work</td></tr>
<tr><td>Cellular</td><td>Self-contained unit for all operations on a product</td><td>Lean manufacturing</td></tr>
<tr><td>Boundaryless/Network</td><td>Breaks down hierarchy/geographic barriers</td><td>Virtual orgs, startups</td></tr>
</tbody></table>
<div class="exam-tip">Matrix organizations are heavily tested. Pros: rapid response, efficient specialist use. Cons: dual reporting conflict, power struggles.</div>

<h3>Factors Affecting Structure Selection</h3>
<p>Strategy, size, technology, core competencies, regulatory environment, union representation, national/societal culture.</p>

<h2>Management Hierarchy</h2>
<ul>
<li><strong>Top Management:</strong> Sets vision, mission, strategic objectives; allocates resources</li>
<li><strong>Middle Management:</strong> Translates strategy to operational plans; day-to-day operations</li>
<li><strong>First-Level Supervision:</strong> Oversees production; directly supervises workforce</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Unity of Command</td><td>Each subordinate reports to only one superior</td></tr>
<tr><td>Span of Control</td><td>Number of subordinates a manager can effectively supervise</td></tr>
<tr><td>Centralization</td><td>Decision-making authority concentrated at top levels</td></tr>
<tr><td>Decentralization</td><td>Decision-making authority delegated to lower levels</td></tr>
<tr><td>Matrix Organization</td><td>Dual reporting — functional + product/project managers</td></tr>
<tr><td>Division of Labor</td><td>Breaking work into specialized steps</td></tr>
<tr><td>Boundaryless Org</td><td>Network structure eliminating traditional barriers</td></tr>
<tr><td>BPM</td><td>Business Process Management — documenting and managing key processes</td></tr>
</tbody></table>
`},

2: { icon:'🎯', title:'Leadership Challenges', bok:'I.B', part:'I',
content:`
<h2>Leader vs. Manager</h2>
<table class="kt-table"><thead><tr><th>Aspect</th><th>Leader</th><th>Manager</th></tr></thead><tbody>
<tr><td>Focus</td><td>Doing the RIGHT things</td><td>Doing things RIGHT</td></tr>
<tr><td>Authority</td><td>Earned through followers</td><td>Granted by position</td></tr>
<tr><td>Orientation</td><td>Vision, change, inspiration</td><td>Planning, organizing, controlling</td></tr>
<tr><td>Relationship</td><td>Followers choose to follow</td><td>Subordinates report by structure</td></tr>
</tbody></table>

<h2>Leadership Styles</h2>
<ul>
<li><strong>Transactional:</strong> Clear tasks/rewards exchange. "Hired gun" who delivers by contract</li>
<li><strong>Transformational:</strong> Articulates vision; elevates goals; enhances self-confidence. Example: Bob Galvin/Motorola Six Sigma</li>
<li><strong>Charismatic:</strong> Gathers followers through personal motivation and persuasion</li>
</ul>
<div class="exam-tip">Distinguish transactional (exchange/contract/rewards) vs. transformational (vision/values/change). Heavily tested.</div>

<h2>Goleman's 5 Dimensions of Emotional Intelligence</h2>
<table class="kt-table"><thead><tr><th>Dimension</th><th>Elements</th></tr></thead><tbody>
<tr><td>Self-awareness</td><td>Emotional self-assessment, accurate self-assessment, self-confidence</td></tr>
<tr><td>Self-regulation</td><td>Trustworthiness, conscientiousness, adaptability, innovation</td></tr>
<tr><td>Motivation</td><td>Achievement drive, commitment, initiative, optimism</td></tr>
<tr><td>Empathy</td><td>Understanding others, developing others, service orientation, diversity leverage</td></tr>
<tr><td>Social Skills</td><td>Influence, communication, conflict management, collaboration, team capabilities</td></tr>
</tbody></table>
<div class="exam-tip">All 5 Goleman dimensions are tested. Remember the order and examples under each.</div>

<h2>Kotter's 8-Step Change Model</h2>
<ol>
<li>Create urgency and awareness of need for change</li>
<li>Organize a project with sufficient authority</li>
<li>Define vision and strategies</li>
<li>Communicate the vision — demonstrate personal commitment</li>
<li>Remove obstacles preventing action on the vision</li>
<li>Go for early and visible successes</li>
<li>Build on success; reward supporters; involve more people</li>
<li>Institutionalize new methods — align other systems</li>
</ol>
<div class="exam-tip">Know all 8 steps AND common errors (complacency, weak guidance coalition, not anchoring in culture).</div>

<h2>Motivation Theories</h2>
<div class="model-box">
<h4>Maslow's Hierarchy (bottom to top)</h4>
<p>1. Physiological → 2. Safety → 3. Belonging → 4. Esteem → 5. Self-actualization</p>
<p>People must satisfy lower needs before higher ones become motivating.</p>
</div>
<div class="model-box">
<h4>Herzberg Two-Factor Theory</h4>
<p><strong>Satisfiers (Motivators):</strong> Achievement, recognition, work itself, responsibility, advancement</p>
<p><strong>Dissatisfiers (Hygiene Factors):</strong> Company policy, supervision, salary, work conditions</p>
<p>Hygiene factors prevent dissatisfaction but don't create satisfaction. Motivators create true satisfaction.</p>
</div>
<p><strong>Additional theories:</strong> McClelland (achievement/affiliation/power), Vroom's Expectancy Theory, Reinforcement Theory</p>

<h2>Hersey & Blanchard Situational Leadership</h2>
<table class="kt-table"><thead><tr><th>Style</th><th>Task</th><th>Relationship</th><th>When to Use</th></tr></thead><tbody>
<tr><td>Telling (S1)</td><td>High</td><td>Low</td><td>New, inexperienced employee</td></tr>
<tr><td>Selling (S2)</td><td>High</td><td>High</td><td>Employee gaining confidence</td></tr>
<tr><td>Participating (S3)</td><td>Low</td><td>High</td><td>Experienced, needs support</td></tr>
<tr><td>Delegating (S4)</td><td>Low</td><td>Low</td><td>Highly experienced, autonomous</td></tr>
</tbody></table>

<h2>Conflict-Handling Modes (Assertiveness vs. Cooperativeness)</h2>
<ul>
<li><strong>Competing</strong> (high assert, low coop): Win-lose</li>
<li><strong>Collaborating</strong> (high assert, high coop): Win-win — PREFERRED</li>
<li><strong>Compromising</strong> (moderate both): Middle ground</li>
<li><strong>Avoiding</strong> (low both): Withdrawal</li>
<li><strong>Accommodating</strong> (low assert, high coop): Yielding</li>
</ul>

<h2>Empowerment</h2>
<p><strong>Job enlargement:</strong> More tasks at same level (horizontal expansion)<br>
<strong>Job enrichment:</strong> More decision-making authority (vertical expansion)</p>
<div class="exam-tip">Conflict-handling modes matrix (assertiveness vs. cooperativeness) is a core exam topic. Know all 5 modes.</div>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Transformational Leadership</td><td>Articulates vision; elevates subordinates' goals</td></tr>
<tr><td>Transactional Leadership</td><td>Contractual — clear tasks for clear rewards</td></tr>
<tr><td>Change Agent</td><td>Individual who facilitates planning/implementation of change</td></tr>
<tr><td>Kotter's 8 Steps</td><td>Urgency → Coalition → Vision → Communicate → Empower → Short wins → Build → Anchor</td></tr>
<tr><td>Job Enlargement</td><td>Expanding scope horizontally (more tasks, same level)</td></tr>
<tr><td>Job Enrichment</td><td>Expanding depth vertically (more decision authority)</td></tr>
<tr><td>Maslow's Hierarchy</td><td>Physiological → Safety → Belonging → Esteem → Self-actualization</td></tr>
<tr><td>Herzberg Two-Factor</td><td>Satisfiers (motivators) vs. Dissatisfiers (hygiene factors)</td></tr>
<tr><td>TRIZ</td><td>Inventive problem-solving methodology using 40 principles</td></tr>
<tr><td>Socratic Method</td><td>Using guided questions to develop critical thinking</td></tr>
</tbody></table>
`},

3: { icon:'🧑‍🤝‍🧑', title:'Teams and Team Processes', bok:'I.C', part:'I',
content:`
<h2>Types of Teams</h2>
<table class="kt-table"><thead><tr><th>Team Type</th><th>Key Characteristics</th></tr></thead><tbody>
<tr><td>Self-Managed</td><td>Authorized to make day-to-day decisions (scheduling, quality, maintenance). Best at greenfield sites.</td></tr>
<tr><td>Process Improvement</td><td>Cross-functional, project-based, has defined start/end. Guided by project plan.</td></tr>
<tr><td>Ad Hoc / Temporary</td><td>Formed for specific problem/emergency. Less formal structure.</td></tr>
<tr><td>Work Group (Natural)</td><td>Responsible for a specific process/product line</td></tr>
<tr><td>Cellular</td><td>U-shaped layout; cross-trained operators; all steps in one area</td></tr>
<tr><td>Special Project</td><td>Long-term dedicated team — reengineering, mergers, system replacement</td></tr>
<tr><td>Virtual</td><td>Geographically dispersed; communicate via technology</td></tr>
</tbody></table>
<div class="exam-tip">Virtual teams and self-managed teams are most frequently tested. Self-managed teams work BEST in greenfield sites — cultural change is too dramatic in existing organizations.</div>

<h2>Tuckman's 5 Stages of Team Development</h2>
<table class="kt-table"><thead><tr><th>Stage</th><th>Description</th><th>Leader Style</th></tr></thead><tbody>
<tr><td>Forming</td><td>Orientation; polite; roles established</td><td>Directive</td></tr>
<tr><td>Storming</td><td>Conflict; challenge authority — most critical stage</td><td>Coaching</td></tr>
<tr><td>Norming</td><td>Cohesion; cooperation; norms established</td><td>Supportive</td></tr>
<tr><td>Performing</td><td>High productivity; focus on goals</td><td>Delegating</td></tr>
<tr><td>Adjourning</td><td>Disbands after mission; recognition/closure</td><td>Celebrating</td></tr>
</tbody></table>
<div class="exam-tip">Tuckman's stages are heavily tested. Know what happens at each stage and appropriate leader response.</div>

<h2>Key Team Roles</h2>
<table class="kt-table"><thead><tr><th>Role</th><th>Responsibility</th></tr></thead><tbody>
<tr><td>Team Leader</td><td>Coordinates meetings; guides team; reports progress; has vested interest in content</td></tr>
<tr><td>Team Facilitator</td><td>Guides process; remains NEUTRAL; does not get involved in content</td></tr>
<tr><td>Process Owner</td><td>Accountable for outcomes; authority over process</td></tr>
<tr><td>Champion/Sponsor</td><td>Provides authority, resources; removes barriers; represents to management</td></tr>
<tr><td>Scribe/Recorder</td><td>Documents decisions and action items</td></tr>
<tr><td>Timekeeper</td><td>Monitors meeting time; keeps discussions on schedule</td></tr>
</tbody></table>
<div class="exam-tip">Key distinction: Team Leader is involved in content; Facilitator focuses on PROCESS and is impartial.</div>

<h2>Groupthink</h2>
<p>Occurs when team prioritizes harmony over honest discussion. Members coalesce behind a decision without full exploration.</p>
<p><strong>Prevention:</strong> Brainstorm alternatives; encourage dissent; assign devil's advocate role; allow adequate time for all ideas.</p>

<h2>KESAM Model for Team Selection</h2>
<table class="kt-table"><thead><tr><th>Factor</th><th>Description</th></tr></thead><tbody>
<tr><td>K — Knowledge</td><td>Proven techniques; project planning principles</td></tr>
<tr><td>E — Experience</td><td>2+ years relevant experience; instructed/trained others</td></tr>
<tr><td>S — Skills</td><td>Communication; proficiency in tools</td></tr>
<tr><td>A — Attitude</td><td>Enjoys imparting knowledge; team-oriented</td></tr>
<tr><td>M — Additional</td><td>Specific tools/methods preferred</td></tr>
</tbody></table>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Groupthink</td><td>Tendency for team consensus to override critical evaluation</td></tr>
<tr><td>Consensus</td><td>Decision acceptable enough that ALL members will support it</td></tr>
<tr><td>Charter</td><td>Formal document defining team's authority and scope</td></tr>
<tr><td>KESAM</td><td>Knowledge, Experience, Skills, Attitude, Additional comments</td></tr>
<tr><td>Tuckman Stages</td><td>Forming, Storming, Norming, Performing, Adjourning</td></tr>
</tbody></table>
`},

4: { icon:'⚖️', title:'ASQ Code of Ethics', bok:'I.D', part:'I',
content:`
<h2>ASQ Code of Ethics — Three Pillars</h2>

<h3>A. Act with Integrity and Honesty</h3>
<ul>
<li>Uphold the honor and dignity of the quality profession</li>
<li>Be truthful and transparent in all professional interactions</li>
<li>Accurately represent qualifications and competence</li>
<li>Only offer services within your areas of competence</li>
</ul>

<h3>B. Demonstrate Responsibility</h3>
<ul>
<li><strong>Hold paramount</strong> the safety, health, and welfare of individuals, the public, and the environment</li>
<li>Avoid conduct that will cause harm through words or deeds</li>
<li>Treat others fairly, courteously, with dignity; without prejudice or discrimination</li>
<li>Act in a professional and socially responsible manner</li>
</ul>

<h3>C. Safeguard Proprietary Information / Avoid Conflicts of Interest</h3>
<ul>
<li>Ensure protection and integrity of confidential information</li>
<li><strong>Never</strong> use confidential information for personal gain</li>
<li>Fully disclose and avoid any real or perceived conflicts of interest</li>
<li>Give credit where it is due; no plagiarism</li>
</ul>

<div class="exam-tip">Public safety ALWAYS takes priority over employer/personal loyalty. Expect 2-3 scenario-based ethics questions. When in doubt: choose the answer that prioritizes public safety and honest disclosure.</div>

<h2>ISO 26000</h2>
<p>International standard providing guidance on <strong>social responsibility</strong>. Not directly referenced in ASQ code but its intent permeates ethical behavior.</p>

<h2>Practical Scenarios</h2>
<ul>
<li><strong>Cross-border ethics:</strong> Local unethical behavior should never be accepted simply because it is local practice</li>
<li><strong>Confidential info:</strong> Never use for personal gain, regardless of circumstances</li>
<li><strong>Conflicts of interest:</strong> Disclose proactively — both real AND perceived</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Code of Ethics</td><td>Global standards of conduct for ASQ members and certification holders</td></tr>
<tr><td>Conflict of Interest</td><td>Any situation where personal interests could impair objectivity</td></tr>
<tr><td>ISO 26000</td><td>International guidance standard on social responsibility</td></tr>
<tr><td>Paramount Safety</td><td>Holding safety, health, and welfare above all other concerns</td></tr>
<tr><td>Plagiarism</td><td>Using others' intellectual property without permission or credit</td></tr>
</tbody></table>
`},

5: { icon:'🎯', title:'Strategic Planning Models', bok:'II.A', part:'II',
content:`
<h2>Three Levels of Planning</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Description</th><th>Time Horizon</th></tr></thead><tbody>
<tr><td>Strategic</td><td>High-level direction; what org strives to become</td><td>3–5+ years</td></tr>
<tr><td>Tactical</td><td>How to implement strategic plan; specific tasks</td><td>1–3 years</td></tr>
<tr><td>Operational</td><td>Action plans; who, what, when, how; day-to-day execution</td><td>Months to 1 year</td></tr>
</tbody></table>

<h2>Mission, Vision, Values</h2>
<ul>
<li><strong>Vision:</strong> What org wants to BECOME in the future. Brief, inspiring, desired future state.</li>
<li><strong>Mission:</strong> WHY the org exists. Defines purpose in terms of what, who, and how.</li>
<li><strong>Values/Guiding Principles:</strong> HOW business is conducted; bases for ethical decision-making</li>
</ul>

<h2>Hoshin Kanri (Policy Deployment)</h2>
<p>A tightly knit planning and implementation system connecting MBO with organizational direction. Involves <strong>every member</strong> at every level.</p>
<div class="model-box">
<h4>Key Features</h4>
<ul>
<li>Uses <strong>PDCA loop</strong> to ensure strategic plans are met</li>
<li>Team-based problem-solving and decision-making</li>
<li><strong>Catchball:</strong> Passing plans back and forth between levels for consensus (iterative up/down negotiation)</li>
<li>Fact-based system; constant tracking, measuring, reviewing</li>
</ul>
</div>
<p><strong>Disadvantages:</strong> Heavy emphasis on total org involvement; consensus at every level; may take 3+ years to mature; major culture change required.</p>
<div class="exam-tip">Hoshin = policy deployment. It involves EVERY level, uses PDCA, and is a complete system — NOT just MBO. Know both advantages and disadvantages.</div>

<h2>Scenario Planning</h2>
<p>Disciplined method for imagining possible futures. Uses <strong>3 macro scenarios:</strong> good future, bad future, wild card.</p>

<h2>S.M.A.R.T.W.A.Y. Framework</h2>
<table class="kt-table"><thead><tr><th>Letter</th><th>Meaning</th></tr></thead><tbody>
<tr><td>S</td><td>Specific needs and opportunities</td></tr>
<tr><td>M</td><td>Measurable — establish a measurement for each objective</td></tr>
<tr><td>A</td><td>Achievable as well as challenging</td></tr>
<tr><td>R</td><td>Realistic stretch objectives</td></tr>
<tr><td>T</td><td>Time-framed</td></tr>
<tr><td>W</td><td>Worthwhile return</td></tr>
<tr><td>A</td><td>Assigned responsibility</td></tr>
<tr><td>Y</td><td>Yielding — worth doing</td></tr>
</tbody></table>

<h2>10 Barriers to Successful Strategic Planning</h2>
<p>Top barriers: Delegating planning to a planner (#1), focus on current problems (#2), no suitable goals (#3), failure to involve line personnel (#4), not using plans as performance standards (#5).</p>
<div class="exam-tip">The 10 barriers are commonly tested. Focus on #1 (delegation to planner), #3 (no suitable goals), and #10 (intuitive decisions conflicting with formal plans).</div>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Hoshin Kanri</td><td>Japanese policy deployment system; PDCA; every level involved</td></tr>
<tr><td>Catchball</td><td>Passing plans back and forth between levels for consensus</td></tr>
<tr><td>Vision Statement</td><td>What the org wants to become in the future</td></tr>
<tr><td>Mission Statement</td><td>Why the org exists; fundamental purpose</td></tr>
<tr><td>Means Matrix</td><td>Tool linking objectives to means with responsibility and measurement</td></tr>
<tr><td>Scenario Planning</td><td>Imagining multiple possible futures (good/bad/wild card)</td></tr>
<tr><td>Environmental Scan</td><td>Analysis of external factors affecting the organization</td></tr>
</tbody></table>
`},

6: { icon:'🔍', title:'Business Environment Analysis', bok:'II.B', part:'II',
content:`
<h2>SWOT Analysis</h2>
<ul>
<li><strong>Strengths + Weaknesses = INTERNAL</strong> (org structure, brand, capabilities, financials)</li>
<li><strong>Opportunities + Threats = EXTERNAL</strong> (market changes, competition, regulation, technology)</li>
</ul>
<div class="exam-tip">Always categorize SWOT items as internal (S/W) vs. external (O/T). Frequently tested.</div>

<h2>FMEA in Strategic Planning</h2>
<div class="formula">RPN = Severity (1-10) × Occurrence (1-10) × Detection (1-10)</div>
<p>Detection scale: 10 = inability to detect. Higher RPN = higher priority for action.</p>

<h2>Porter's Five Forces</h2>
<ul>
<li>Competitive rivalry among existing players</li>
<li>Threat of new entrants (entry barriers)</li>
<li>Threat of substitutes (switching costs)</li>
<li>Bargaining power of buyers (ability to compare/shop)</li>
<li>Bargaining power of suppliers (sole source vs. many suppliers)</li>
</ul>

<h2>Stakeholder Analysis</h2>
<p><strong>Internal:</strong> Employees, shareholders, board, management, unions</p>
<p><strong>External:</strong> Customers, suppliers, community, government/regulators, media, professional associations</p>

<h2>Quality 4.0 Technologies</h2>
<table class="kt-table"><thead><tr><th>Technology</th><th>Application to Quality</th></tr></thead><tbody>
<tr><td>AI / Machine Learning</td><td>Predictive quality, pattern detection, SPC automation</td></tr>
<tr><td>IoT / Edge Devices</td><td>Real-time data from connected equipment</td></tr>
<tr><td>Cloud Computing</td><td>Storing and accessing quality data at scale</td></tr>
<tr><td>Big Data</td><td>Analyzing massive datasets for quality insights</td></tr>
<tr><td>Blockchain</td><td>Immutable supply chain traceability</td></tr>
<tr><td>Automation</td><td>Automated inspection and testing systems</td></tr>
</tbody></table>
<div class="exam-tip">Quality 4.0 is increasingly important. Know the key technologies and how they relate to quality management.</div>

<h2>Generational Workforce Differences</h2>
<table class="kt-table"><thead><tr><th>Generation</th><th>Key Characteristics</th></tr></thead><tbody>
<tr><td>Traditionalists</td><td>Paper-based; loyal; respect authority</td></tr>
<tr><td>Baby Boomers</td><td>Electronic but basic; loyal but realistic</td></tr>
<tr><td>Generation X</td><td>Web-based; independent/self-reliant; unimpressed by authority</td></tr>
<tr><td>Millennials</td><td>On-demand; team-oriented; not brand-based</td></tr>
<tr><td>Generation Z</td><td>Electronic-only; digest on-demand content; authority varies</td></tr>
</tbody></table>

<h2>Legal vs. Regulatory Factors</h2>
<ul>
<li><strong>Legal factors:</strong> Laws (enforceable by punishment). Employment, product liability, IP, Sarbanes-Oxley, antitrust.</li>
<li><strong>Regulatory factors:</strong> Rules from agencies and self-regulating bodies. Often voluntary but have force of law.</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>FMEA</td><td>Failure Mode and Effects Analysis — systematic risk identification</td></tr>
<tr><td>RPN</td><td>Risk Priority Number = Severity × Occurrence × Detection</td></tr>
<tr><td>Stakeholder</td><td>Any individual/group affected by the organization's mission</td></tr>
<tr><td>Core Competencies</td><td>Primary capabilities that distinguish org from competitors</td></tr>
<tr><td>Porter's Five Forces</td><td>Competitive rivalry, new entrants, substitutes, buyer power, supplier power</td></tr>
<tr><td>Sarbanes-Oxley</td><td>U.S. legislation on corporate governance and financial disclosure</td></tr>
</tbody></table>
`},

7: { icon:'🚀', title:'Strategic Plan Deployment', bok:'II.C', part:'II',
content:`
<h2>Action Plan Components</h2>
<p>A complete action plan includes: Project definition, date needed, link to strategic objective, project objectives, scope, deliverables, measurement criteria, assumptions, overall approach, start date, resource estimate, benefits vs. costs, timeline (Gantt).</p>

<h2>Resource Allocation and Deployment</h2>
<p><strong>Conflicting activities to assess:</strong> Process reengineering, new ISO/IATF implementation, Six Sigma initiative, new products, outsourcing, mergers/acquisitions, major IT upgrades.</p>
<p><strong>Walkabout technique:</strong> Each person posts their required resources on flip chart. Others walk room, attach sticky notes identifying conflicts. Iterative process until all conflicts resolved.</p>

<h2>Cascading Strategy (QFD-Based)</h2>
<p>Enterprise objectives → Enterprise strategies → Divisional strategies → Divisional objectives → Departmental directives → Departmental action plans → Results</p>
<div class="exam-tip">The cascading concept is heavily tested. Objectives flow from enterprise level down to departmental action plans, with customer requirements integrated at each level.</div>

<h2>Balanced Scorecard</h2>
<p>Measures organizational performance across 4 perspectives:</p>
<ul>
<li><strong>Financial:</strong> Revenue growth, profitability, ROI</li>
<li><strong>Customer:</strong> Satisfaction, retention, market share</li>
<li><strong>Internal Process:</strong> Cycle time, quality, efficiency</li>
<li><strong>Learning & Growth:</strong> Employee development, innovation</li>
</ul>

<h2>Open-Loop vs. Closed-Loop</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th><th>Preferred?</th></tr></thead><tbody>
<tr><td>Open-Loop</td><td>No continuous feedback; relies on intuition for adjustments</td><td>No</td></tr>
<tr><td>Closed-Loop</td><td>Continuous monitoring with immediate adjustment capability</td><td>YES</td></tr>
</tbody></table>

<h2>Quality Policy vs. Objectives vs. Principles</h2>
<ul>
<li><strong>Quality Principles:</strong> Guiding beliefs for organizational decision-making</li>
<li><strong>Quality Policy:</strong> Formalized document communicating org's quality intentions</li>
<li><strong>Quality Objectives:</strong> Specific, measurable, time-bound quality actions (SMART)</li>
</ul>

<h2>Critical Success Factors (CSFs)</h2>
<p>8–12 key indicators targeting the full span of strategic goals. Must be custom-fitted to the specific organization.</p>

<h2>Annual Closed-Loop Assessment</h2>
<ol>
<li>Define "business excellence" for your business</li>
<li>Assess progress (using Baldrige or strategic objectives)</li>
<li>Identify improvement opportunities; compare to world-class; identify gaps</li>
<li>Deploy action plan: set priorities, improvement goals, align metrics, deploy to all levels</li>
</ol>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Action Plan</td><td>Detailed project plan generated from a strategic objective</td></tr>
<tr><td>Cascading</td><td>Flowing objectives from enterprise to departmental level</td></tr>
<tr><td>Walkabout</td><td>Technique for identifying resource conflicts by posting and reviewing plans</td></tr>
<tr><td>Catchball</td><td>Iterative consensus process; passing plans up and down for agreement</td></tr>
<tr><td>Balanced Scorecard</td><td>4-perspective measurement: Financial, Customer, Internal Process, Learning</td></tr>
<tr><td>CSF</td><td>Critical Success Factors — key indicators measuring strategic outcomes</td></tr>
<tr><td>Closed-Loop</td><td>Preferred approach with continuous monitoring and immediate adjustment</td></tr>
<tr><td>Quality Policy</td><td>Formalized document communicating organization's quality intentions</td></tr>
</tbody></table>
`},

8: { icon:'💼', title:'Management Skills and Abilities', bok:'III.A', part:'III',
content:`
<h2>POSDC Management Functions</h2>
<table class="kt-table"><thead><tr><th>Function</th><th>Description</th></tr></thead><tbody>
<tr><td>Planning</td><td>Defining vision, mission, strategies; monitoring to ensure desired outputs</td></tr>
<tr><td>Organizing</td><td>Determining org structure; dividing work; allocating authority</td></tr>
<tr><td>Staffing</td><td>Acquiring right people; placing them in right jobs; developing competencies</td></tr>
<tr><td>Directing</td><td>Guiding work; communicating vision; day-to-day delegation</td></tr>
<tr><td>Controlling</td><td>Monitoring activities/results; initiating corrective action</td></tr>
</tbody></table>

<h2>Management Theories</h2>
<table class="kt-table"><thead><tr><th>Theory</th><th>Key Points</th></tr></thead><tbody>
<tr><td>Scientific (Taylor)</td><td>"One best way" to perform tasks; time & motion studies; separates thinking from doing</td></tr>
<tr><td>Hawthorne Effect</td><td>Productivity changed because workers were singled out for attention, NOT due to physical changes</td></tr>
<tr><td>Theory X (McGregor)</td><td>Employees don't want to work; need control and direction</td></tr>
<tr><td>Theory Y (McGregor)</td><td>Employees want to work; seek responsibility; can offer creative solutions</td></tr>
<tr><td>Kolb's Learning Cycle</td><td>Experience → Reflect → Theorize → Apply (continuous cycle)</td></tr>
</tbody></table>
<div class="exam-tip">Know Blake-Mouton grid positions (9,9 = Team Management is ideal), McGregor Theory X/Y, Kolb's learning cycle, Senge's 5 disciplines.</div>

<h2>Blake-Mouton Managerial Grid</h2>
<p>Two axes: Concern for Production (1-9) vs. Concern for People (1-9)</p>
<ul>
<li><strong>(1,1) Impoverished:</strong> Low concern for both</li>
<li><strong>(9,1) Task/Authority:</strong> High production, low people</li>
<li><strong>(1,9) Country Club:</strong> High people, low production</li>
<li><strong>(5,5) Middle of Road:</strong> Moderate both</li>
<li><strong>(9,9) Team Management:</strong> High both — IDEAL</li>
</ul>

<h2>Senge's 5 Disciplines</h2>
<p>Personal mastery, Mental models, Shared vision, Team learning, <strong>Systems thinking</strong> (the 5th discipline that integrates all others)</p>

<h2>DiSC Profile</h2>
<p>D=Dominance, I=Influence, S=Steadiness, C=Conscientiousness</p>

<h2>A-B-C Analysis (Behavior Management)</h2>
<div class="formula">A (Antecedent) → B (Behavior) → C (Consequence)</div>
<p>Used to understand what triggers a behavior and what perpetuates it.</p>

<h2>Financial Management</h2>
<h3>Three Basic Financial Statements</h3>
<ul>
<li><strong>Balance Sheet:</strong> Assets = Liabilities + Shareholders' Equity (point in time)</li>
<li><strong>Income Statement:</strong> Revenue - Expenses = Net Income (period)</li>
<li><strong>Cash Flow Statement:</strong> Cash inflows and outflows</li>
</ul>
<h3>Key Ratios</h3>
<div class="formula">Current Ratio = Current Assets ÷ Current Liabilities  (should be ≥ 2.0)</div>
<div class="formula">ROI = Net Dollar Benefit ÷ Investment</div>
<div class="formula">Inventory Turnover = COGS ÷ Average Inventory  (higher = better)</div>
<div class="formula">Gross Profit Margin = Gross Profit ÷ Net Sales</div>

<h2>Risk Management (ISO 31000)</h2>
<p>Risk = "effect of uncertainty on objectives." Two lenses:</p>
<ul>
<li><strong>Impact/Severity:</strong> How bad if it happened?</li>
<li><strong>Likelihood/Probability:</strong> How likely is it?</li>
</ul>
<p><strong>Risk Assessment Techniques:</strong> FMEA, HACCP, SWIFT, Bow Tie Analysis, HRA (Human Reliability Assessment), Cause-and-Effect diagrams</p>

<h2>Knowledge Management</h2>
<div class="formula">Data → Information → Knowledge → Wisdom</div>
<ul>
<li><strong>Tacit knowledge:</strong> Unrecorded; beliefs, intuition, know-how. Lost when employee leaves.</li>
<li><strong>Explicit knowledge:</strong> Codified in procedures, standards, documents</li>
</ul>

<h2>HR Management</h2>
<p><strong>Interview types:</strong> Panel, Peer, Hierarchical, One-on-one, Group</p>
<p><strong>KESAA factors (competency analysis):</strong> Knowledge, Experience, Skills, Aptitude, Attitude</p>

<h2>ISO 9001 Seven Quality Management Principles</h2>
<p>Customer focus, Leadership, Engagement of people, Process approach, Improvement, Evidence-based decision-making, Relationship management</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>POSDC</td><td>Planning, Organizing, Staffing, Directing, Controlling</td></tr>
<tr><td>Hawthorne Effect</td><td>Productivity changes due to attention, not physical conditions</td></tr>
<tr><td>Theory X / Y</td><td>McGregor's negative (X) vs. positive (Y) views of employee motivation</td></tr>
<tr><td>Suboptimization</td><td>Optimizing one part of a system at the expense of the whole</td></tr>
<tr><td>Concurrent Engineering</td><td>All functions working simultaneously on product development</td></tr>
<tr><td>Tacit Knowledge</td><td>Unrecorded know-how; lost when employee leaves</td></tr>
<tr><td>Explicit Knowledge</td><td>Codified knowledge in procedures and documents</td></tr>
<tr><td>Poka-Yoke</td><td>Error-proofing; required by ISO 9001:2015 clause 8.5.1g</td></tr>
<tr><td>HACCP</td><td>Hazard Analysis & Critical Control Points</td></tr>
<tr><td>SWIFT</td><td>Structured What-If Technique — brainstorming-based risk assessment</td></tr>
<tr><td>HFE</td><td>Human Factors Engineering — designing systems for the user</td></tr>
<tr><td>Current Ratio</td><td>Current assets ÷ Current liabilities; should be ≥ 2.0</td></tr>
<tr><td>ROI</td><td>Net dollar benefit ÷ Investment</td></tr>
<tr><td>SOX</td><td>Sarbanes-Oxley Act (2002) — financial accountability after corporate scandals</td></tr>
</tbody></table>
`},

9: { icon:'📡', title:'Communication Skills and Abilities', bok:'III.B', part:'III',
content:`
<h2>Communication Model</h2>
<div class="formula">Sender → Filters → The Message → Filters → Receiver</div>
<p>Filters include cultural beliefs, previous communications, confidence, perceived meaning. Feedback loop clarifies/confirms understanding.</p>

<h2>Three Directions of Communication</h2>
<ul>
<li><strong>Vertical (Top-Down):</strong> Management to subordinates — goals, policy, direction</li>
<li><strong>Vertical (Bottom-Up):</strong> Subordinates to management — feedback, status, complaints</li>
<li><strong>Horizontal/Lateral:</strong> Across departments at similar levels — coordination, info sharing</li>
</ul>
<div class="exam-tip">Know all 3 directions of communication with examples. "Telephone game effect" = message distortion through multiple retransmissions (bottom-up vertical).</div>

<h2>Formal vs. Informal Communication</h2>
<ul>
<li><strong>Formal:</strong> Mandated by SOPs — letters, reports, procedures, performance appraisals</li>
<li><strong>Informal:</strong> Not mandated — hallway conversations, gossip, text messages, rumors</li>
</ul>

<h2>Active Listening Techniques</h2>
<ul>
<li>Paraphrasing (restating in your own words)</li>
<li>Asking relevant and meaningful questions</li>
<li>Clarifying objectives ("Can you tell me more about that?")</li>
<li>Taking mental note of what you're learning</li>
<li><strong>Open-ended questions:</strong> Cannot be answered with simple yes/no</li>
</ul>

<h2>Feedback Types</h2>
<ul>
<li><strong>Informative:</strong> Passing information from one person/group to another</li>
<li><strong>Corrective (Constructive):</strong> Intended to cause behavioral change or action</li>
</ul>

<h2>Interpersonal Skills</h2>
<p>Empathy, tactfulness, open-mindedness, sensitivity, trustworthiness, ethics, authenticity, fairness, friendliness.</p>

<h2>Global Communication Obstacles</h2>
<ul>
<li>Cultural differences (customs, politics, religion)</li>
<li>Language differences (multiple languages and dialects)</li>
<li>Time zone differentials</li>
<li>Incompatible organizational structures</li>
<li>Incompatible electronic data interfaces</li>
</ul>
<p><strong>Remedies:</strong> Set learning about cultural differences early; cross-train key personnel; provide business language glossaries; establish communication protocols for offshore locations.</p>

<h2>7 Steps to Manage E-mail</h2>
<ol>
<li>Automate tasks</li>
<li>Preview messages</li>
<li>Discipline yourself</li>
<li>Do not duplicate</li>
<li>Stay safe</li>
<li>Block junk; establish e-communication policy</li>
<li>Teach employees filtering tools</li>
</ol>

<h2>Information System Levels</h2>
<p>Operations → Day-to-day decisions → Strategic analysis</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Noise</td><td>Any disturbance blocking or distorting communication</td></tr>
<tr><td>Active Listening</td><td>Paraphrasing, clarifying, asking meaningful questions</td></tr>
<tr><td>Informative Feedback</td><td>Passing information from one person to another</td></tr>
<tr><td>Corrective Feedback</td><td>Intended to cause behavioral change</td></tr>
<tr><td>Open-Ended Questions</td><td>Cannot be answered with yes/no; elicit detailed responses</td></tr>
</tbody></table>
`},

10: { icon:'📊', title:'Project Management', bok:'III.C', part:'III',
content:`
<h2>5 Project Life Cycle Stages</h2>
<ol>
<li><strong>Initiating</strong> — Define purpose, objectives, scope, stakeholders</li>
<li><strong>Planning</strong> — Activities, who, when, schedule, budget</li>
<li><strong>Executing</strong> — Implement the plan</li>
<li><strong>Monitoring and Controlling</strong> — Track progress; compare actual vs. plan; corrective action</li>
<li><strong>Evaluating and Closing</strong> — Lessons learned, post-project audit</li>
</ol>

<h2>Project Management Methodologies</h2>
<table class="kt-table"><thead><tr><th>Methodology</th><th>Characteristics</th><th>Best For</th></tr></thead><tbody>
<tr><td>Waterfall (Linear)</td><td>Sequential phases; requirements defined upfront</td><td>Well-defined requirements; stable scope</td></tr>
<tr><td>Evolutionary/Incremental</td><td>Successive deliveries; flexible requirements</td><td>Unclear requirements; flexibility needed</td></tr>
<tr><td>Agile/Iterative</td><td>Customer collaboration; respond to change; working deliverables</td><td>Complex, changing requirements</td></tr>
</tbody></table>

<h2>Agile Manifesto (4 Principles)</h2>
<ul>
<li><strong>Customer collaboration</strong> over contract negotiation</li>
<li><strong>Responding to change</strong> over following a plan</li>
<li><strong>Working software</strong> (deliverables) over comprehensive documentation</li>
<li><strong>Individuals and interactions</strong> over processes and tools</li>
</ul>

<h2>Scrum Key Elements</h2>
<ul>
<li><strong>Product Backlog:</strong> Prioritized wish list of features</li>
<li><strong>Sprint:</strong> 1-4 week iteration cycle</li>
<li><strong>Daily Scrum:</strong> Daily stand-up to assess progress</li>
<li><strong>Burndown Chart:</strong> Remaining work vs. time</li>
<li><strong>Scrum Master:</strong> Removes barriers; leads Scrum team</li>
</ul>

<h2>15-Step Project Planning Sequence</h2>
<p>Project justification → Scope/objectives → Stakeholder requirements → Team formation → Milestone statements → Deliverables → WBS → Gantt → CPM/PERT → RRM → LRM → Budget → Measurements → Completed project plan</p>

<h2>Project Planning Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Purpose</th><th>Key Notes</th></tr></thead><tbody>
<tr><td>WBS</td><td>Hierarchical breakdown of all project work</td><td>Foundation for cost/schedule estimates</td></tr>
<tr><td>Gantt Chart</td><td>Time-phased bar chart of tasks</td><td>Easy to read; does NOT show dependencies</td></tr>
<tr><td>CPM</td><td>Critical path = longest path through network</td><td>No slack on critical path; delays the whole project</td></tr>
<tr><td>PERT</td><td>3 time estimates per activity</td><td>(Optimistic + 4×Most Likely + Pessimistic) / 6</td></tr>
<tr><td>RRM</td><td>Resource requirements matrix</td><td>What/when/how many resources needed</td></tr>
<tr><td>LRM</td><td>Linear responsibility matrix</td><td>Who is responsible for what</td></tr>
</tbody></table>

<h2>Financial Analysis for Project Selection</h2>
<table class="kt-table"><thead><tr><th>Method</th><th>Key Points</th></tr></thead><tbody>
<tr><td>Payback Period</td><td>Years to recover investment. Simple but does NOT consider time value of money.</td></tr>
<tr><td>NPV</td><td>Positive = accept project. Considers time value of money. Higher = better.</td></tr>
<tr><td>IRR</td><td>Discount rate where NPV = 0. If IRR > required rate → accept. Higher = better.</td></tr>
<tr><td>ROI</td><td>Net dollar benefit ÷ Investment</td></tr>
<tr><td>ROA</td><td>Return on assets — used with substantial capital investment</td></tr>
</tbody></table>

<h2>Earned Value Analysis (EVA)</h2>
<div class="formula">CPI = EV / AC  (Cost Performance Index — >1.0 = under budget)</div>
<div class="formula">SPI = EV / PV  (Schedule Performance Index — >1.0 = ahead of schedule)</div>
<div class="exam-tip">Post-project audit is one of the most commonly OMITTED steps in the project lifecycle. Know all 5 project life cycle stages and the difference between waterfall/agile.</div>

<h2>Project Charter Key Elements</h2>
<p>Problem statement, goals (SMART), scope (in/out), sponsor, team members, methodology, timeline with milestones, risk assessment criteria, recognition/rewards plan.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Critical Path</td><td>Longest path through network = minimum project duration; zero float</td></tr>
<tr><td>Burndown Chart</td><td>Remaining work vs. time; tracks sprint progress</td></tr>
<tr><td>EVA</td><td>Earned Value Analysis — planned vs. actual value of work</td></tr>
<tr><td>NPV</td><td>Net Present Value; positive = accept project</td></tr>
<tr><td>IRR</td><td>Internal Rate of Return; discount rate where NPV = 0</td></tr>
<tr><td>Stage/Gate Review</td><td>Go/no-go decision points between project phases</td></tr>
<tr><td>Post-Project Audit</td><td>Compares actual results to predicted; most commonly omitted step</td></tr>
</tbody></table>
`},

11: { icon:'✅', title:'Quality System', bok:'III.D', part:'III',
content:`
<h2>Definitions of Quality</h2>
<ul>
<li>Fitness for use (Juran)</li>
<li>Conformance to requirements (Crosby)</li>
<li>Meeting customer expectations</li>
<li>Zero defects</li>
<li>Exceeding customer expectations / Delighting the customer</li>
</ul>

<h2>Little q vs. Big Q</h2>
<ul>
<li><strong>Little q:</strong> Quality focused on QC/inspection activities (quality department focus)</li>
<li><strong>Big Q:</strong> Quality across the ENTIRE organization — the preferred approach</li>
</ul>

<h2>Quality Planning 10-Step Process</h2>
<ol>
<li>Identify customers</li>
<li>Determine customer needs</li>
<li>Discuss with customers whether the need exists</li>
<li>If need exists, agree on standards and measures</li>
<li>Quantify gap between current and required</li>
<li>Define improvement actions</li>
<li>Make improvement and track results</li>
<li>Evaluate results; review lessons learned</li>
<li>Maintain the gains</li>
<li>Do it again</li>
</ol>

<h2>Types of Audits</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Who Conducts</th><th>Example</th></tr></thead><tbody>
<tr><td>First-Party (Internal)</td><td>Organization's own auditors</td><td>ISO 9001 internal audit</td></tr>
<tr><td>Second-Party</td><td>Customer auditing supplier</td><td>Supplier qualification audit</td></tr>
<tr><td>Third-Party</td><td>Independent registrar</td><td>ISO 9001 certification audit</td></tr>
</tbody></table>

<h2>Audit Scope Types</h2>
<ul>
<li><strong>System Audit:</strong> Verifies overall QMS appropriateness and implementation</li>
<li><strong>Process Audit:</strong> Examines a single process or activity</li>
<li><strong>Product Audit:</strong> In-depth examination of a specific product</li>
</ul>

<h2>3-Stage Audit Process</h2>
<ol>
<li><strong>Preparation:</strong> Define scope; select team; develop checklists; schedule</li>
<li><strong>Performance:</strong> Opening meeting; collect data; verify documentation; closing meeting</li>
<li><strong>Reporting/Follow-up:</strong> Formal report; request corrective action; close out when verified</li>
</ol>

<h2>Balanced Scorecard (BSC) for Quality</h2>
<p>4 perspectives: Customers, Employees, Stakeholders/Financial, Process</p>
<ul>
<li><strong>Leading indicators:</strong> Easier to collect; predictive of future performance</li>
<li><strong>Lagging indicators:</strong> Report past performance</li>
</ul>

<h2>ISO 9001 Management Review Requirements</h2>
<p>Conducted at defined intervals (bimonthly/quarterly/annually). Inputs include: customer satisfaction, process performance, audit results, status of corrective actions, risks and opportunities.</p>

<h2>Gemba Walk</h2>
<p>Senior management walk-through of operations. Informal but observations taken seriously by responsible managers.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Fitness for Use</td><td>Quality is what a product/service does and is supposed to do</td></tr>
<tr><td>Little q</td><td>Quality focused on QC/inspection (department-level)</td></tr>
<tr><td>Big Q</td><td>Quality across the entire organization</td></tr>
<tr><td>First-Party Audit</td><td>Internal audit by the organization's own auditors</td></tr>
<tr><td>Second-Party Audit</td><td>Customer auditing a supplier</td></tr>
<tr><td>Third-Party Audit</td><td>Independent registrar (e.g., for ISO 9001 certification)</td></tr>
<tr><td>Gemba Walk</td><td>Senior management walk-through of production/operations</td></tr>
<tr><td>Leading Indicator</td><td>Metric that predicts future performance</td></tr>
<tr><td>Lagging Indicator</td><td>Metric that reports past performance</td></tr>
<tr><td>DFSS</td><td>Design for Six Sigma — doing the right things right the first time</td></tr>
<tr><td>ROQI</td><td>Return on Quality Investment</td></tr>
</tbody></table>
`},

12: { icon:'🏆', title:'Quality Models and Theories', bok:'III.E', part:'III',
content:`
<h2>ISO 9001:2015 Ten Sections (4-10 = Requirements)</h2>
<table class="kt-table"><thead><tr><th>Section</th><th>Focus</th></tr></thead><tbody>
<tr><td>4 — Context</td><td>Org context; interested parties; scope; risk-based thinking</td></tr>
<tr><td>5 — Leadership</td><td>Top management commitment; quality policy; customer focus</td></tr>
<tr><td>6 — Planning</td><td>Risks/opportunities; SMART quality objectives; change planning</td></tr>
<tr><td>7 — Support</td><td>Resources; competence; awareness; communication; documented info</td></tr>
<tr><td>8 — Operations</td><td>Operational planning; customer requirements; design controls; supplier controls</td></tr>
<tr><td>9 — Performance Evaluation</td><td>Customer satisfaction monitoring; internal audits; management review</td></tr>
<tr><td>10 — Improvement</td><td>Nonconformity; corrective action; continual improvement</td></tr>
</tbody></table>

<h2>Baldrige 7 Categories (MBNQA)</h2>
<table class="kt-table"><thead><tr><th>Category</th><th>Points</th></tr></thead><tbody>
<tr><td>1. Leadership</td><td>120</td></tr>
<tr><td>2. Strategy</td><td>85</td></tr>
<tr><td>3. Customers</td><td>85</td></tr>
<tr><td>4. Measurement, Analysis & Knowledge Management</td><td>90</td></tr>
<tr><td>5. Workforce</td><td>85</td></tr>
<tr><td>6. Operations</td><td>85</td></tr>
<tr><td>7. Results</td><td>450 (45% — HIGHEST)</td></tr>
</tbody></table>
<div class="exam-tip">Results category = 450 points = 45% of total. The Baldrige criteria are nonprescriptive — orgs choose their own approach to meet criteria.</div>

<h2>Quality Gurus — Essential Reference</h2>
<table class="kt-table"><thead><tr><th>Guru</th><th>Key Contributions</th></tr></thead><tbody>
<tr><td>Shewhart</td><td>Father of SPC; invented control charts; PDCA (Shewhart Cycle); common vs. assignable cause variation</td></tr>
<tr><td>Deming</td><td>14 Points for transformation; 7 Deadly Diseases; System of Profound Knowledge; PDSA cycle; drove SPC in Japan</td></tr>
<tr><td>Juran</td><td>Quality Trilogy (Planning/Control/Improvement); Pareto principle; universal sequence (diagnostic + remedial journeys)</td></tr>
<tr><td>Crosby</td><td>Zero defects; "Quality is Free"; 5 Absolutes; 14 Steps; quality = conformance to requirements; cost of quality</td></tr>
<tr><td>Feigenbaum</td><td>Total Quality Control; quality as strategic business tool; org-wide commitment; "hidden plant" concept</td></tr>
<tr><td>Ishikawa</td><td>Cause-and-effect (fishbone) diagram; quality circles; 4 audit types; company-wide quality control</td></tr>
<tr><td>Taguchi</td><td>Loss function L(y) = k(y-m)²; robust design via DOE; parameter/tolerance design</td></tr>
</tbody></table>

<h2>Deming's 14 Points (Top Key Items)</h2>
<p>Create constancy of purpose → Cease dependence on inspection → End price-alone purchasing → Improve constantly → Institute training → Adopt leadership → Drive out fear → Break down barriers → Eliminate quotas → Remove barriers to pride of workmanship</p>

<h2>Deming's 7 Deadly Diseases</h2>
<ol>
<li>Lack of constancy of purpose</li>
<li>Emphasis on short-term profits</li>
<li>Evaluation by performance/merit rating/annual review</li>
<li>Mobility of management</li>
<li>Running a company on visible figures alone</li>
<li>Excessive medical costs</li>
<li>Excessive costs of warranty</li>
</ol>

<h2>Crosby's 5 Absolutes of Quality</h2>
<ol>
<li>Quality = <strong>conformance to requirements</strong>, not elegance</li>
<li>The quality system is <strong>prevention</strong>, not appraisal</li>
<li>The performance standard is <strong>zero defects</strong></li>
<li>The measurement of quality is the <strong>cost of quality</strong></li>
<li>There is no such thing as a quality problem</li>
</ol>

<h2>TQM 8 Primary Elements</h2>
<p>Customer focus, Total employee involvement, Process centered, Integrated system, Strategic/systematic approach, Continual improvement, Fact-based decisions, Communications</p>

<h2>4 Types of Benchmarking</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th></tr></thead><tbody>
<tr><td>Internal</td><td>Comparing same process across functions/locations within the org</td></tr>
<tr><td>Competitive</td><td>Comparing directly with competitors</td></tr>
<tr><td>Functional</td><td>Comparing with non-competing orgs in different industries</td></tr>
<tr><td>Generic</td><td>Comparing best practices regardless of industry</td></tr>
</tbody></table>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>ISO 9001:2015</td><td>QMS Requirements standard; 10 sections; certifiable</td></tr>
<tr><td>MBNQA</td><td>Malcolm Baldrige National Quality Award; 7 categories; Results = 450 pts</td></tr>
<tr><td>Nonprescriptive</td><td>Baldrige criteria do not dictate HOW; org chooses approach</td></tr>
<tr><td>TQM</td><td>Total Quality Management; customer focus; total involvement; process-centered</td></tr>
<tr><td>Kaizen</td><td>Japanese for nonstop incremental continuous improvement</td></tr>
<tr><td>Kaizen Blitz</td><td>5-day intensive improvement event</td></tr>
<tr><td>Loss Function</td><td>Taguchi: L(y) = k(y-m)² — any deviation from target causes loss</td></tr>
</tbody></table>
`},

13: { icon:'🛠️', title:'Problem-Solving Tools', bok:'IV.A', part:'IV',
content:`
<h2>7 Classic Quality Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Purpose</th><th>Key Notes</th></tr></thead><tbody>
<tr><td>1. Flowchart</td><td>Map sequence of steps and decisions</td><td>Starting point for process improvement</td></tr>
<tr><td>2. Check Sheet</td><td>Gather data on frequency of occurrence</td><td>Facts over opinions; tally format</td></tr>
<tr><td>3. Cause-and-Effect Diagram</td><td>Organize potential causes of a problem</td><td>Fishbone/Ishikawa; 4Ms or 4Ps</td></tr>
<tr><td>4. Pareto Chart</td><td>Identify vital few causes (80/20)</td><td>Bar chart ranked high to low + cumulative line</td></tr>
<tr><td>5. Control Chart</td><td>Monitor process stability over time</td><td>Shows special vs. common cause variation</td></tr>
<tr><td>6. Histogram</td><td>Show frequency distribution of data</td><td>Reveals distribution shape and spread</td></tr>
<tr><td>7. Scatter Diagram</td><td>Show relationship between two variables</td><td>r = correlation coefficient (±1 = strong, 0 = none)</td></tr>
</tbody></table>
<p><strong>4Ms (manufacturing C-E):</strong> Manpower, Machinery, Methods, Materials<br>
<strong>4Ps (service C-E):</strong> People, Policies, Procedures, Plant</p>

<h2>7 Management and Planning Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Purpose</th></tr></thead><tbody>
<tr><td>1. Activity Network Diagram</td><td>Schedule/track project activities; shows critical path</td></tr>
<tr><td>2. Affinity Diagram</td><td>Organize large group of brainstormed ideas into categories</td></tr>
<tr><td>3. Interrelationship Digraph</td><td>Show cause-and-effect among complex issues; count arrows in vs. out</td></tr>
<tr><td>4. Matrix Diagram</td><td>Show relationships between groups of items; strength of correlation</td></tr>
<tr><td>5. Prioritization Matrix</td><td>Weight and rank alternatives against multiple criteria</td></tr>
<tr><td>6. PDPC</td><td>Anticipate problems and plan countermeasures</td></tr>
<tr><td>7. Tree Diagram</td><td>Break broad goals into increasingly detailed tasks (like WBS)</td></tr>
</tbody></table>

<h2>7-Step Problem-Solving Model</h2>
<ol>
<li><strong>Identify</strong> the problem and the process</li>
<li><strong>List</strong> possible root causes</li>
<li><strong>Search out</strong> the most likely root cause (data collection)</li>
<li><strong>Identify</strong> potential solutions</li>
<li><strong>Select and implement</strong> a solution</li>
<li><strong>Follow up</strong> to evaluate the effect</li>
<li><strong>Standardize</strong> the process (poka-yoke, procedures, training)</li>
</ol>

<h2>PDCA / PDSA Cycle</h2>
<div class="formula">Plan → Do → Check/Study → Act (then repeat)</div>
<p>Developed by Shewhart; associated with Deming. Plan-Do-Study-Act (PDSA) preferred term.</p>

<h2>DMAIC (Six Sigma)</h2>
<table class="kt-table"><thead><tr><th>Phase</th><th>Key Activities</th><th>Key Tools</th></tr></thead><tbody>
<tr><td>Define</td><td>Project charter; VOC; identify CTS</td><td>SIPOC, Process map, Stakeholder analysis</td></tr>
<tr><td>Measure</td><td>Define current process; measurement system baseline</td><td>Process map, MSA, FMEA, data collection plan</td></tr>
<tr><td>Analyze</td><td>Validate root causes; cause-and-effect</td><td>C-E diagrams, 5 Whys, ANOVA, Pareto</td></tr>
<tr><td>Improve</td><td>Design future state; implement recommendations</td><td>QFD, DOE, FMEA, poka-yoke, cost-benefit</td></tr>
<tr><td>Control</td><td>Establish performance targets; sustain improvements</td><td>SPC charts, control plans, procedures</td></tr>
</tbody></table>

<h2>Six Sigma Levels</h2>
<table class="kt-table"><thead><tr><th>Sigma Level</th><th>DPMO</th></tr></thead><tbody>
<tr><td>6σ</td><td>3.4</td></tr>
<tr><td>5σ</td><td>230</td></tr>
<tr><td>4σ</td><td>6,210</td></tr>
<tr><td>3σ</td><td>66,800</td></tr>
<tr><td>2σ</td><td>308,000</td></tr>
</tbody></table>

<h2>FMEA Process</h2>
<div class="formula">RPN = Severity (1-10) × Occurrence (1-10) × Detection (1-10)  [max 1000]</div>
<p>Higher RPN = higher priority for action. Two types: DFMEA (design) and PFMEA (process).</p>

<h2>Kepner-Tregoe (4 Steps)</h2>
<ol>
<li>Problem analysis — describe; identify; confirm causes</li>
<li>Decision analysis — clarify purpose; identify alternatives; risk analysis; decide</li>
<li>Situation appraisal — identify concerns; prioritize</li>
<li>Potential problem analysis — identify future problems; prevent/mitigate</li>
</ol>

<h2>Cost of Quality (COQ)</h2>
<div class="formula">Total COQ = Prevention + Appraisal + Internal Failure + External Failure</div>
<table class="kt-table"><thead><tr><th>Category</th><th>Examples</th></tr></thead><tbody>
<tr><td>Prevention</td><td>Training, planning, design reviews, process capability evaluations</td></tr>
<tr><td>Appraisal</td><td>Incoming/in-process/final inspection, calibration, testing</td></tr>
<tr><td>Internal Failure</td><td>Scrap, rework, reinspection, reprocessing (before delivery)</td></tr>
<tr><td>External Failure</td><td>Warranty, returns, complaints, product liability lawsuits (after delivery)</td></tr>
</tbody></table>
<div class="exam-tip">Goal: INCREASE prevention costs to DECREASE total COQ. Internal failure: before delivery. External failure: after delivery.</div>

<h2>Creativity Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Description</th></tr></thead><tbody>
<tr><td>SCAMPER</td><td>Substitute, Combine, Adapt, Modify, Put to use, Eliminate, Reverse</td></tr>
<tr><td>Six Thinking Hats (de Bono)</td><td>White=facts, Red=emotions, Black=negative, Yellow=positive, Green=creative, Blue=process</td></tr>
<tr><td>TRIZ</td><td>Theory of inventive problem-solving; 40 inventive principles; resolves contradictions</td></tr>
<tr><td>Five Whys</td><td>Repeatedly ask "Why?" (typically 5 times) to find root cause</td></tr>
<tr><td>NGT</td><td>Nominal Group Technique; structured voting to narrow ideas</td></tr>
<tr><td>Mind Mapping</td><td>Central topic with radiating branches for related ideas</td></tr>
</tbody></table>
`},

14: { icon:'⚙️', title:'Process Management', bok:'IV.B', part:'IV',
content:`
<h2>SIPOC Model</h2>
<div class="formula">Suppliers → Inputs → Process → Outputs → Customers</div>
<p>Fundamental tool for understanding how a process functions. Starting point for process improvement.</p>

<h2>The 7 Wastes (TIMWOOD)</h2>
<table class="kt-table"><thead><tr><th>Waste</th><th>Description</th><th>Example</th></tr></thead><tbody>
<tr><td>Transportation</td><td>Unnecessary movement of materials</td><td>Moving parts between distant workstations</td></tr>
<tr><td>Inventory</td><td>Excess raw materials, WIP, finished goods</td><td>Buffer stock from batch production</td></tr>
<tr><td>Motion</td><td>Unnecessary operator movements</td><td>Reaching, searching, bending for tools</td></tr>
<tr><td>Waiting</td><td>Idle time waiting for materials, info, decisions</td><td>Operator waiting for machine to cycle</td></tr>
<tr><td>Overproduction</td><td>Producing more than customer needs</td><td>Large batch runs "just in case"</td></tr>
<tr><td>Overprocessing</td><td>More effort than customer requires</td><td>Fine tolerances on non-critical features</td></tr>
<tr><td>Defects</td><td>Rework, scrap, rejects</td><td>Failed welds requiring rework</td></tr>
</tbody></table>
<p><em>DOWNTIME also includes: Non-utilized talent (8th waste in some frameworks)</em></p>

<h2>5S Methodology</h2>
<table class="kt-table"><thead><tr><th>Step</th><th>Japanese</th><th>Action</th></tr></thead><tbody>
<tr><td>Sort</td><td>Seiri</td><td>Separate needed from unneeded items; red-tag unneeded</td></tr>
<tr><td>Set in Order</td><td>Seiton</td><td>Organize and identify items for ease of use; visual management</td></tr>
<tr><td>Shine</td><td>Seiso</td><td>Cleanup campaign; perfect condition</td></tr>
<tr><td>Standardize</td><td>Seiketsu</td><td>Maintain first 3 S's through standard procedures</td></tr>
<tr><td>Sustain</td><td>Shitsuke</td><td>Form the habit; periodic audit; train/cross-train</td></tr>
</tbody></table>

<h2>Value Stream Mapping (VSM)</h2>
<p>Charts ALL activities (processing, materials, ordering) from raw material to customer delivery. Identifies value-added and non-value-added activities.</p>
<div class="formula">Takt Time = Available Work Time ÷ Customer Demand</div>
<p><strong>3 types:</strong> Material flow VSM, Transactional VSM (TVSM), Enterprise VSM (EVSM)</p>

<h2>Key Lean Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Description</th></tr></thead><tbody>
<tr><td>JIT</td><td>Material delivered exactly when needed; pull-based; minimizes inventory</td></tr>
<tr><td>Kanban</td><td>Visual pull signal system; minimum qty = (demand during lead time + safety stock) ÷ container qty</td></tr>
<tr><td>SMED</td><td>Single-Minute Exchange of Die; reduce setup; convert internal to external steps</td></tr>
<tr><td>Poka-Yoke</td><td>Error-proofing; Control approach (removes human element) vs. Warning approach (alarm)</td></tr>
<tr><td>Kaizen Blitz</td><td>5-day rapid improvement: Mon=train, Tue=current state map, Wed=future state, Thu=data, Fri=implement</td></tr>
</tbody></table>

<h2>OEE Formula</h2>
<div class="formula">OEE = Availability × Performance × Quality</div>
<p><strong>World-class OEE ≥ 85%</strong></p>
<ul>
<li>Availability = Actual run time ÷ Planned run time</li>
<li>Performance = Actual output ÷ Maximum possible output</li>
<li>Quality = Good pieces ÷ Total pieces</li>
</ul>

<h2>Theory of Constraints (TOC)</h2>
<p>Eliyahu Goldratt's framework: System strength = weakest link (constraint)</p>
<h3>5 Focusing Steps</h3>
<ol>
<li><strong>Identify</strong> the weakest link (constraint)</li>
<li><strong>Exploit</strong> — squeeze more from constraint without major changes</li>
<li><strong>Subordinate</strong> — make everything else support the constraint</li>
<li><strong>Elevate</strong> — if still constrained, make major changes to eliminate it</li>
<li><strong>Repeat</strong> — find the next constraint; don't let inertia become new constraint</li>
</ol>
<div class="formula">Throughput (T) = Rate system generates money through sales</div>
<div class="formula">Profit = T - Operating Expense (OE)</div>
<div class="formula">ROI = (T - OE) ÷ Inventory (I)</div>

<h2>Documentation Hierarchy</h2>
<ol>
<li>Quality Manual (What? Why?)</li>
<li>Procedures (Who? What? When?)</li>
<li>Work Instructions (How?)</li>
<li>Records (Objective evidence)</li>
</ol>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Muda</td><td>Japanese for waste — anything not adding value</td></tr>
<tr><td>Takt Time</td><td>Available work time ÷ Customer demand</td></tr>
<tr><td>Little's Law</td><td>WIP = Throughput × Lead Time</td></tr>
<tr><td>OEE</td><td>Availability × Performance × Quality (world-class ≥ 85%)</td></tr>
<tr><td>SMED</td><td>Single-Minute Exchange of Die — rapid changeover</td></tr>
<tr><td>Poka-Yoke</td><td>Mistake-proofing</td></tr>
<tr><td>Kaizen</td><td>Continuous incremental improvement</td></tr>
<tr><td>Constraint</td><td>Weakest link limiting system throughput</td></tr>
<tr><td>Physical Constraint</td><td>Equipment, materials, workforce — easier to identify and fix</td></tr>
<tr><td>Policy Constraint</td><td>Rules, procedures, decisions — harder to change but higher impact</td></tr>
</tbody></table>
`},

15: { icon:'📏', title:'Measurement, Assessment and Metrics', bok:'IV.C', part:'IV',
content:`
<h2>Statistics Fundamentals</h2>
<table class="kt-table"><thead><tr><th>Measure</th><th>Formula / Description</th></tr></thead><tbody>
<tr><td>Mean (X̄)</td><td>Sum of values ÷ Number of observations</td></tr>
<tr><td>Median</td><td>Middle value when ordered; average of two middle for even count</td></tr>
<tr><td>Mode</td><td>Most frequently occurring value</td></tr>
<tr><td>Range (R)</td><td>Largest − Smallest value</td></tr>
<tr><td>Standard Deviation (s)</td><td>s = √[Σ(X − X̄)² ÷ (n−1)]</td></tr>
<tr><td>Variance</td><td>Standard deviation squared (s²)</td></tr>
</tbody></table>

<h2>Common Distributions</h2>
<table class="kt-table"><thead><tr><th>Distribution</th><th>Use Case</th></tr></thead><tbody>
<tr><td>Normal</td><td>Symmetric, bell-shaped; most common quality data; ±3σ = 99.7% of data</td></tr>
<tr><td>Binomial</td><td>Probability of p successes in n trials (pass/fail data)</td></tr>
<tr><td>Poisson</td><td>Count of events in interval; probability of occurrence is low (&lt;0.10)</td></tr>
<tr><td>Exponential</td><td>Time between events; reliability/failure rate data</td></tr>
<tr><td>Weibull</td><td>Flexible — can model infant mortality, random failures, wear-out</td></tr>
</tbody></table>

<h2>Control Charts</h2>
<table class="kt-table"><thead><tr><th>Chart Type</th><th>Data Type</th><th>When to Use</th></tr></thead><tbody>
<tr><td>X̄-R Chart</td><td>Variables (continuous)</td><td>Sample size n ≤ 10</td></tr>
<tr><td>X̄-s Chart</td><td>Variables (continuous)</td><td>Sample size n > 10</td></tr>
<tr><td>p-chart</td><td>Attributes</td><td>Fraction defective; variable sample size</td></tr>
<tr><td>np-chart</td><td>Attributes</td><td>Number defective; constant sample size</td></tr>
<tr><td>c-chart</td><td>Attributes</td><td>Count of defects; constant sample size</td></tr>
<tr><td>u-chart</td><td>Attributes</td><td>Count of defects per unit; variable sample size</td></tr>
</tbody></table>

<h2>Sampling</h2>
<ul>
<li><strong>Random sampling:</strong> Every item has equal probability of selection</li>
<li><strong>Stratified sampling:</strong> Every nth item selected</li>
<li><strong>Cluster sampling:</strong> Random subgroup selected; all items in subgroup examined</li>
</ul>
<table class="kt-table"><thead><tr><th>Risk</th><th>Also Known As</th><th>Description</th></tr></thead><tbody>
<tr><td>Alpha (α)</td><td>Producer's risk / Type I Error</td><td>Probability of REJECTING GOOD product</td></tr>
<tr><td>Beta (β)</td><td>Consumer's risk / Type II Error</td><td>Probability of ACCEPTING BAD product</td></tr>
</tbody></table>
<div class="exam-tip">Alpha = reject good (Type I). Beta = accept bad (Type II). AQL = worst tolerable process average.</div>

<h2>Measurement Systems Analysis (MSA)</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Accuracy</td><td>How close measured value is to true value (validity)</td></tr>
<tr><td>Precision</td><td>How repeatable the measurement is (reliability)</td></tr>
<tr><td>Repeatability</td><td>Same operator, same gage — variation in gage itself</td></tr>
<tr><td>Reproducibility</td><td>Different operators, same gage — variation between operators</td></tr>
<tr><td>Bias</td><td>Systematic difference from true value</td></tr>
<tr><td>Linearity</td><td>Consistency of bias across measurement range</td></tr>
</tbody></table>
<p><strong>Target analogy:</strong> Reliable but not valid = tight grouping off-center. Valid but not reliable = centered but scattered. Reliable AND valid = tight grouping, on-center.</p>

<h2>Process Capability Indices</h2>
<div class="formula">Cp = (USL − LSL) ÷ 6σ  [potential capability; assumes centered process]</div>
<div class="formula">Cpk = min[(USL − μ) ÷ 3σ, (μ − LSL) ÷ 3σ]  [actual capability; accounts for centering]</div>

<tr><td>Defects</td><td>Rework, scrap, rejects requiring additional resources</td><td>Failed weld inspection requiring cut-out and re-weld</td></tr>
</tbody></table>

<h2>5S Methodology</h2>
<table class="kt-table"><thead><tr><th>Step</th><th>Japanese</th><th>Core Action</th></tr></thead><tbody>
<tr><td>Sort</td><td>Seiri</td><td>Separate needed from unneeded; red-tag unneeded items</td></tr>
<tr><td>Set in Order</td><td>Seiton</td><td>Organize and identify items for ease of use; visual management</td></tr>
<tr><td>Shine</td><td>Seiso</td><td>Thorough cleanup; everything in perfect condition</td></tr>
<tr><td>Standardize</td><td>Seiketsu</td><td>Maintain first 3 S's through standard procedures and schedules</td></tr>
<tr><td>Sustain</td><td>Shitsuke</td><td>Form the habit; periodic audits; train and cross-train personnel</td></tr>
</tbody></table>

<h2>Value Stream Mapping (VSM)</h2>
<p>Charts ALL activities (processing, materials, ordering) from raw material to customer delivery. Identifies value-added vs. non-value-added activities.</p>
<div class="formula">Takt Time = Available Work Time ÷ Customer Demand</div>
<p><strong>Three VSM types:</strong> Material flow VSM (manufacturing), Transactional VSM/TVSM (business processes), Enterprise VSM/EVSM (multi-site)</p>
<p><strong>Always produces two maps:</strong> Current state → Future state</p>

<h2>Key Lean Tools</h2>
<table class="kt-table"><thead><tr><th>Tool</th><th>Description</th></tr></thead><tbody>
<tr><td>JIT</td><td>Material delivered exactly when/where needed; pull-based; minimizes inventory</td></tr>
<tr><td>Kanban</td><td>Visual pull signal; min qty = (demand during lead time + safety stock) ÷ container qty</td></tr>
<tr><td>SMED</td><td>Single-Minute Exchange of Die; goal: convert internal setup steps to external</td></tr>
<tr><td>Poka-Yoke</td><td>Error-proofing; Control (removes human element) vs. Warning (alarm signals)</td></tr>
<tr><td>Kaizen Blitz</td><td>5-day intense event: Mon=train, Tue=current map, Wed=future map, Thu=data, Fri=implement</td></tr>
<tr><td>Standard Work</td><td>Best known method documented and followed consistently by all operators</td></tr>
</tbody></table>

<h2>OEE Formula</h2>
<div class="formula">OEE = Availability × Performance × Quality  [World-class ≥ 85%]</div>
<ul>
<li><strong>Availability</strong> = Actual run time ÷ Planned run time</li>
<li><strong>Performance</strong> = Actual output ÷ Maximum possible output at ideal rate</li>
<li><strong>Quality</strong> = Good pieces ÷ Total pieces produced</li>
</ul>

<h2>Theory of Constraints (TOC)</h2>
<p>Eliyahu Goldratt: system strength = weakest link. Optimize the WHOLE system, not individual parts.</p>
<h3>5 Focusing Steps</h3>
<ol>
<li><strong>Identify</strong> the constraint (weakest link)</li>
<li><strong>Exploit</strong> — extract maximum performance from constraint without major investment</li>
<li><strong>Subordinate</strong> — adjust all other parts of system to support the constraint</li>
<li><strong>Elevate</strong> — if still constrained, invest to eliminate the constraint</li>
<li><strong>Repeat</strong> — don't let inertia become the new constraint; find the next one</li>
</ol>
<div class="formula">Throughput (T) = Rate system generates money through sales</div>
<div class="formula">ROI_TOC = (T − Operating Expense) ÷ Inventory</div>

<h2>Documentation Hierarchy (ISO 9001)</h2>
<ol>
<li><strong>Quality Manual</strong> — What? Why? (organizational context and policy)</li>
<li><strong>Procedures</strong> — Who? What? When? (process-level guidance)</li>
<li><strong>Work Instructions</strong> — How? (step-by-step task execution)</li>
<li><strong>Records</strong> — Objective evidence of compliance</li>
</ol>

<h2>SMED: Internal vs. External Setup</h2>
<ul>
<li><strong>Internal setup:</strong> Steps that require the machine to be STOPPED (die mounting, clamp tightening)</li>
<li><strong>External setup:</strong> Steps that CAN be done while machine is STILL RUNNING (pre-staging, pre-heating)</li>
<li><strong>Goal:</strong> Convert as many internal steps to external as possible → reduce machine downtime</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Muda</td><td>Japanese for waste — anything that does not add value</td></tr>
<tr><td>Takt Time</td><td>Available work time ÷ Customer demand rate</td></tr>
<tr><td>Little's Law</td><td>WIP = Throughput × Lead Time</td></tr>
<tr><td>OEE</td><td>Availability × Performance × Quality (world-class ≥ 85%)</td></tr>
<tr><td>Constraint</td><td>Weakest link limiting system throughput</td></tr>
<tr><td>Physical Constraint</td><td>Equipment, materials, workforce — easier to identify and address</td></tr>
<tr><td>Policy Constraint</td><td>Rules, procedures, management decisions — harder to change; higher improvement potential</td></tr>
<tr><td>SMED</td><td>Single-Minute Exchange of Die — rapid changeover; convert internal to external steps</td></tr>
<tr><td>Poka-Yoke</td><td>Error-proofing devices and methods</td></tr>
</tbody></table>`},

15:{icon:'📏',title:'Measurement, Assessment and Metrics',bok:'IV.C',part:'IV',content:`
<h2>Descriptive Statistics</h2>
<table class="kt-table"><thead><tr><th>Statistic</th><th>Formula / Description</th></tr></thead><tbody>
<tr><td>Mean (X̄)</td><td>ΣX ÷ n (sum of all values divided by count)</td></tr>
<tr><td>Median</td><td>Middle value when ordered; average of two middle values for even n</td></tr>
<tr><td>Mode</td><td>Most frequently occurring value in the data set</td></tr>
<tr><td>Range (R)</td><td>Largest value − Smallest value</td></tr>
<tr><td>Standard Deviation (s)</td><td>s = √[Σ(X − X̄)² ÷ (n−1)]</td></tr>
<tr><td>Variance</td><td>Standard deviation squared (s²)</td></tr>
</tbody></table>

<h2>Probability Distributions</h2>
<table class="kt-table"><thead><tr><th>Distribution</th><th>Shape</th><th>Key Use Case</th></tr></thead><tbody>
<tr><td>Normal</td><td>Symmetric bell curve</td><td>Most quality/manufacturing data; ±3σ = 99.73%</td></tr>
<tr><td>Binomial</td><td>Discrete; two outcomes</td><td>Pass/fail attribute data; proportion defective</td></tr>
<tr><td>Poisson</td><td>Discrete; count events</td><td>Count of defects/unit; low probability events (&lt;0.10)</td></tr>
<tr><td>Exponential</td><td>Right-skewed continuous</td><td>Time between failures; reliability/service life data</td></tr>
<tr><td>Weibull</td><td>Flexible shape</td><td>Reliability bathtub curve; infant mortality to wear-out</td></tr>
</tbody></table>

<h2>Control Chart Selection</h2>
<table class="kt-table"><thead><tr><th>Chart Type</th><th>Data Type</th><th>Sample Size</th></tr></thead><tbody>
<tr><td>X̄-R Chart</td><td>Variables (continuous)</td><td>n ≤ 10</td></tr>
<tr><td>X̄-s Chart</td><td>Variables (continuous)</td><td>n > 10</td></tr>
<tr><td>p-chart</td><td>Attributes — fraction defective</td><td>Variable sample size</td></tr>
<tr><td>np-chart</td><td>Attributes — number defective</td><td>Constant sample size</td></tr>
<tr><td>c-chart</td><td>Attributes — count of defects</td><td>Constant sample size</td></tr>
<tr><td>u-chart</td><td>Attributes — defects per unit</td><td>Variable sample size</td></tr>
</tbody></table>

<h2>Sampling Risks</h2>
<table class="kt-table"><thead><tr><th>Risk</th><th>Also Known As</th><th>Description</th></tr></thead><tbody>
<tr><td>Alpha (α)</td><td>Producer's Risk / Type I Error</td><td>Probability of REJECTING GOOD product</td></tr>
<tr><td>Beta (β)</td><td>Consumer's Risk / Type II Error</td><td>Probability of ACCEPTING BAD product</td></tr>
</tbody></table>
<p><strong>AQL (Acceptable Quality Limit):</strong> Worst tolerable process average submitted for acceptance sampling</p>
<div class="exam-tip">Alpha = reject good (Type I) = Producer's Risk. Beta = accept bad (Type II) = Consumer's Risk. These are frequently confused — memorize the pairing.</div>

<h2>Measurement Systems Analysis (Gage R&R)</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>Accuracy</td><td>Closeness of measured value to true/reference value (validity)</td></tr>
<tr><td>Precision</td><td>Repeatability of measurements; consistency of results</td></tr>
<tr><td>Repeatability</td><td>Variation from same operator using same gage (equipment variation)</td></tr>
<tr><td>Reproducibility</td><td>Variation between different operators using same gage (appraiser variation)</td></tr>
<tr><td>Bias</td><td>Systematic offset from true value (consistent directional error)</td></tr>
<tr><td>Linearity</td><td>Consistency of bias across the full measurement range</td></tr>
</tbody></table>
<p><strong>Target analogy:</strong> Reliable but not valid = tight grouping off-center. Valid but not reliable = centered but scattered. Reliable AND valid = tight, centered grouping.</p>

<h2>Process Capability Indices</h2>
<div class="formula">Cp = (USL − LSL) ÷ 6σ  [potential capability — assumes process is centered]</div>
<div class="formula">Cpk = min[(USL − μ) ÷ 3σ,  (μ − LSL) ÷ 3σ]  [actual capability — accounts for off-centering]</div>
<table class="kt-table"><thead><tr><th>Index Value</th><th>Interpretation</th></tr></thead><tbody>
<tr><td>≥ 1.67</td><td>Excellent — required for safety-critical applications</td></tr>
<tr><td>≥ 1.33</td><td>Capable — standard industry target (4σ process)</td></tr>
<tr><td>1.00 – 1.33</td><td>Marginally capable — requires tight monitoring</td></tr>
<tr><td>&lt; 1.00</td><td>Not capable — process cannot meet specifications reliably</td></tr>
</tbody></table>
<p><strong>Pp/Ppk:</strong> Potential capability indices for initial studies (use sample std dev s, not σ)</p>
<p><strong>Cp > Cpk</strong> indicates the process is capable but NOT centered</p>

<h2>Common vs. Special Cause Variation</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th><th>Action</th></tr></thead><tbody>
<tr><td>Common Cause</td><td>Inherent, random variation always present; stable process</td><td>Requires system-level change (management's responsibility)</td></tr>
<tr><td>Special Cause</td><td>Assignable, detectable, unusual variation from a specific source</td><td>Identify and remove the specific cause</td></tr>
</tbody></table>
<p><strong>Tampering:</strong> Adjusting a stable (common cause only) process based on individual data points — this INCREASES total variation. Classic management mistake.</p>

<h2>Reliability — Bathtub Curve</h2>
<p><strong>3 phases:</strong> Infant Mortality (decreasing failure rate) → Useful Life (constant failure rate) → Wear-out (increasing failure rate)</p>
<div class="formula">Availability (Ao) = MTBF ÷ (MTBF + MTTR)</div>
<ul>
<li><strong>MTTF:</strong> Mean Time to Failure — for nonrepairable items</li>
<li><strong>MTBF:</strong> Mean Time Between Failures — for repairable systems</li>
<li><strong>MTTR:</strong> Mean Time to Repair</li>
</ul>

<h2>GQM Measurement Model</h2>
<p>Goal → Question → Metric. Three-level framework for defining WHY you measure, WHAT questions to ask, and HOW to quantify the answers.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>AQL</td><td>Acceptable Quality Limit — worst tolerable process average for acceptance sampling</td></tr>
<tr><td>Cp</td><td>Process capability potential: specification range ÷ process range</td></tr>
<tr><td>Cpk</td><td>Process capability actual: accounts for process centering</td></tr>
<tr><td>Common Cause</td><td>Inherent random variation — always present; stable system</td></tr>
<tr><td>Special Cause</td><td>Assignable, detectable, unusual variation from specific event</td></tr>
<tr><td>Tampering</td><td>Overcorrecting a stable process — increases total variation</td></tr>
<tr><td>Repeatability</td><td>Same operator, same gage — equipment variation</td></tr>
<tr><td>Reproducibility</td><td>Different operators, same gage — appraiser variation</td></tr>
<tr><td>MTBF</td><td>Mean Time Between Failures (repairable systems)</td></tr>
<tr><td>MTTR</td><td>Mean Time to Repair</td></tr>
</tbody></table>`},

16:{icon:'🎯',title:'Customer Identification and Segmentation',bok:'V.A',part:'V',content:`
<h2>6 Customer Types (Harrington)</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th><th>Example</th></tr></thead><tbody>
<tr><td>Primary</td><td>Directly receives the output; reason the process exists</td><td>Patient receiving test results from lab</td></tr>
<tr><td>Secondary</td><td>Also receives outputs but not the reason for the process</td><td>Billing dept receiving lab invoice data</td></tr>
<tr><td>Indirect</td><td>Within org; affected by outputs but doesn't receive them directly</td><td>Quality dept affected by production defect rates</td></tr>
<tr><td>External</td><td>End users / consumers — final users of product/service</td><td>Consumer buying a Tesla Powerwall</td></tr>
<tr><td>False</td><td>Performs activities that don't add value</td><td>100% inspector reviewing already-certified stable process</td></tr>
<tr><td>Internal</td><td>"Next operation as customer" — functions within the organization</td><td>Manufacturing receiving design specs from Engineering</td></tr>
</tbody></table>
<div class="exam-tip">Know all 6 types. The internal customer concept and false customer are most frequently tested. "Next operation as customer" — treat every internal handoff as a customer transaction.</div>

<h2>Quality-Level Agreements (QLAs)</h2>
<p>Formalized service agreements between internal providers and receivers. Also called SLAs (Service-Level Agreements).</p>
<h3>3 Tenets of an Effective QLA</h3>
<ol>
<li>Valid requirements are agreed upon and meet the receiver's actual needs</li>
<li>Valid measurement of service quality is consistent with those needs</li>
<li>All internal requirements must align with external customer requirements</li>
</ol>

<h2>7 Steps to Improve Internal Customer Interfaces</h2>
<ol>
<li>Identify internal customer interfaces (providers and receivers)</li>
<li>Establish gap assessment — current vs. desired state</li>
<li>Set improvement objectives and measurements</li>
<li>Perform feasibility study of each recommended change</li>
<li>Modify processes where needed</li>
<li>Implement tracking and reporting systems</li>
<li>Document quality-level agreements between provider and receiver</li>
</ol>

<h2>Market Segmentation Dimensions</h2>
<p>Purchase volume, profitability, industry, geography, demographics (age/income/gender), psychographics (lifestyle/attitudes), organizational type, buyer behavior</p>

<h2>Three Preference Patterns</h2>
<ul>
<li><strong>Homogeneous:</strong> All customers have similar preferences → mass marketing; products cluster at center</li>
<li><strong>Diffused:</strong> Customers have widely varying preferences → no natural segments; companies vary greatly</li>
<li><strong>Clustered:</strong> Natural groups with distinct preferences → targeted segmentation is most effective</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>QLA / SLA</td><td>Quality/Service Level Agreement — internal provider-receiver contract</td></tr>
<tr><td>B2B</td><td>Business-to-business — multiple stakeholders in purchasing decision</td></tr>
<tr><td>B2C</td><td>Business-to-consumer — direct to end user; clearer requirement path</td></tr>
<tr><td>Vital Few</td><td>Core customers representing the highest value segment (Pareto applied to customers)</td></tr>
<tr><td>Internal Customer</td><td>Next operation or function receiving output within the organization</td></tr>
<tr><td>False Customer</td><td>Receives output but performs no value-adding activity with it</td></tr>
</tbody></table>`},

17:{icon:'🤝',title:'Customer Relationship Management',bok:'V.B',part:'V',content:`
<h2>Voice of the Customer (VOC)</h2>
<p>System for capturing customer needs and expectations from multiple sources:</p>
<p><strong>Internal sources:</strong> Complaints, warranty data, service records, past customer contacts</p>
<p><strong>External sources:</strong> Market research, surveys, listening posts, competitor data, trade journals, social media, joint planning meetings, advisory councils</p>

<h2>QFD — House of Quality</h2>
<p>Methodology translating customer voice (qualitative "whats") into technical requirements (operational "hows").</p>
<table class="kt-table"><thead><tr><th>Section</th><th>Content</th></tr></thead><tbody>
<tr><td>A — Whats (left)</td><td>Customer wants and needs — Voice of the Customer</td></tr>
<tr><td>B — Importance (left)</td><td>Relative importance weighting assigned by customer</td></tr>
<tr><td>C — Competitive (right)</td><td>Customer perception of performance vs. competitors</td></tr>
<tr><td>D — Hows (top)</td><td>Technical/engineering characteristics — Voice of the Company</td></tr>
<tr><td>E — Relationships (center)</td><td>Strength of relationships between Whats and Hows (strong/medium/weak)</td></tr>
<tr><td>F — Importance (bottom)</td><td>Technical importance rating — prioritizes engineering effort</td></tr>
<tr><td>G — Roof</td><td>Correlations between technical characteristics (positive/negative conflicts)</td></tr>
<tr><td>H — Targets (bottom)</td><td>Technical benchmarks and performance targets</td></tr>
</tbody></table>
<p><strong>QFD cascades through 4 levels:</strong> Customer requirements → Design requirements → Parts requirements → Process requirements → Production requirements</p>
<div class="exam-tip">Know all 8 sections of the house of quality. Understand the 4-level cascade. The roof section (G) showing technical correlations is often overlooked but tested.</div>

<h2>Kano Model — 5 Quality Categories</h2>
<table class="kt-table"><thead><tr><th>Category</th><th>When Present</th><th>When Absent</th><th>Example</th></tr></thead><tbody>
<tr><td>Must-be (Basic)</td><td>No satisfaction — expected; taken for granted</td><td>Major DISSATISFACTION</td><td>Seatbelts; brakes that work</td></tr>
<tr><td>One-dimensional (Performance)</td><td>More = more satisfaction (linear)</td><td>Less = dissatisfaction</td><td>Battery range; fuel economy</td></tr>
<tr><td>Attractive (Delighters)</td><td>Creates DELIGHT — unexpected</td><td>No dissatisfaction</td><td>Heated seats (when first introduced)</td></tr>
<tr><td>Indifferent</td><td>No effect on satisfaction</td><td>No effect on satisfaction</td><td>Internal system components</td></tr>
<tr><td>Reverse</td><td>Creates DISSATISFACTION (unwanted)</td><td>Satisfaction</td><td>Overly complex feature the user didn't ask for</td></tr>
</tbody></table>
<div class="exam-tip">Key Kano insight: Today's Attractive (delighters) become tomorrow's Must-be's as customer expectations evolve. Tesla Autopilot = once a delighter; now approaching must-be territory.</div>

<h2>Net Promoter Score (NPS)</h2>
<div class="formula">NPS = % Promoters (score 9–10) − % Detractors (score 0–6)  [Range: −100 to +100]</div>
<p>Passives (7–8) are excluded from the NPS calculation but included in denominator for percentage.</p>

<h2>5 Levels of Customer Satisfaction</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Description</th><th>Business Outcome</th></tr></thead><tbody>
<tr><td>1</td><td>Dissatisfied</td><td>Departed customer; negative word-of-mouth</td></tr>
<tr><td>2</td><td>Marginally satisfied</td><td>Easily lost to competitor</td></tr>
<tr><td>3</td><td>Basically satisfied</td><td>Indifferent; no loyalty</td></tr>
<tr><td>4</td><td>Delighted</td><td>Return customer; retained</td></tr>
<tr><td>5</td><td>Committed advocate</td><td>Loyal; actively refers others; defends the brand</td></tr>
</tbody></table>

<h2>5-Step Customer Recovery Process</h2>
<ol>
<li><strong>Apologize</strong> — Sincere apology; take personal responsibility immediately</li>
<li><strong>Restate</strong> — Confirm you understand exactly what the customer experienced</li>
<li><strong>Empathize</strong> — Demonstrate genuine commitment to resolving the situation</li>
<li><strong>Make Restitution</strong> — Specific, concrete action (replacement, discount, expedite)</li>
<li><strong>Follow Up</strong> — Check back to confirm customer satisfaction with resolution</li>
</ol>

<h2>Complaint Handling Key Statistics</h2>
<ul>
<li>Only ~4% of dissatisfied customers actually complain — most leave silently</li>
<li>9.5% of non-complainers with $100+ loss would repurchase</li>
<li>54.3% repurchase rate when complaint is resolved satisfactorily</li>
<li>Speed of resolution significantly multiplies repurchase intent</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>CRM</td><td>Customer Relationship Management — coordinates all customer touchpoints and information</td></tr>
<tr><td>VOC</td><td>Voice of the Customer — system capturing needs and expectations from multiple sources</td></tr>
<tr><td>QFD</td><td>Quality Function Deployment — translates VOC into technical requirements via house of quality</td></tr>
<tr><td>Kano Model</td><td>5-category model: must-be, one-dimensional, attractive, indifferent, reverse</td></tr>
<tr><td>NPS</td><td>Net Promoter Score = % Promoters − % Detractors</td></tr>
<tr><td>Customer Lifetime Value</td><td>Total financial value of a customer relationship over the entire duration</td></tr>
<tr><td>Listening Post</td><td>Formal process for collecting casual/informal customer remarks (ICALL)</td></tr>
<tr><td>Must-be Quality</td><td>Basic expectations — causes dissatisfaction when absent; expected when present</td></tr>
<tr><td>Attractive Quality</td><td>Delighters — creates high satisfaction when present; no dissatisfaction when absent</td></tr>
</tbody></table>`},

18:{icon:'🔗',title:'Supply Chain Management',bok:'VI.A–G',part:'VI',content:`
<h2>8-Step Supplier Selection Process</h2>
<ol>
<li>Identify all possible sources</li>
<li>Evaluate reputations (market intelligence, references)</li>
<li>Prepare bidders list</li>
<li>Request bids / RFQ</li>
<li>Evaluate pre-award data (financial stability, quality systems, capacity)</li>
<li>Select approved supplier list</li>
<li>Update and prepare contracts</li>
<li>Ongoing monitoring and management</li>
</ol>
<p><strong>Selection team:</strong> Cross-functional — purchasing, engineering, production, quality, materials management</p>

<h2>Supplier Classification Ladder</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Requirements Met</th></tr></thead><tbody>
<tr><td>Approved</td><td>Meets minimum requirements of the organization</td></tr>
<tr><td>Qualified</td><td>Additional review: self-assessment, questionnaire, on-site quality audit</td></tr>
<tr><td>Certified</td><td>Demonstrated consistent quality over time; reduced/eliminated incoming inspection</td></tr>
</tbody></table>
<p><strong>Certification criteria:</strong> No lot rejections ≥1 year, process stable and in control, documented QMS evaluation, agreed specifications, no negative incidents ≥6 months.</p>

<h2>Industry Quality Standards</h2>
<table class="kt-table"><thead><tr><th>Standard</th><th>Industry</th></tr></thead><tbody>
<tr><td>ISO 9001:2015</td><td>All industries — QMS requirements; certifiable</td></tr>
<tr><td>IATF 16949:2016</td><td>Automotive — adds APQP, PPAP, FMEA, MSA, SPC requirements</td></tr>
<tr><td>AS9100D</td><td>Aerospace, space, and defense</td></tr>
<tr><td>ISO 13485:2016</td><td>Medical devices</td></tr>
<tr><td>ISO/IEC 27001</td><td>Information security management</td></tr>
</tbody></table>

<h2>Supplier Risk Response Strategies</h2>
<table class="kt-table"><thead><tr><th>Risk Type</th><th>Strategies</th></tr></thead><tbody>
<tr><td>Threats (negative risks)</td><td>Escalate, Avoid, Transfer, Mitigate, Accept</td></tr>
<tr><td>Opportunities (positive risks)</td><td>Exploit, Enhance, Share, Accept</td></tr>
</tbody></table>

<h2>Supplier Performance Metrics</h2>
<ul>
<li>PPM (parts per million defective)</li>
<li>On-time delivery percentage</li>
<li>Responsiveness to corrective action requests</li>
<li>Process capability (Cpk of supplier processes)</li>
<li>Cost and price competitiveness</li>
<li>Technical support availability and quality</li>
</ul>
<p><strong>Performance Indices:</strong> QPI (Quality), CPI (Commodity), SPI (Supplier overall), DPI (Delivery), PPI (Past Performance)</p>

<h2>Push vs. Pull Systems</h2>
<table class="kt-table"><thead><tr><th>System</th><th>Trigger</th><th>Characteristics</th></tr></thead><tbody>
<tr><td>Push</td><td>Forecast/schedule</td><td>Materials pushed to next stage based on production schedule; risk of excess inventory</td></tr>
<tr><td>Pull</td><td>Actual demand</td><td>Material pulled by real consumption signal (kanban/JIT); minimizes inventory</td></tr>
</tbody></table>
<p><strong>Ship-to-Stock:</strong> Certified suppliers can deliver directly without incoming inspection — reduces cycle time and overhead costs.</p>

<h2>Deming's Principle on Suppliers</h2>
<p>"End the practice of awarding business on the basis of price tag alone." — Total cost of ownership, not just purchase price. Suppliers are partners, not adversaries.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>SCM</td><td>Supply Chain Management — planning, sourcing, making, delivery, returns integration</td></tr>
<tr><td>Strategic Sourcing</td><td>Process for reducing total cost while improving quality and service levels</td></tr>
<tr><td>Certified Supplier</td><td>Demonstrated consistent quality; eligible for reduced/eliminated incoming inspection</td></tr>
<tr><td>IATF 16949</td><td>Automotive QMS standard — requires APQP, PPAP, FMEA, MSA, SPC</td></tr>
<tr><td>Ship-to-Stock</td><td>Material received without incoming inspection from certified supplier</td></tr>
<tr><td>Supplier Alliance</td><td>Formalized partnership with shared fate, mutual benefits, and joint objectives</td></tr>
<tr><td>Type I Risk (α)</td><td>Producer's risk — rejecting good product</td></tr>
<tr><td>Type II Risk (β)</td><td>Consumer's risk — accepting bad product</td></tr>
</tbody></table>`},

19:{icon:'📚',title:'Training and Development',bok:'VII.A–D',part:'VII',content:`
<h2>Training vs. Education</h2>
<table class="kt-table"><thead><tr><th>Aspect</th><th>Training</th><th>Education</th></tr></thead><tbody>
<tr><td>Answer</td><td>HOW to perform tasks</td><td>WHY and WHEN; broader knowledge</td></tr>
<tr><td>Output</td><td>Specific skill demonstration</td><td>Broadened knowledge base; analytical thinking</td></tr>
<tr><td>Measurement</td><td>Can the learner DO the task?</td><td>Can the learner THINK about the domain?</td></tr>
<tr><td>Duration</td><td>Shorter; focused; specific task</td><td>Longer; conceptual; transferable</td></tr>
</tbody></table>

<h2>ADDIE Instructional Design Model</h2>
<table class="kt-table"><thead><tr><th>Phase</th><th>Key Activities</th></tr></thead><tbody>
<tr><td>A — Analysis</td><td>Define audience; gap analysis; determine what/how/who to train</td></tr>
<tr><td>D — Design</td><td>Learning objectives; delivery methods; evaluation criteria; curriculum structure</td></tr>
<tr><td>D — Development</td><td>Create/purchase materials; build assessments; pilot content</td></tr>
<tr><td>I — Implementation</td><td>Deliver training; manage logistics; execute rollout</td></tr>
<tr><td>E — Evaluation</td><td>Measure results against objectives; continuous improvement of the program</td></tr>
</tbody></table>

<h2>Mager & Pipe — Training Needs Diagnosis</h2>
<div class="model-box">
<h4>Critical Diagnostic Question</h4>
<p><strong>"Could they do it if their life depended on it?"</strong></p>
<ul>
<li><strong>YES → NOT a training problem</strong> — Address: Job design (J), Consequences (C), or Feedback (F)</li>
<li><strong>NO → Training/Knowledge deficiency (T)</strong> — Training is the appropriate solution</li>
</ul>
</div>
<div class="exam-tip">This is the most important training diagnostic concept. If someone COULD perform the task with sufficient motivation, training is not the answer — fix the system, consequences, or feedback instead.</div>

<h2>Adult Learning Principles (Knowles — 6 Principles)</h2>
<ol>
<li>Adults have a deep need to be SELF-DIRECTING in their learning</li>
<li>Adults have a deep need to know WHY they should learn something before engaging</li>
<li>Adults become ready to learn when they experience a need in their life situation</li>
<li>Adults are TASK-CENTERED / PROBLEM-CENTERED in orientation (not subject-centered)</li>
<li>Adults are motivated by both extrinsic AND intrinsic motivators</li>
<li>Adults' prior experience is a rich resource for learning (and can also be a barrier)</li>
</ol>

<h2>Bloom's Taxonomy (Cognitive Domain)</h2>
<p>Remember → Understand → Apply → Analyze → Evaluate → Create  (low to high complexity)</p>
<p><em>The CMQ/OE BoK tags every exam question with one of these levels — higher levels require more complex thinking.</em></p>

<h2>Kirkpatrick / Phillips 5-Level Evaluation Model</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Name</th><th>Key Question</th><th>Difficulty</th></tr></thead><tbody>
<tr><td>1</td><td>Reaction</td><td>Were participants pleased with the training?</td><td>Easy — smile sheets</td></tr>
<tr><td>2</td><td>Learning</td><td>Did they acquire the intended knowledge/skills?</td><td>Moderate — pre/post tests</td></tr>
<tr><td>3</td><td>Behavior</td><td>Did behavior change on the job after training?</td><td>Difficult — needs observation</td></tr>
<tr><td>4</td><td>Results</td><td>Was there measurable organizational impact?</td><td>Hard — business metrics</td></tr>
<tr><td>5</td><td>ROTI</td><td>What is the financial return on training investment?</td><td>Hardest — most valuable</td></tr>
</tbody></table>
<div class="formula">ROTI = Net Program Benefits ÷ Program Costs  [target BCR: ≥ 3:1]</div>
<div class="exam-tip">Level 1 (Reaction) = lowest value. Level 5 (ROTI) = highest value AND hardest to measure. Know all 5 levels plus the ROTI formula.</div>

<h2>Training Delivery Methods</h2>
<ul>
<li><strong>On-the-Job Training (OJT):</strong> Tell → Show → Do → Repeat until standard met</li>
<li><strong>Coaching:</strong> One-on-one; define goals → observe → set expectations → give feedback → follow up</li>
<li><strong>E-learning Gamification:</strong> Level 1 (quiz in course) → Level 2 (game-based) → Level 3 (gamified path) → Level 4 (gamified portal)</li>
<li><strong>Microlearning:</strong> Short, focused bits on single specific tasks; video, infographic, job aid formats</li>
</ul>

<h2>Why Training Programs Fail</h2>
<ul>
<li>Cultural resistance by line managers</li>
<li>No visible connection to strategic plans</li>
<li>Technique vs. problem orientation (teaching tools, not solving actual problems)</li>
<li>Inadequate needs assessment (training when it wasn't the real issue)</li>
<li>Lack of management participation and reinforcement</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>ADDIE</td><td>Analysis → Design → Development → Implementation → Evaluation</td></tr>
<tr><td>Bloom's Taxonomy</td><td>Remember → Understand → Apply → Analyze → Evaluate → Create</td></tr>
<tr><td>IDP</td><td>Individual Development Plan; goals, timelines, activities for growth</td></tr>
<tr><td>ROTI</td><td>Return on Training Investment; target ≥ 3:1 BCR</td></tr>
<tr><td>Andragogy</td><td>Adult learning theory (Knowles) — 6 principles of self-directed adult learning</td></tr>
<tr><td>KESSA</td><td>Knowledge, Experience, Skills, Aptitude, Attitude — training needs assessment factors</td></tr>
</tbody></table>`},

20:{icon:'🎯',title:'CMQ/OE Body of Knowledge',bok:'Exam Master Reference',part:'VII',content:`
<h2>Exam Blueprint</h2>
<table class="kt-table"><thead><tr><th>Domain</th><th>Title</th><th>Questions</th><th>Weight</th></tr></thead><tbody>
<tr><td>I</td><td>Leadership</td><td>28</td><td>17.0%</td></tr>
<tr><td>II</td><td>Strategic Plan Development & Deployment</td><td>22</td><td>13.3%</td></tr>
<tr><td>III</td><td>Management Elements and Methods</td><td>31</td><td>18.8%</td></tr>
<tr><td>IV</td><td>Quality Management Tools</td><td>30</td><td>18.2%</td></tr>
<tr><td>V</td><td>Customer-Focused Organizations</td><td>21</td><td>12.7%</td></tr>
<tr><td>VI</td><td>Supply Chain Management</td><td>17</td><td>10.3%</td></tr>
<tr><td>VII</td><td>Training and Development</td><td>16</td><td>9.7%</td></tr>
<tr><td></td><td><strong>TOTAL</strong></td><td><strong>165</strong></td><td><strong>100%</strong></td></tr>
</tbody></table>
<div class="exam-tip">Study Priority: III + IV = 37%. Master these first. I + II = 30%. All four combined = 67% of all questions. Time: 165 questions in ~5 hours = ~1.8 min per question.</div>

<h2>Master Formula Reference</h2>
<table class="kt-table"><thead><tr><th>Formula</th><th>Expression</th><th>Domain</th></tr></thead><tbody>
<tr><td>RPN (FMEA)</td><td>Severity × Occurrence × Detection (max 1000)</td><td>IV.A.3</td></tr>
<tr><td>PERT Time Estimate</td><td>(Optimistic + 4×Most Likely + Pessimistic) ÷ 6</td><td>III.C.2</td></tr>
<tr><td>Cp</td><td>(USL − LSL) ÷ 6σ</td><td>IV.C.7</td></tr>
<tr><td>Cpk</td><td>min[(USL−μ)÷3σ, (μ−LSL)÷3σ]</td><td>IV.C.7</td></tr>
<tr><td>OEE</td><td>Availability × Performance × Quality</td><td>IV.B.3</td></tr>
<tr><td>Availability</td><td>MTBF ÷ (MTBF + MTTR)</td><td>IV.C.8</td></tr>
<tr><td>Takt Time</td><td>Available Work Time ÷ Customer Demand</td><td>IV.B.3</td></tr>
<tr><td>Little's Law</td><td>WIP = Throughput × Lead Time</td><td>IV.B.3/IV.B.4</td></tr>
<tr><td>NPS</td><td>% Promoters (9–10) − % Detractors (0–6)</td><td>V.B.1</td></tr>
<tr><td>ROTI</td><td>Net Program Benefits ÷ Program Costs</td><td>VII.D</td></tr>
<tr><td>CPI</td><td>EV ÷ AC (>1.0 = under budget)</td><td>III.C.3</td></tr>
<tr><td>SPI</td><td>EV ÷ PV (>1.0 = ahead of schedule)</td><td>III.C.3</td></tr>
<tr><td>Total COQ</td><td>Prevention + Appraisal + Internal Failure + External Failure</td><td>IV.A.5</td></tr>
<tr><td>ROI</td><td>Net Dollar Benefit ÷ Investment</td><td>III.A.5</td></tr>
<tr><td>Current Ratio</td><td>Current Assets ÷ Current Liabilities (≥2.0)</td><td>III.A.5</td></tr>
</tbody></table>

<h2>Bloom's Taxonomy — CMQ/OE Application</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Verb Examples in BoK</th><th>What It Means</th></tr></thead><tbody>
<tr><td>1. Remember</td><td>Define, list, identify, recall</td><td>Retrieve relevant knowledge from memory</td></tr>
<tr><td>2. Understand</td><td>Describe, explain, interpret</td><td>Construct meaning from instruction</td></tr>
<tr><td>3. Apply</td><td>Use, demonstrate, implement</td><td>Execute a procedure in a given situation</td></tr>
<tr><td>4. Analyze</td><td>Differentiate, compare, examine</td><td>Break material into parts and understand relationships</td></tr>
<tr><td>5. Evaluate</td><td>Judge, assess, justify</td><td>Make judgments based on criteria and standards</td></tr>
<tr><td>6. Create</td><td>Design, develop, formulate</td><td>Produce new or original work from elements</td></tr>
</tbody></table>

<h2>Cross-Cutting Exam Themes</h2>
<ul>
<li><strong>Cost of Quality:</strong> IV.A.5 + II + III + VI — appears in multiple domains</li>
<li><strong>Risk Management:</strong> II.B.1 + III.A.6 + VI.B — ISO 31000 framework</li>
<li><strong>PDCA / Continuous Improvement:</strong> IV.A.3 + III.D + III.E.3 — foundational cycle</li>
<li><strong>ISO 9001 Requirements:</strong> III.D + III.E.1 + VI.A + VII.C — referenced across domains</li>
<li><strong>Stakeholder Analysis:</strong> II.B.3 + V.A + VI — interested parties concept</li>
<li><strong>Performance Measurement:</strong> II.C.3 + III.C.3 + VII.D — Balanced Scorecard</li>
</ul>

<h2>Exam Strategy for Quality Professionals</h2>
<ul>
<li><strong>Most questions are scenario-based</strong> — apply principles to practical workplace situations</li>
<li><strong>When two answers seem correct</strong>, choose the more comprehensive or strategic one</li>
<li><strong>Ethics questions:</strong> Public safety always trumps employer loyalty, client wishes, and personal gain</li>
<li><strong>Time management:</strong> Flag and skip if stuck (>2 min); come back at end</li>
<li><strong>Anchor to experience:</strong> Your Tesla QMS build, IATF 16949, supplier quality, and Six Sigma work maps directly to Domains III, IV, and VI</li>
<li><strong>Weakest areas:</strong> Invest extra time in training theory (VII), customer segmentation tools (V), and financial ratios (III.A.5)</li>
</ul>`}

    p.chapters.forEach(n => {
      const ch = CHAPTERS[n];
      html += `<div class="nav-ch${done.has(n)?' done':''}" id="nc${n}" onclick="go(${n})"><div class="nav-ch-inner"><span class="nav-ch-icon">${ch.icon}</span><span class="nav-ch-text">Ch.${n} · ${ch.title}</span><span class="nav-done">✓</span></div></div>`;
    });
  });
  document.getElementById('nav-area').innerHTML = html;
  refreshProgress();
}

function refreshProgress() {
  const n = done.size, t = 20;
  document.getElementById('progress-text').textContent = `${n} / ${t}`;
  document.getElementById('progress-fill').style.width = `${(n/t)*100}%`;
  done.forEach(id => {
    const el = document.getElementById(`nc${id}`);
    if(el) el.classList.add('done');
  });
}

// ══════════════════════════════════════
// CHAPTER RENDER
// ══════════════════════════════════════
function go(n) {
  current = n;
  const ch = CHAPTERS[n];
  const partObj = PARTS.find(p => p.id === ch.part);

  document.querySelectorAll('.nav-ch').forEach(e => e.classList.remove('active'));
  const ne = document.getElementById(`nc${n}`);
  if(ne) { ne.classList.add('active'); ne.scrollIntoView({block:'nearest'}); }

  document.getElementById('breadcrumb').innerHTML = `Part ${ch.part} / <em>Ch.${n} · ${ch.title}</em>`;

  const btn = document.getElementById('mark-done-btn');
  btn.style.display = 'flex';
  const isDone = done.has(n);
  btn.className = isDone ? 'btn btn-done' : 'btn btn-gold';
  btn.textContent = isDone ? '✓ Complete' : 'Mark Complete';

  const allChs = PARTS.flatMap(p => p.chapters);
  const idx = allChs.indexOf(n);
  const prev = idx > 0 ? allChs[idx-1] : null;
  const next = idx < allChs.length-1 ? allChs[idx+1] : null;

  document.getElementById('content').innerHTML = `
    <div class="ch-head">
      <div class="ch-icon-large">${ch.icon}</div>
      <div class="ch-meta">
        <span class="tag tag-part">Part ${ch.part} — ${partObj.title}</span>
        <span class="tag tag-bok">BoK ${ch.bok}</span>
      </div>
      <div class="ch-title-num">Chapter ${n}</div>
      <div class="ch-title">${ch.title}</div>
      <hr class="ch-divider">
    </div>
    ${ch.content}
    <div class="ch-nav">
      <button class="nav-btn${!prev?' disabled':''}" onclick="${prev?`go(${prev})`:''}"">
        <div class="nav-btn-dir">← Previous</div>
        <div class="nav-btn-title">${prev ? `Ch.${prev} · ${CHAPTERS[prev].title}` : '—'}</div>
      </button>
      <button class="nav-btn next${!next?' disabled':''}" onclick="${next?`go(${next})`:''}"">
        <div class="nav-btn-dir">Next →</div>
        <div class="nav-btn-title">${next ? `Ch.${next} · ${CHAPTERS[next].title}` : '—'}</div>
      </button>
    </div>
  `;
  window.scrollTo({top:0});
  if(window.innerWidth <= 800) { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
}

function markDone() {
  if(!current) return;
  done.has(current) ? done.delete(current) : done.add(current);
  saveDone();
  const btn = document.getElementById('mark-done-btn');
  const isDone = done.has(current);
  btn.className = isDone ? 'btn btn-done' : 'btn btn-gold';
  btn.textContent = isDone ? '✓ Complete' : 'Mark Complete';
  const ne = document.getElementById(`nc${current}`);
  if(ne) ne.classList.toggle('done', isDone);
  refreshProgress();
}

// ══════════════════════════════════════
// SEARCH
// ══════════════════════════════════════
const si = document.getElementById('search-input');
const sr = document.getElementById('search-results');

si.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if(q.length < 2) { sr.style.display='none'; return; }
  const hits = [];
  Object.entries(CHAPTERS).forEach(([n, ch]) => {
    const txt = (ch.title+' '+ch.content).toLowerCase();
    const i = txt.indexOf(q);
    if(i !== -1) {
      const raw = (ch.title+' '+ch.content).substring(Math.max(0,i-30),i+70).replace(/<[^>]+>/g,'').replace(/\s+/g,' ');
      hits.push({n:+n,ch,ctx:raw});
    }
  });
  if(!hits.length) { sr.innerHTML='<div class="sr-item"><div class="sr-ctx">No results found</div></div>'; }
  else { sr.innerHTML = hits.slice(0,7).map(h=>`<div class="sr-item" onclick="go(${h.n});clearSearch()"><div class="sr-ch">${h.ch.icon} Ch.${h.n} · ${h.ch.title}</div><div class="sr-ctx">${h.ctx.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<span class="sr-hi">${m}</span>`)}</div></div>`).join(''); }
  sr.style.display='block';
});
document.addEventListener('click', e => { if(!si.parentElement.contains(e.target)) sr.style.display='none'; });
function clearSearch() { si.value=''; sr.style.display='none'; }

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
});

loadHome();
</script>

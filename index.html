<table class="kt-table"><thead><tr><th>Index Value</th><th>Interpretation</th></tr></thead><tbody>
<tr><td>&gt; 1.67</td><td>Excellent — safety-critical applications</td></tr>
<tr><td>≥ 1.33</td><td>Capable — standard target</td></tr>
<tr><td>1.00 – 1.33</td><td>Capable but requires tight control</td></tr>
<tr><td>&lt; 1.00</td><td>Not capable</td></tr>
</tbody></table>
<p><strong>Pp/Ppk:</strong> Potential process capability for initial/short-term studies</p>

<h2>Common vs. Special Cause Variation</h2>
<ul>
<li><strong>Common cause:</strong> Inherent, random variation always present. Stable process. System issue.</li>
<li><strong>Special cause:</strong> Assignable, detectable, removable. Unstable process. Specific event.</li>
<li><strong>Tampering:</strong> Adjusting a stable process based on individual data points — INCREASES variation</li>
</ul>

<h2>Reliability Metrics (Bathtub Curve)</h2>
<p><strong>3 phases:</strong> Infant mortality (decreasing failure rate) → Useful life (constant rate) → Wear-out (increasing rate)</p>
<div class="formula">Availability (Ao) = MTBF ÷ (MTBF + MTTR)</div>
<ul>
<li><strong>MTTF:</strong> Mean Time to Failure — nonrepairable products</li>
<li><strong>MTBF:</strong> Mean Time Between Failures — repairable products</li>
<li><strong>MTTR:</strong> Mean Time to Repair</li>
</ul>

<h2>GQM Model</h2>
<p>Goal → Question → Metric. Three-level measurement model for defining what to measure and why.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>AQL</td><td>Acceptable Quality Limit — worst tolerable process average</td></tr>
<tr><td>Cp</td><td>Process capability — specification range ÷ process range</td></tr>
<tr><td>Cpk</td><td>Process capability accounting for centering</td></tr>
<tr><td>Common Cause</td><td>Inherent random variation — system issue</td></tr>
<tr><td>Special Cause</td><td>Assignable, detectable variation — specific event</td></tr>
<tr><td>Tampering</td><td>Overcorrecting a stable process — increases variation</td></tr>
<tr><td>Repeatability</td><td>Same operator, same gage</td></tr>
<tr><td>Reproducibility</td><td>Different operators, same gage</td></tr>
<tr><td>MTBF</td><td>Mean Time Between Failures (repairable)</td></tr>
<tr><td>MTTR</td><td>Mean Time to Repair</td></tr>
</tbody></table>
`},

16: { icon:'🎯', title:'Customer Identification and Segmentation', bok:'V.A', part:'V',
content:`
<h2>6 Types of Customers (Harrington)</h2>
<table class="kt-table"><thead><tr><th>Type</th><th>Description</th></tr></thead><tbody>
<tr><td>Primary</td><td>Directly receives the output of a process (main reason process exists)</td></tr>
<tr><td>Secondary</td><td>Also receives outputs but not the reason for the process</td></tr>
<tr><td>Indirect</td><td>Within org boundaries; affected by outputs but doesn't receive them directly</td></tr>
<tr><td>External</td><td>End users / consumers — final users of product or service</td></tr>
<tr><td>False</td><td>Performs activities that don't add value (e.g., 100% inspector for a stable process)</td></tr>
<tr><td>Internal</td><td>"Next operation as customer" — functions within the organization</td></tr>
</tbody></table>
<div class="exam-tip">Know all 6 customer types, especially the distinction between primary, secondary, and false customers. Internal customer concept is heavily tested.</div>

<h2>Internal Customers and Quality-Level Agreements (QLAs)</h2>
<p>QLAs (also called SLAs) formalize relationships between internal providers and receivers.</p>
<h3>3 Tenets of QLA</h3>
<ol>
<li>Valid requirements are agreed upon and meet receiver's needs</li>
<li>Valid measurement of service quality is consistent with needs</li>
<li>All internal requirements must be consistent with external customer requirements</li>
</ol>
<h3>7 Steps to Improve Internal Customer Interfaces</h3>
<ol>
<li>Identify internal customer interfaces</li>
<li>Establish gap assessment</li>
<li>Set improvement objectives and measurements</li>
<li>Perform feasibility study of each recommended change</li>
<li>Modify processes where needed</li>
<li>Implement tracking/reporting systems</li>
<li>Document quality-level agreements</li>
</ol>

<h2>Market Segmentation</h2>
<p><strong>Segmentation dimensions:</strong> Purchase volume, profitability, industry, geography, demographics (age/income/gender), psychographics (lifestyle/attitudes), organizational type</p>

<h2>Three Preference Patterns</h2>
<ul>
<li><strong>Homogeneous:</strong> All customers have similar preferences → mass marketing</li>
<li><strong>Diffused:</strong> Customers have widely varying preferences → no natural segments</li>
<li><strong>Clustered:</strong> Natural groups with distinct preferences → targeted segmentation</li>
</ul>

<h2>8-Step Process for Working with External Customers</h2>
<ol>
<li>Define and prioritize customer segments</li>
<li>Capture voice of key segments</li>
<li>Identify internal processes needing change</li>
<li>Establish action plans</li>
<li>Perform risk analysis of each change</li>
<li>Test market the changes</li>
<li>Roll out full-scale changes</li>
<li>Evaluate effectiveness</li>
</ol>

<h2>Qualitative vs. Quantitative Assessment</h2>
<ul>
<li><strong>Qualitative:</strong> Subjective — opinions, attitudes, beliefs, feelings. Techniques: interviews, observation, focus groups, open-ended surveys.</li>
<li><strong>Quantitative:</strong> Objective — numbers, counts, measurements. Statistical analysis.</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>QLA</td><td>Quality-Level Agreement — internal service agreement between provider/receiver</td></tr>
<tr><td>B2B</td><td>Business-to-business customer relationship</td></tr>
<tr><td>B2C</td><td>Business-to-consumer customer relationship</td></tr>
<tr><td>Vital Few</td><td>Core customers representing the most critical/profitable segment</td></tr>
<tr><td>Internal Customer</td><td>Next operation/function receiving output within the organization</td></tr>
<tr><td>False Customer</td><td>Performs activities that don't add value</td></tr>
</tbody></table>
`},

17: { icon:'🤝', title:'Customer Relationship Management', bok:'V.B', part:'V',
content:`
<h2>Voice of the Customer (VOC)</h2>
<p>System for capturing customer needs and expectations. Sources: complaints, warranty data, surveys, focus groups, listening posts, market research, social media, joint planning meetings.</p>

<h2>Quality Function Deployment (QFD) — House of Quality</h2>
<p>Methodology to translate customer voice (qualitative) into technical requirements (operational).</p>
<table class="kt-table"><thead><tr><th>Section</th><th>Content</th></tr></thead><tbody>
<tr><td>A — What (left)</td><td>Customer wants and needs (VOC)</td></tr>
<tr><td>B — Importance (left)</td><td>Relative importance weighting by customer</td></tr>
<tr><td>C — Competitive (right)</td><td>Customer perceptions vs. competitors</td></tr>
<tr><td>D — How (top)</td><td>Technical/engineering characteristics</td></tr>
<tr><td>E — Relationships (center)</td><td>Strength of relationships between what and how</td></tr>
<tr><td>F — Importance (bottom)</td><td>Technical importance rating</td></tr>
<tr><td>G — Roof</td><td>Correlations between technical characteristics</td></tr>
<tr><td>H — Targets (bottom)</td><td>Technical benchmarks/targets</td></tr>
</tbody></table>
<div class="exam-tip">QFD cascades through 4 levels: Customer requirements → Design → Parts → Process → Production</div>

<h2>Kano Model — 5 Quality Categories</h2>
<table class="kt-table"><thead><tr><th>Category</th><th>Description</th><th>Example</th></tr></thead><tbody>
<tr><td>Must-be (Basic)</td><td>Causes dissatisfaction when absent; NO satisfaction when present (expected)</td><td>Seatbelts in a car</td></tr>
<tr><td>One-dimensional (Performance)</td><td>Linear: more = more satisfaction; less = less</td><td>Fuel economy</td></tr>
<tr><td>Attractive (Delighters)</td><td>Creates delight when present; NO dissatisfaction when absent</td><td>Heated seats (when new)</td></tr>
<tr><td>Indifferent</td><td>Neither satisfaction nor dissatisfaction regardless of presence</td><td>Internal system components</td></tr>
<tr><td>Reverse</td><td>Causes dissatisfaction when present; satisfaction when absent</td><td>Overly complex features</td></tr>
</tbody></table>
<div class="exam-tip">Key insight: Today's delighters become tomorrow's must-be's. Evolution of customer expectations is critical concept.</div>

<h2>Net Promoter Score (NPS)</h2>
<div class="formula">NPS = % Promoters (9-10) − % Detractors (0-6)  [Range: -100 to +100]</div>
<p>Passives score 7-8 and are excluded from the calculation.</p>

<h2>5 Levels of Customer Satisfaction</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Description</th><th>Outcome</th></tr></thead><tbody>
<tr><td>1</td><td>Dissatisfied</td><td>Departed customer</td></tr>
<tr><td>2</td><td>Marginally satisfied</td><td>Easily lost</td></tr>
<tr><td>3</td><td>Basically satisfied</td><td>Probably departed forever</td></tr>
<tr><td>4</td><td>Delighted</td><td>Return customer (retained)</td></tr>
<tr><td>5</td><td>Committed advocate</td><td>Loyal; tells others</td></tr>
</tbody></table>

<h2>5-Step Customer Recovery Process</h2>
<ol>
<li><strong>Apologize</strong> — Sincere apology; accept responsibility</li>
<li><strong>Restate</strong> — Confirm understanding; personally accept resolution responsibility</li>
<li><strong>Empathize</strong> — Genuine commitment to resolve</li>
<li><strong>Make Restitution</strong> — Specific action (free gift, discount, replacement)</li>
<li><strong>Follow Up</strong> — Check customer satisfaction after resolution</li>
</ol>

<h2>Complaint Handling Statistics</h2>
<ul>
<li>Only 9.5% of non-complainers with $100+ loss would repurchase</li>
<li>54.3% repurchase when complaint is resolved</li>
<li>Resolution speed significantly increases repurchase intent</li>
</ul>

<h2>Survey Methods Comparison</h2>
<table class="kt-table"><thead><tr><th>Method</th><th>Response Rate</th><th>Best For</th></tr></thead><tbody>
<tr><td>Mail/Written</td><td>30-50%</td><td>Periodic quantitative/qualitative</td></tr>
<tr><td>Telephone</td><td>Higher than mail</td><td>Functional areas, sales/service</td></tr>
<tr><td>In-person</td><td>Highest</td><td>Identifying important issues; probing for detail</td></tr>
<tr><td>E-mail/Web</td><td>Variable</td><td>Most popular; lowest cost; fastest</td></tr>
<tr><td>Observation/Mystery shopping</td><td>N/A</td><td>Monitoring policy deployment; training effectiveness</td></tr>
</tbody></table>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>CRM</td><td>Customer Relationship Management — coordinates all customer touchpoints</td></tr>
<tr><td>VOC</td><td>Voice of the Customer — system for capturing needs/expectations</td></tr>
<tr><td>QFD</td><td>Quality Function Deployment — translates VOC into technical requirements</td></tr>
<tr><td>Kano Model</td><td>5 categories: must-be, one-dimensional, attractive, indifferent, reverse</td></tr>
<tr><td>NPS</td><td>Net Promoter Score = % Promoters − % Detractors</td></tr>
<tr><td>ICALL</td><td>Informal Customer Acquisition Listening and Learning — listening post process</td></tr>
<tr><td>Customer Lifetime Value</td><td>Total financial value of a customer relationship over time</td></tr>
<tr><td>Must-be</td><td>Basic expectations causing dissatisfaction when absent</td></tr>
<tr><td>Attractive (Delighters)</td><td>Unexpected features creating high satisfaction</td></tr>
</tbody></table>
`},

18: { icon:'🔗', title:'Supply Chain Management', bok:'VI.A–G', part:'VI',
content:`
<h2>Supplier Selection Process (8 Steps)</h2>
<ol>
<li>Identify all possible sources</li>
<li>Evaluate reputations</li>
<li>Prepare bidders list</li>
<li>Request bids</li>
<li>Evaluate pre-award data</li>
<li>Select approved supplier list</li>
<li>Update the contracts</li>
<li>Prepare the contracts</li>
</ol>
<p>Selection done by <strong>cross-functional team</strong> (purchasing, engineering, production, quality, materials).</p>

<h2>Supplier Classification Ladder</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Requirements</th></tr></thead><tbody>
<tr><td>Approved</td><td>Meets minimum requirements of the organization</td></tr>
<tr><td>Qualified</td><td>Additional review — self-assessment, questionnaire, on-site audit</td></tr>
<tr><td>Certified</td><td>Demonstrated consistent quality over time; reduced/eliminated incoming inspection</td></tr>
</tbody></table>
<div class="exam-tip">Certification criteria include: No lot rejections for 1 year, process stable and in control, documented quality system evaluation, agreed-upon specification.</div>

<h2>Key Industry Standards</h2>
<ul>
<li><strong>ISO 9001:</strong> All industries — QMS requirements</li>
<li><strong>IATF 16949:</strong> Automotive quality standard</li>
<li><strong>AS9100:</strong> Aerospace quality standard</li>
<li><strong>ISO 13485:</strong> Medical devices</li>
</ul>

<h2>Supplier Risk Management Strategies</h2>
<table class="kt-table"><thead><tr><th>Risk Type</th><th>Strategies</th></tr></thead><tbody>
<tr><td>Threats (negative)</td><td>Escalate, Avoid, Transfer, Mitigate, Accept</td></tr>
<tr><td>Opportunities (positive)</td><td>Exploit, Enhance, Share, Accept</td></tr>
</tbody></table>

<h2>Supplier Performance Metrics</h2>
<ul>
<li>Defects (PPM — parts per million)</li>
<li>On-time delivery %</li>
<li>Responsiveness to corrective actions</li>
<li>Process capability (Cpk)</li>
<li>Cost/price performance</li>
<li>Technical support availability</li>
</ul>

<h2>Key Performance Indices</h2>
<ul>
<li><strong>QPI:</strong> Quality Performance Index</li>
<li><strong>CPI:</strong> Commodity Performance Index</li>
<li><strong>SPI:</strong> Supplier Performance Index</li>
<li><strong>DPI:</strong> Delivery Performance Index</li>
<li><strong>PPI:</strong> Past Performance Index</li>
</ul>

<h2>Supplier Communications</h2>
<p>Types of requirements to communicate: delivery, order quantities, corrective action processes, safety/security, environmental parameters, financial stability, ethical standards.</p>
<p><strong>Methods:</strong> Written specifications, SQA manual, samples, supplier visits, EDI, contracts, purchase orders, training.</p>

<h2>Push vs. Pull Systems</h2>
<ul>
<li><strong>Push system:</strong> Forecast-driven; materials pushed to next stage based on schedule</li>
<li><strong>Pull system:</strong> Demand-driven; material pulled by actual consumption (JIT/Ship-to-stock)</li>
</ul>

<h2>Supplier Certification Steps</h2>
<ol>
<li>Develop certification criteria and process steps</li>
<li>Evaluate selected suppliers against criteria</li>
<li>Ongoing monitoring of supplier performance</li>
</ol>

<h2>Deming's Principle</h2>
<p>"End the practice of awarding business on the basis of price tag alone." — Total cost of ownership, not just purchase price.</p>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>SCM</td><td>Supply Chain Management — planning, sourcing, making, delivery, returns</td></tr>
<tr><td>Strategic Sourcing</td><td>Process for reducing costs while improving quality and service</td></tr>
<tr><td>Approved Supplier</td><td>Meets minimum requirements</td></tr>
<tr><td>Certified Supplier</td><td>Consistent quality demonstrated; reduced incoming inspection</td></tr>
<tr><td>IATF 16949</td><td>Automotive quality standard</td></tr>
<tr><td>AS9100</td><td>Aerospace quality standard</td></tr>
<tr><td>Ship-to-Stock</td><td>Material received without incoming inspection (certified suppliers)</td></tr>
<tr><td>Supplier Alliance</td><td>Formalized relationship with shared fate and mutual benefits</td></tr>
<tr><td>Type I Risk (α)</td><td>Producer's risk — rejecting good product</td></tr>
<tr><td>Type II Risk (β)</td><td>Consumer's risk — accepting bad product</td></tr>
</tbody></table>
`},

19: { icon:'📚', title:'Training and Development', bok:'VII.A–D', part:'VII',
content:`
<h2>Training vs. Education</h2>
<table class="kt-table"><thead><tr><th>Aspect</th><th>Training</th><th>Education</th></tr></thead><tbody>
<tr><td>Focus</td><td>HOW to perform tasks (skill acquisition)</td><td>WHY and WHEN (knowledge; broader thinking)</td></tr>
<tr><td>Measurement</td><td>Can demonstrate the learned skill</td><td>Broadened knowledge base and thinking</td></tr>
<tr><td>Duration</td><td>Shorter; specific</td><td>Longer; conceptual</td></tr>
<tr><td>Example</td><td>Operating a CMM machine</td><td>Understanding statistics and DOE principles</td></tr>
</tbody></table>

<h2>ADDIE Instructional Design Model</h2>
<ol>
<li><strong>A — Analysis:</strong> Audience; what to teach; how to deliver; who participates</li>
<li><strong>D — Design:</strong> Objectives, methods, evaluation criteria; delivery strategies</li>
<li><strong>D — Development:</strong> Create/purchase training materials</li>
<li><strong>I — Implementation:</strong> Deliver training to target audience</li>
<li><strong>E — Evaluation:</strong> Determine results; continuous improvement</li>
</ol>

<h2>Bloom's Taxonomy (Cognitive Domain)</h2>
<p>Remember → Understand → Apply → Analyze → Evaluate → Create (low to high complexity)</p>
<p><em>The CMQ/OE BoK uses these levels to classify each exam question</em></p>

<h2>Mager & Pipe — Training Needs Diagnosis</h2>
<p><strong>Key question:</strong> "Could they do it if their life depended on it?"</p>
<ul>
<li><strong>YES</strong> → NOT a training problem. Look at: Job design (J), Consequences (C), Feedback (F)</li>
<li><strong>NO</strong> → Training solution (T) — skill/knowledge deficiency</li>
</ul>
<div class="exam-tip">This is the most important training diagnostic concept. If performance could improve without training, training is NOT the solution.</div>

<h2>Adult Learning Principles (Knowles — 6 Principles)</h2>
<ol>
<li>Adults have a deep need to be self-directing</li>
<li>Adults have a deep need to know WHY they should learn something</li>
<li>Adults become ready to learn when they experience a need</li>
<li>Adults are task/problem-centered in their learning orientation</li>
<li>Adults are motivated by both extrinsic and intrinsic motivators</li>
<li>Adults' prior experience is a rich resource for learning</li>
</ol>

<h2>Kirkpatrick / Phillips 5 Levels of Training Evaluation</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Name</th><th>Question</th><th>Note</th></tr></thead><tbody>
<tr><td>1</td><td>Reaction</td><td>Were participants pleased?</td><td>Smile sheets; lowest value</td></tr>
<tr><td>2</td><td>Learning</td><td>Did they learn what was intended?</td><td>Pre/post tests</td></tr>
<tr><td>3</td><td>Behavior</td><td>Was there positive behavior change on the job?</td><td>Supervisor observation</td></tr>
<tr><td>4</td><td>Results</td><td>Measurable organizational impact?</td><td>Most important</td></tr>
<tr><td>5</td><td>ROTI</td><td>What is the financial return?</td><td>Hardest to measure</td></tr>
</tbody></table>
<div class="formula">ROTI = Net Program Benefits ÷ Program Costs  (target: ≥ 3:1)</div>

<h2>Training Delivery Methods</h2>
<p><strong>On-the-Job Training (OJT):</strong> Tell them, show them, have them do it, repeat until standard met.</p>
<p><strong>E-learning gamification levels:</strong> 1=Partial (quiz in course), 2=Game-Based Learning, 3=Gamified Learning Path, 4=Gamified Portal</p>
<p><strong>Coaching:</strong> One-on-one; define goals → identify resources → observe → set expectations → schedule → commit → give feedback → follow up</p>

<h2>Juran's 6 Issues for Training Planning</h2>
<ol>
<li>Quality problems and challenges faced</li>
<li>Knowledge and skills needed to solve them</li>
<li>Existing training facilities and processes</li>
<li>Prevailing climate for training in the organization</li>
<li>What needs to be done differently</li>
<li>What needs top management support</li>
</ol>

<h2>KESSA Factors (Training Needs Assessment)</h2>
<p>Knowledge, Experience, Skills, Aptitude, Attitude</p>

<h2>Why Training Fails</h2>
<ul>
<li>Cultural resistance by line managers</li>
<li>No connection to strategic plans</li>
<li>No projected objectives established</li>
<li>Lack of management participation</li>
<li>Technique vs. problem orientation</li>
<li>Inadequate needs assessment</li>
</ul>

<h2>Key Terms</h2>
<table class="kt-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td>ADDIE</td><td>Analysis → Design → Development → Implementation → Evaluation</td></tr>
<tr><td>Bloom's Taxonomy</td><td>Remember → Understand → Apply → Analyze → Evaluate → Create</td></tr>
<tr><td>IDP</td><td>Individual Development Plan; goals, timelines, activities</td></tr>
<tr><td>ROTI</td><td>Return on Training Investment; target ≥ 3:1</td></tr>
<tr><td>Kirkpatrick Level 1</td><td>Reaction — smile sheets (lowest value)</td></tr>
<tr><td>Kirkpatrick Level 5</td><td>ROTI — financial return (highest value; hardest to measure)</td></tr>
<tr><td>Andragogy</td><td>Adult learning theory (Knowles)</td></tr>
<tr><td>Competency-Based Training</td><td>Learner-centered; mastery before advancing</td></tr>
</tbody></table>
`},

content:`
<h2>Exam Blueprint</h2>
<table class="kt-table"><thead><tr><th>Domain</th><th>Title</th><th>Questions</th><th>Weight</th></tr></thead><tbody>
<tr><td>I</td><td>Leadership</td><td>28</td><td>17.0%</td></tr>
<tr><td>II</td><td>Strategic Plan Development & Deployment</td><td>22</td><td>13.3%</td></tr>
<tr><td>III</td><td>Management Elements and Methods</td><td>31</td><td>18.8%</td></tr>
<tr><td>IV</td><td>Quality Management Tools</td><td>30</td><td>18.2%</td></tr>

</tbody></table>
<div class="exam-tip">Study Priority: Domains III + IV = 37% of exam. Master these first. Domains I + II = 30%. Together these 4 domains = 67% of all questions.</div>

<h2>Key Formulas — Quick Reference</h2>
<table class="kt-table"><thead><tr><th>Formula</th><th>Expression</th><th>Context</th></tr></thead><tbody>
<tr><td>RPN</td><td>S × O × D</td><td>FMEA risk priority (IV.A.3)</td></tr>
<tr><td>PERT Time</td><td>(O + 4M + P) / 6</td><td>Project estimation (III.C.2)</td></tr>
<tr><td>Cp</td><td>(USL - LSL) / 6σ</td><td>Process capability potential (IV.C.7)</td></tr>
<tr><td>Cpk</td><td>min[(USL-μ)/3σ, (μ-LSL)/3σ]</td><td>Process capability actual (IV.C.7)</td></tr>
<tr><td>OEE</td><td>Availability × Performance × Quality</td><td>Lean metric (IV.B.3)</td></tr>
<tr><td>Availability</td><td>MTBF / (MTBF + MTTR)</td><td>Reliability (IV.C.8)</td></tr>
<tr><td>NPS</td><td>%Promoters − %Detractors</td><td>Customer loyalty (V.B.1)</td></tr>
<tr><td>ROTI</td><td>Net Benefits / Program Costs</td><td>Training ROI (VII.D)</td></tr>
<tr><td>CPI</td><td>EV / AC</td><td>Project cost performance (III.C.3)</td></tr>
<tr><td>SPI</td><td>EV / PV</td><td>Project schedule performance (III.C.3)</td></tr>
<tr><td>Total COQ</td><td>Prevention + Appraisal + Internal + External Failure</td><td>Cost of Quality (IV.A.5)</td></tr>
<tr><td>Takt Time</td><td>Available Time / Customer Demand</td><td>Lean (IV.B.3)</td></tr>
<tr><td>Little's Law</td><td>WIP = Throughput × Lead Time</td><td>Lean/TOC (IV.B.3)</td></tr>
</tbody></table>

<h2>Bloom's Taxonomy — Exam Levels</h2>
<table class="kt-table"><thead><tr><th>Level</th><th>Action Words</th><th>Complexity</th></tr></thead><tbody>
<tr><td>1. Remember</td><td>Recall, list, define, identify</td><td>Lowest</td></tr>
<tr><td>2. Understand</td><td>Describe, explain, summarize, interpret</td><td>Low</td></tr>
<tr><td>3. Apply</td><td>Use, demonstrate, execute, implement</td><td>Medium</td></tr>
<tr><td>4. Analyze</td><td>Differentiate, compare, examine, break down</td><td>Medium-High</td></tr>
<tr><td>5. Evaluate</td><td>Judge, assess, justify, determine</td><td>High</td></tr>
<tr><td>6. Create</td><td>Design, develop, formulate, construct</td><td>Highest</td></tr>
</tbody></table>

<h2>Cross-Cutting Themes</h2>
<ul>
<li><strong>Cost of Quality</strong> (IV.A.5, II, III, VI)</li>
<li><strong>Risk Management</strong> (II.B.1, III.A.6, VI.B)</li>
<li><strong>PDCA / Continuous Improvement</strong> (IV.A.3, III.D, III.E.3)</li>
<li><strong>Stakeholder Analysis</strong> (II.B.3, V.A, VI)</li>
<li><strong>Performance Measurement</strong> (II.C.3, III.C.3, VII.D)</li>
<li><strong>ISO 9001 Requirements</strong> (III.D, III.E.1, VI.A, VII.C)</li>
</ul>

<h2>Exam Strategy</h2>
<ul>
<li><strong>Time:</strong> 165 questions in ~5 hours = ~1.8 min per question</li>
<li><strong>Flag and move on</strong> if stuck — come back later</li>
<li>Most questions are scenario-based — apply principles to practical situations</li>
<li>Look for "best" answer — often 2 answers seem correct but one is more comprehensive</li>
<li>Ethics questions: public safety ALWAYS trumps other considerations</li>
<li>Bring real-world experience as a quality leader to anchor abstract concepts</li>
</ul>

<h2>Top Must-Know Concepts by Domain</h2>
<h3>Domain I — Leadership</h3>
<p>Kotter 8 steps, Tuckman 5 stages, Goleman EI 5 dimensions, Hersey-Blanchard situational leadership, ASQ Code 3 pillars, Maslow/Herzberg motivation</p>
<h3>Domain II — Strategic Planning</h3>
<p>Hoshin Kanri + catchball, SWOT (internal/external), Porter's 5 forces, Balanced Scorecard, SMART objectives, cascading deployment</p>
<h3>Domain III — Management Elements</h3>
<p>POSDC, Theory X/Y, Blake-Mouton 9,9, Deming 14 points, ISO 9001 sections, Baldrige 7 categories, Financial ratios, ISO 31000 risk, FMEA</p>
<h3>Domain IV — Quality Tools</h3>
<p>7 classic tools, 7 management tools, DMAIC, FMEA (RPN=S×O×D), Six Sigma levels, 5 Wastes, 5S, VSM, Takt time, OEE, Cp/Cpk, common vs. special cause, COQ 4 categories</p>
<h3>Domain V — Customer</h3>
<p>Kano model (5 categories), QFD house of quality, NPS formula, 5-level satisfaction, VOC system, 5-step recovery, 6 customer types</p>
<h3>Domain VI — Supply Chain</h3>
<p>8-step selection process, approved/qualified/certified ladder, risk strategies (EATMA/EESA), supplier metrics, certification standards</p>
<h3>Domain VII — Training</h3>
<p>Training vs. education, ADDIE, Bloom's taxonomy, Kirkpatrick 5 levels, Mager & Pipe diagnosis, ROTI formula, adult learning 6 principles</p>
`}

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let currentChapter = null;
const done = new Set(JSON.parse(localStorage.getItem('asq-done') || '[]'));

function saveDone() {
  localStorage.setItem('asq-done', JSON.stringify([...done]));
}

// ═══════════════════════════════════════════════
// NAV RENDERING
// ═══════════════════════════════════════════════
function renderNav() {
  const nav = document.getElementById('nav-area');
  let html = '';
  PARTS.forEach(p => {
    html += `<div class="part-label"><span class="part-icon">${p.icon}</span>Part ${p.id} — ${p.title}</div>`;
    p.chapters.forEach(n => {
      const ch = CHAPTERS[n];
      const isDone = done.has(n);
      html += `<div class="nav-item${isDone?' done':''}" id="nav-${n}" onclick="loadChapter(${n})">
        <span class="ch-icon">${ch.icon}</span>
        <span class="ch-title">Ch.${n}: ${ch.title}</span>
        <span class="done-badge">✓</span>
      </div>`;
    });
  });
  nav.innerHTML = html;
  updateProgress();
}

function updateProgress() {
  const total = 20;
  const count = done.size;
  document.getElementById('progress-text').textContent = `${count} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(count/total)*100}%`;
  // Update nav items
  done.forEach(n => {
    const el = document.getElementById(`nav-${n}`);
    if(el) el.classList.add('done');
  });
}

// ═══════════════════════════════════════════════
// CHAPTER LOADING
// ═══════════════════════════════════════════════
function loadChapter(n) {
  currentChapter = n;
  const ch = CHAPTERS[n];
  const partObj = PARTS.find(p => p.id === ch.part);

  // Update active nav
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById(`nav-${n}`);
  if(navEl) {
    navEl.classList.add('active');
    navEl.scrollIntoView({ block: 'nearest' });
  }

  // Update breadcrumb
  document.getElementById('breadcrumb').innerHTML = `<span>Part ${ch.part}</span> / <span>Ch.${n}: ${ch.title}</span>`;

  // Show mark done button
  const btn = document.getElementById('mark-done-btn');
  btn.style.display = 'block';
  btn.textContent = done.has(n) ? '✓ Done' : 'Mark Done ✓';
  btn.style.background = done.has(n) ? 'var(--accent3)' : '';
  btn.style.color = done.has(n) ? '#000' : '';
  btn.style.borderColor = done.has(n) ? 'var(--accent3)' : '';

  // Find prev/next
  const allChs = PARTS.flatMap(p => p.chapters);
  const idx = allChs.indexOf(n);
  const prev = idx > 0 ? allChs[idx-1] : null;
  const next = idx < allChs.length-1 ? allChs[idx+1] : null;

  document.getElementById('content').innerHTML = `
    <div class="ch-header">
      <div class="ch-header-icon">${ch.icon}</div>
      <div class="ch-header-part"><span class="tag tag-domain">Part ${ch.part} — ${partObj.title}</span> &nbsp;<span class="tag tag-level">BoK ${ch.bok}</span></div>
      <div class="ch-header-title">Chapter ${n}: ${ch.title}</div>
    </div>
    ${ch.content}
    <div class="ch-nav">
      <button class="ch-nav-btn${!prev?' disabled':''}" onclick="${prev?`loadChapter(${prev})`:''}">&larr; ${prev ? 'Ch.'+prev+': '+CHAPTERS[prev].title : 'Start'}</button>
      <button class="ch-nav-btn${!next?' disabled':''}" onclick="${next?`loadChapter(${next})`:''}">${next ? 'Ch.'+next+': '+CHAPTERS[next].title : 'End'} &rarr;</button>
    </div>
  `;

  window.scrollTo(0,0);
}

function markDone() {
  if(!currentChapter) return;
  if(done.has(currentChapter)) {
    done.delete(currentChapter);
  } else {
    done.add(currentChapter);
  }
  saveDone();
  const btn = document.getElementById('mark-done-btn');
  const isDone = done.has(currentChapter);
  btn.textContent = isDone ? '✓ Done' : 'Mark Done ✓';
  btn.style.background = isDone ? 'var(--accent3)' : '';
  btn.style.color = isDone ? '#000' : '';
  btn.style.borderColor = isDone ? 'var(--accent3)' : '';
  const navEl = document.getElementById(`nav-${currentChapter}`);
  if(navEl) navEl.classList.toggle('done', isDone);
  updateProgress();
}

// ═══════════════════════════════════════════════
// HOME PAGE
// ═══════════════════════════════════════════════
function loadHome() {
  currentChapter = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('breadcrumb').innerHTML = 'Home';
  document.getElementById('mark-done-btn').style.display = 'none';

  const domains = [
    {id:'I',q:28,pct:17.0},
    {id:'II',q:22,pct:13.3},

      </div>
    </div>
    <div class="exam-blueprint">
      <h2>Exam Blueprint</h2>
      ${domains.map(d => `
      <div class="domain-row" onclick="loadChapter(${d.id==='I'?1:d.id==='II'?5:d.id==='III'?8:d.id==='IV'?13:d.id==='V'?16:d.id==='VI'?18:19})" style="cursor:pointer">

      <div style="margin-top:24px;padding:16px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text-muted);line-height:1.7">

      </div>
    </div>

// ═══════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if(q.length < 2) { searchResults.style.display = 'none'; return; }

  const results = [];
  Object.entries(CHAPTERS).forEach(([n, ch]) => {
    const text = (ch.title + ' ' + ch.content).toLowerCase();
    const idx = text.indexOf(q);
    if(idx !== -1) {
      const raw = (ch.title + ' ' + ch.content).substring(Math.max(0, idx-40), idx+80);
      const ctx = raw.replace(/<[^>]+>/g, '').replace(/\s+/g,' ');
      const highlighted = ctx.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m => `<span class="sr-hi">${m}</span>`);
      results.push({ n: parseInt(n), ch, ctx: highlighted });
    }
  });

  if(results.length === 0) {
    searchResults.innerHTML = '<div class="search-result-item"><div class="sr-ctx" style="color:var(--text-muted)">No results found</div></div>';
  } else {
    searchResults.innerHTML = results.slice(0,8).map(r =>
      `<div class="search-result-item" onclick="loadChapter(${r.n});clearSearch()">
        <div class="sr-ch">${r.ch.icon} Ch.${r.n}: ${r.ch.title}</div>
        <div class="sr-ctx">${r.ctx}</div>
      </div>`
    ).join('');
  }
  searchResults.style.display = 'block';
});

document.addEventListener('click', e => {
  if(!document.getElementById('search-box').contains(e.target)) {
    searchResults.style.display = 'none';
  }
});

function clearSearch() {
  searchInput.value = '';
  searchResults.style.display = 'none';
}

// ═══════════════════════════════════════════════
// MOBILE
// ═══════════════════════════════════════════════
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
});

// Close sidebar on nav click (mobile)
document.getElementById('nav-area').addEventListener('click', () => {
  if(window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
renderNav();
loadHome();

// Home link on logo click
document.querySelector('.sidebar-logo').style.cursor = 'pointer';
document.querySelector('.sidebar-logo').addEventListener('click', loadHome);
document.querySelector('.sidebar-title').style.cursor = 'pointer';
document.querySelector('.sidebar-title').addEventListener('click', loadHome);
</script>
